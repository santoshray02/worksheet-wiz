<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hull front view (V-shape) -->
    <path d="M15,55 C15,53 20,50 25,48 L75,48 C80,50 85,53 85,55 L85,62 C85,66 80,70 72,72 C62,74 38,74 28,72 C20,70 15,66 15,62 Z"
          fill="#c75b5b" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Hull keel -->
    <path d="M50,74 L50,80 C50,82 48,83 50,83 C52,83 50,82 50,80"
          stroke-width="2"/>
    <!-- Deck -->
    <path d="M22,50 L78,50" stroke-width="1.5" opacity="0.5"/>
    <!-- Cabin front -->
    <path d="M30,48 L30,32 C30,30 32,28 35,28 L65,28 C68,28 70,30 70,32 L70,48"
          fill="#e8e8e8" fill-opacity="0.8" stroke-width="2"/>
    <!-- Cabin window (large front window) -->
    <path d="M35,33 L65,33 L65,44 L35,44 Z"
          fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <!-- Window dividers -->
    <line x1="45" y1="33" x2="45" y2="44" stroke-width="1"/>
    <line x1="55" y1="33" x2="55" y2="44" stroke-width="1"/>
    <!-- Mast -->
    <line x1="50" y1="28" x2="50" y2="14" stroke-width="1.5"/>
    <!-- Radar/antenna -->
    <path d="M45,16 L55,16" stroke-width="1.3"/>
    <circle cx="50" cy="14" r="1.5" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Railing -->
    <path d="M22,48 L22,44" stroke-width="1"/>
    <path d="M78,48 L78,44" stroke-width="1"/>
    <path d="M22,44 L30,44" stroke-width="0.8" opacity="0.5"/>
    <path d="M70,44 L78,44" stroke-width="0.8" opacity="0.5"/>
    <!-- Water waves -->
    <path d="M2,78 C10,76 18,78 26,76 C34,75 42,77 50,76 C58,75 66,77 74,76 C82,75 90,77 98,76"
          stroke="#5b8cc7" stroke-width="1.5" opacity="0.5"/>
    <path d="M5,82 C13,80 21,82 29,81 C37,80 45,82 53,81 C61,80 69,82 77,81 C85,80 93,82 97,81"
          stroke="#5b8cc7" stroke-width="1" opacity="0.35"/>
    <!-- Reflection in water -->
    <path d="M35,76 L40,82 M50,75 L50,81 M65,76 L60,82"
          stroke="#c75b5b" stroke-width="0.8" opacity="0.2"/>
  </g>
</svg>