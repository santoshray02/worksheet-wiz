<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Train body front -->
    <path d="M22,18 L78,18 C82,18 85,21 85,25 L85,68 C85,72 82,74 78,74 L22,74 C18,74 15,72 15,68 L15,25 C15,21 18,18 22,18 Z"
          fill="#7bc77b" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Front window (large) -->
    <path d="M25,22 L75,22 C77,22 78,23 78,25 L78,42 C78,44 77,45 75,45 L25,45 C23,45 22,44 22,42 L22,25 C22,23 23,22 25,22 Z"
          fill="#87ceeb" fill-opacity="0.75" stroke-width="1.5"/>
    <!-- Window divider -->
    <line x1="50" y1="22" x2="50" y2="45" stroke-width="1.5"/>
    <!-- Destination sign -->
    <rect x="30" y="14" width="40" height="5" rx="1" fill="#333" fill-opacity="0.6" stroke-width="1"/>
    <!-- Stripe -->
    <path d="M15,50 L85,50" stroke="#c7c75b" stroke-width="3" opacity="0.5"/>
    <!-- Headlight center -->
    <ellipse cx="50" cy="56" rx="5" ry="4.5" fill="#c7c75b" fill-opacity="0.85" stroke-width="1.3"/>
    <!-- Left marker light -->
    <ellipse cx="25" cy="56" rx="3" ry="2.5" fill="#c75b5b" fill-opacity="0.8" stroke-width="1.1"/>
    <!-- Right marker light -->
    <ellipse cx="75" cy="56" rx="3" ry="2.5" fill="#c75b5b" fill-opacity="0.8" stroke-width="1.1"/>
    <!-- Coupling/buffer -->
    <rect x="44" y="72" width="12" height="5" rx="2" fill="#888" fill-opacity="0.5" stroke-width="1.3"/>
    <!-- Cow catcher -->
    <path d="M18,74 L12,82 L88,82 L82,74"
          fill="#888" fill-opacity="0.4" stroke-width="1.8"/>
    <!-- Number plate -->
    <rect x="38" y="62" width="24" height="8" rx="1.5" fill="#e8e8e8" fill-opacity="0.6" stroke-width="1.2"/>
    <!-- Left wheel -->
    <ellipse cx="18" cy="82" rx="6" ry="5" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2"/>
    <!-- Right wheel -->
    <ellipse cx="82" cy="82" rx="6" ry="5" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2"/>
    <!-- Smokestack top -->
    <path d="M45,14 L45,8 C45,6 46,5 48,5 L52,5 C54,5 55,6 55,8 L55,14"
          fill="#555" fill-opacity="0.5" stroke-width="1.3"/>
    <!-- Track -->
    <path d="M5,87 L95,87" stroke-width="2" opacity="0.4"/>
    <path d="M5,89 L95,89" stroke-width="2" opacity="0.4"/>
    <!-- Ties -->
    <line x1="15" y1="86" x2="15" y2="90" stroke-width="1.5" opacity="0.3"/>
    <line x1="35" y1="86" x2="35" y2="90" stroke-width="1.5" opacity="0.3"/>
    <line x1="55" y1="86" x2="55" y2="90" stroke-width="1.5" opacity="0.3"/>
    <line x1="75" y1="86" x2="75" y2="90" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>