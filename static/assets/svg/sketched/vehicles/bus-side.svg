<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bus body -->
    <path d="M8,35 C8,30 10,27 14,26 L86,26 C90,27 92,30 92,35 L92,68 C92,70 91,72 89,72 L11,72 C9,72 8,70 8,68 Z"
          fill="#c7c75b" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Stripe -->
    <path d="M8,50 L92,50" stroke="#e8a030" stroke-width="3" opacity="0.6"/>
    <!-- Windows -->
    <rect x="14" y="32" width="10" height="14" rx="2" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <rect x="27" y="32" width="10" height="14" rx="2" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <rect x="40" y="32" width="10" height="14" rx="2" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <rect x="53" y="32" width="10" height="14" rx="2" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <rect x="66" y="32" width="10" height="14" rx="2" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <!-- Windshield -->
    <path d="M80,31 L88,31 C90,31 91,33 91,35 L91,46 L80,46 Z" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <!-- Door -->
    <rect x="80" y="52" width="8" height="18" rx="1.5" stroke-width="1.3"/>
    <line x1="84" y1="52" x2="84" y2="70" stroke-width="1"/>
    <!-- Front wheel -->
    <ellipse cx="22" cy="74" rx="8.5" ry="8" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2.2"/>
    <ellipse cx="22" cy="74" rx="3.5" ry="3.2" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Rear wheel -->
    <ellipse cx="78" cy="74" rx="8.5" ry="8" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2.2"/>
    <ellipse cx="78" cy="74" rx="3.5" ry="3.2" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Headlight -->
    <ellipse cx="92" cy="58" rx="2" ry="3" fill="#c7c75b" fill-opacity="0.85" stroke-width="1"/>
    <!-- Taillight -->
    <ellipse cx="8" cy="58" rx="1.5" ry="2.5" fill="#c75b5b" fill-opacity="0.85" stroke-width="1"/>
    <!-- Bumpers -->
    <line x1="6" y1="72" x2="12" y2="72" stroke-width="2"/>
    <line x1="88" y1="72" x2="94" y2="72" stroke-width="2"/>
    <!-- Ground line -->
    <path d="M3,83 C20,82.5 50,83.2 75,82.7 C90,83 97,82.8 97,83" stroke-width="1" opacity="0.3"/>
  </g>
</svg>