<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Rocket body (slightly tilted for dynamism) -->
    <path d="M44,5 C45,2.5 47,1 49,1 C51,1 53,2.5 54,5 L57,25 L59,48 L59,62 C59,64 57,66 55,66 L43,66 C41,66 39,64 39,62 L39,48 L41,25 Z"
          fill="#e8e8e8" fill-opacity="0.85" stroke-width="2.5"/>
    <!-- Nose cone color -->
    <path d="M44,12 C45,7 47,3 49,1 C51,3 53,7 54,12 L54,17 L44,17 Z"
          fill="#c75b5b" fill-opacity="0.75" stroke-width="1.5"/>
    <!-- Window/porthole -->
    <circle cx="49" cy="26" r="4.5" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.3"/>
    <circle cx="49" cy="26" r="2.5" fill="#5b8cc7" fill-opacity="0.4" stroke-width="0.8"/>
    <!-- Body stripes -->
    <path d="M40.5,40 L57.5,40" stroke="#c75b5b" stroke-width="2" opacity="0.5"/>
    <path d="M40,44 L58,44" stroke="#c75b5b" stroke-width="2" opacity="0.5"/>
    <!-- Left fin -->
    <path d="M39,52 L27,68 C26,70 26,72 28,72 L39,66"
          fill="#c75b5b" fill-opacity="0.75" stroke-width="2"/>
    <!-- Right fin -->
    <path d="M59,52 L71,68 C72,70 72,72 70,72 L59,66"
          fill="#c75b5b" fill-opacity="0.75" stroke-width="2"/>
    <!-- Engine nozzle -->
    <path d="M43,66 L41,72 C40,74 42,75 45,75 L53,75 C56,75 58,74 57,72 L55,66"
          fill="#888" fill-opacity="0.6" stroke-width="1.5"/>
    <!-- FIRE AND FLAMES -->
    <!-- Main flame center -->
    <path d="M45,75 C44,80 42,86 44,92 C45,95 47,97 49,98 C51,97 53,95 54,92 C56,86 54,80 53,75"
          fill="#c7c75b" fill-opacity="0.85" stroke-width="1.5" stroke="#c75b5b"/>
    <!-- Inner flame -->
    <path d="M46,76 C45,82 44,87 46,92 C47,94 49,95 49,95 C49,95 51,94 52,92 C54,87 53,82 52,76"
          fill="#c75b5b" fill-opacity="0.7" stroke="none"/>
    <!-- Outer flame left -->
    <path d="M42,74 C40,78 37,82 36,86 C35,88 36,89 38,87 C40,85 42,80 43,76"
          fill="#c7c75b" fill-opacity="0.6" stroke-width="1" stroke="#e8a030"/>
    <!-- Outer flame right -->
    <path d="M56,74 C58,78 61,82 62,86 C63,88 62,89 60,87 C58,85 56,80 55,76"
          fill="#c7c75b" fill-opacity="0.6" stroke-width="1" stroke="#e8a030"/>
    <!-- Smoke puffs left -->
    <circle cx="30" cy="80" r="5" fill="#ddd" fill-opacity="0.45" stroke-width="0.8"/>
    <circle cx="24" cy="85" r="6" fill="#ddd" fill-opacity="0.35" stroke-width="0.8"/>
    <circle cx="20" cy="90" r="7" fill="#ddd" fill-opacity="0.25" stroke-width="0.8"/>
    <!-- Smoke puffs right -->
    <circle cx="68" cy="80" r="5" fill="#ddd" fill-opacity="0.45" stroke-width="0.8"/>
    <circle cx="74" cy="85" r="6" fill="#ddd" fill-opacity="0.35" stroke-width="0.8"/>
    <circle cx="78" cy="90" r="7" fill="#ddd" fill-opacity="0.25" stroke-width="0.8"/>
    <!-- Smoke puffs bottom -->
    <circle cx="42" cy="95" r="5" fill="#ddd" fill-opacity="0.3" stroke-width="0.7"/>
    <circle cx="56" cy="95" r="5" fill="#ddd" fill-opacity="0.3" stroke-width="0.7"/>
    <!-- Speed lines -->
    <line x1="35" y1="20" x2="30" y2="28" stroke-width="1" opacity="0.3"/>
    <line x1="63" y1="20" x2="68" y2="28" stroke-width="1" opacity="0.3"/>
    <line x1="34" y1="35" x2="28" y2="40" stroke-width="1" opacity="0.3"/>
    <line x1="64" y1="35" x2="70" y2="40" stroke-width="1" opacity="0.3"/>
    <!-- Rivets -->
    <circle cx="45" cy="35" r="0.8" fill="#888" fill-opacity="0.4"/>
    <circle cx="53" cy="35" r="0.8" fill="#888" fill-opacity="0.4"/>
    <circle cx="45" cy="50" r="0.8" fill="#888" fill-opacity="0.4"/>
    <circle cx="53" cy="50" r="0.8" fill="#888" fill-opacity="0.4"/>
  </g>
</svg>