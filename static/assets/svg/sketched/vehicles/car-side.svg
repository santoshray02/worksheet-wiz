<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Car body -->
    <path d="M12,62 C12,62 14,58 20,55 C22,54 30,53 35,42 C37,38 42,33 50,32 C58,31 65,33 68,35 C72,37 78,52 80,54 C85,55 90,57 91,62 C91,65 90,68 88,68 L14,68 C12,68 11,65 12,62 Z"
          fill="#c75b5b" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Roof line -->
    <path d="M35,42 C37,37 43,33 50,32 C58,31 65,34 68,36"
          stroke-width="2" fill="none"/>
    <!-- Windows -->
    <path d="M38,44 C39,39 44,36 50,35.5 C53,35.5 53,35.5 53,44 Z"
          fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <path d="M56,44 C56,36 60,36 64,38 C67,40 69,47 70,52 L56,52 Z"
          fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <!-- Front wheel -->
    <ellipse cx="28" cy="70" rx="9" ry="8.5" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2.2"/>
    <ellipse cx="28" cy="70" rx="4" ry="3.8" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Rear wheel -->
    <ellipse cx="74" cy="70" rx="9" ry="8.5" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2.2"/>
    <ellipse cx="74" cy="70" rx="4" ry="3.8" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Headlight -->
    <ellipse cx="89" cy="60" rx="3" ry="2.5" fill="#c7c75b" fill-opacity="0.85" stroke-width="1.2"/>
    <!-- Taillight -->
    <ellipse cx="13" cy="60" rx="2" ry="2" fill="#c75b5b" fill-opacity="0.9" stroke-width="1"/>
    <!-- Door handle -->
    <line x1="52" y1="50" x2="57" y2="50" stroke-width="1.3"/>
    <!-- Ground line -->
    <path d="M5,79 C20,78.5 40,79.2 60,78.8 C80,79.1 95,78.7 97,79" stroke-width="1" opacity="0.3"/>
  </g>
</svg>