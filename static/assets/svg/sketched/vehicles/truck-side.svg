<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cargo container -->
    <path d="M5,30 L62,30 C63,30 64,31 64,32 L64,68 C64,69 63,70 62,70 L5,70 C4,70 3,69 3,68 L3,32 C3,31 4,30 5,30 Z"
          fill="#5b8cc7" fill-opacity="0.75" stroke-width="2.5"/>
    <!-- Container detail lines -->
    <line x1="3" y1="45" x2="64" y2="45" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="30" x2="20" y2="70" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="30" x2="40" y2="70" stroke-width="1" opacity="0.3"/>
    <!-- Cab -->
    <path d="M64,40 L64,32 C64,31 65,30 66,30 L80,30 C85,30 90,35 92,42 L93,48 C94,50 95,52 95,55 L95,68 C95,70 94,72 92,72 L64,72 L64,40 Z"
          fill="#c75b5b" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Cab window -->
    <path d="M68,34 L80,34 C83,34 87,38 89,44 L89,48 L68,48 Z"
          fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <!-- Door -->
    <rect x="68" y="50" width="14" height="18" rx="1.5" stroke-width="1.2"/>
    <circle cx="80" cy="60" r="1.2" fill="#3a3a3a" fill-opacity="0.5"/>
    <!-- Front wheel -->
    <ellipse cx="80" cy="75" rx="9" ry="8.5" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2.2"/>
    <ellipse cx="80" cy="75" rx="4" ry="3.7" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Rear wheel 1 -->
    <ellipse cx="20" cy="75" rx="9" ry="8.5" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2.2"/>
    <ellipse cx="20" cy="75" rx="4" ry="3.7" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Rear wheel 2 -->
    <ellipse cx="42" cy="75" rx="9" ry="8.5" fill="#4a4a4a" fill-opacity="0.8" stroke-width="2.2"/>
    <ellipse cx="42" cy="75" rx="4" ry="3.7" fill="#888" fill-opacity="0.6" stroke-width="1"/>
    <!-- Headlight -->
    <ellipse cx="95" cy="55" rx="2" ry="3" fill="#c7c75b" fill-opacity="0.85" stroke-width="1"/>
    <!-- Exhaust pipe -->
    <path d="M64,32 L64,25 C64,24 65,23 66,23" stroke-width="1.5"/>
    <!-- Ground line -->
    <path d="M1,84 C20,83.5 50,84.2 75,83.7 C90,84 98,83.8 98,84" stroke-width="1" opacity="0.3"/>
  </g>
</svg>