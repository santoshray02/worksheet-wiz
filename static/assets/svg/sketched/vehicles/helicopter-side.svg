<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main body/fuselage -->
    <path d="M25,45 C22,42 22,38 25,35 C28,32 35,30 45,30 L60,30 C68,30 75,33 78,37 C80,40 80,44 78,47 C76,50 70,53 60,54 L45,54 C35,54 28,52 25,48 Z"
          fill="#5b8cc7" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Cockpit window -->
    <path d="M60,33 C65,33 70,35 73,38 C75,40 75,43 73,45 L68,45 C66,45 63,43 62,40 L60,33 Z"
          fill="#87ceeb" fill-opacity="0.75" stroke-width="1.2"/>
    <!-- Tail boom -->
    <path d="M25,40 L8,35 C6,34 5,33 6,32 C7,31 9,31 12,32 L25,36"
          fill="#5b8cc7" fill-opacity="0.7" stroke-width="2"/>
    <!-- Tail rotor -->
    <path d="M6,28 C5,24 4,20 6,18 C7,17 8,18 8,22 L8,32 C8,36 7,40 6,42 C5,43 4,42 5,38 L6,28"
          fill="none" stroke-width="1.5"/>
    <circle cx="6" cy="32" r="2" fill="#888" fill-opacity="0.5" stroke-width="1"/>
    <!-- Main rotor mast -->
    <line x1="52" y1="30" x2="52" y2="22" stroke-width="2"/>
    <!-- Main rotor blades -->
    <path d="M10,21 C20,19 35,20 52,22 C70,20 82,19 92,21"
          stroke-width="2.5" stroke="#555"/>
    <path d="M10,21 C10,20 11,19 12,20" stroke-width="1.5"/>
    <path d="M92,21 C92,20 91,19 90,20" stroke-width="1.5"/>
    <!-- Rotor hub -->
    <circle cx="52" cy="22" r="2.5" fill="#888" fill-opacity="0.6" stroke-width="1.2"/>
    <!-- Landing skids -->
    <path d="M35,54 L35,62 C35,63 34,64 33,64 L30,64"
          stroke-width="1.8"/>
    <path d="M60,54 L60,62 C60,63 61,64 62,64 L65,64"
          stroke-width="1.8"/>
    <path d="M25,64 L70,64" stroke-width="2.2"/>
    <!-- Cross strut -->
    <path d="M38,58 L57,58" stroke-width="1" opacity="0.4"/>
    <!-- Door line -->
    <line x1="50" y1="34" x2="50" y2="52" stroke-width="1.2" opacity="0.5"/>
    <!-- Door handle -->
    <circle cx="52" cy="44" r="1" fill="#3a3a3a" fill-opacity="0.4"/>
    <!-- Detail on body -->
    <path d="M30,38 L40,38" stroke-width="1" opacity="0.3"/>
    <!-- Ground line -->
    <path d="M15,70 C30,69.5 50,70.2 70,69.7 C85,70 90,69.8 90,70" stroke-width="1" opacity="0.3"/>
  </g>
</svg>