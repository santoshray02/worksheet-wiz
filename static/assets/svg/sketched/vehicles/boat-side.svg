<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hull -->
    <path d="M8,58 C8,56 10,54 15,52 L75,52 C82,52 90,54 94,58 C96,60 95,64 92,66 C88,68 78,70 65,71 C50,72 30,72 20,71 C12,70 8,68 6,66 C4,64 6,60 8,58 Z"
          fill="#c75b5b" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Deck line -->
    <path d="M15,54 L82,54" stroke-width="1.5" opacity="0.5"/>
    <!-- Cabin -->
    <path d="M30,52 L30,38 C30,36 32,34 34,34 L60,34 C62,34 64,36 64,38 L64,52"
          fill="#e8e8e8" fill-opacity="0.8" stroke-width="2"/>
    <!-- Cabin windows -->
    <rect x="35" y="39" width="7" height="6" rx="1.5" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.1"/>
    <rect x="45" y="39" width="7" height="6" rx="1.5" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.1"/>
    <rect x="55" y="39" width="7" height="6" rx="1.5" fill="#87ceeb" fill-opacity="0.75" stroke-width="1.1"/>
    <!-- Cabin roof -->
    <path d="M28,38 L66,38" stroke-width="1.5"/>
    <!-- Smokestack -->
    <path d="M55,34 L55,25 C55,24 56,23 57,23 L59,23 C60,23 61,24 61,25 L61,34"
          fill="#c7c75b" fill-opacity="0.7" stroke-width="1.5"/>
    <!-- Smoke puffs -->
    <circle cx="58" cy="19" r="3" fill="#ddd" fill-opacity="0.5" stroke-width="0.8"/>
    <circle cx="62" cy="16" r="2.5" fill="#ddd" fill-opacity="0.4" stroke-width="0.8"/>
    <circle cx="56" cy="14" r="2" fill="#ddd" fill-opacity="0.3" stroke-width="0.8"/>
    <!-- Mast/antenna -->
    <line x1="47" y1="34" x2="47" y2="22" stroke-width="1.3"/>
    <!-- Flag -->
    <path d="M47,22 L55,24 L47,27" fill="#c75b5b" fill-opacity="0.6" stroke-width="1"/>
    <!-- Porthole on hull -->
    <circle cx="25" cy="60" r="2.5" fill="#87ceeb" fill-opacity="0.6" stroke-width="1"/>
    <circle cx="40" cy="60" r="2.5" fill="#87ceeb" fill-opacity="0.6" stroke-width="1"/>
    <circle cx="55" cy="60" r="2.5" fill="#87ceeb" fill-opacity="0.6" stroke-width="1"/>
    <!-- Water waves -->
    <path d="M2,74 C8,72 14,74 20,72 C26,70 32,72 38,71 C44,70 50,72 56,71 C62,70 68,72 74,71 C80,70 86,72 92,71 C96,70.5 98,72 99,73"
          stroke="#5b8cc7" stroke-width="1.5" opacity="0.5"/>
    <path d="M1,78 C7,76 13,78 19,76 C25,75 31,77 37,76 C43,75 49,77 55,76 C61,75 67,77 73,76 C79,75 85,77 91,76 C95,75.5 98,77 99,78"
          stroke="#5b8cc7" stroke-width="1" opacity="0.35"/>
  </g>
</svg>