<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g stroke="#3a3a3a" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main body front -->
    <path d="M35,35 C32,32 30,28 32,24 C34,20 40,17 50,17 C60,17 66,20 68,24 C70,28 68,32 65,35 L65,55 C65,60 62,64 58,66 L42,66 C38,64 35,60 35,55 Z"
          fill="#5b8cc7" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Cockpit window (bubble) -->
    <path d="M38,28 C38,22 43,18 50,18 C57,18 62,22 62,28 L62,40 C62,44 58,47 54,47 L46,47 C42,47 38,44 38,40 Z"
          fill="#87ceeb" fill-opacity="0.75" stroke-width="1.5"/>
    <!-- Window frame cross -->
    <line x1="50" y1="18" x2="50" y2="47" stroke-width="1.2"/>
    <line x1="38" y1="34" x2="62" y2="34" stroke-width="1.2"/>
    <!-- Rotor mast -->
    <line x1="50" y1="17" x2="50" y2="10" stroke-width="2"/>
    <!-- Rotor hub -->
    <circle cx="50" cy="10" r="3" fill="#888" fill-opacity="0.6" stroke-width="1.3"/>
    <!-- Rotor blades (foreshortened from front) -->
    <path d="M20,10 C30,8 40,9 50,10 C60,9 70,8 80,10"
          stroke-width="2.5" stroke="#555"/>
    <path d="M20,10 C20,9 21,8 22,9" stroke-width="1.3"/>
    <path d="M80,10 C80,9 79,8 78,9" stroke-width="1.3"/>
    <!-- Left skid strut -->
    <path d="M38,62 L30,72 C29,73 28,74 27,74" stroke-width="1.8"/>
    <!-- Right skid strut -->
    <path d="M62,62 L70,72 C71,73 72,74 73,74" stroke-width="1.8"/>
    <!-- Left skid -->
    <path d="M22,74 L38,74" stroke-width="2.2"/>
    <!-- Right skid -->
    <path d="M62,74 L78,74" stroke-width="2.2"/>
    <!-- Cross strut -->
    <path d="M35,68 L65,68" stroke-width="1.2"/>
    <!-- Nose detail -->
    <ellipse cx="50" cy="50" rx="4" ry="3" fill="#888" fill-opacity="0.3" stroke-width="1"/>
    <!-- Belly detail -->
    <path d="M42,58 L58,58" stroke-width="1" opacity="0.4"/>
    <!-- Ground line -->
    <path d="M15,80 C30,79.5 50,80.2 70,79.7 C85,80 90,79.8 90,80" stroke-width="1" opacity="0.3"/>
  </g>
</svg>