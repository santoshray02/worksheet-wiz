  <path d="M 20 72 Q 25 71.5 35 72.5 Q 45 73 50 72" stroke="#4a2e18" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 50 75 Q 60 74 70 75 Q 75 75.5 80 75" stroke="#4a2e18" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>