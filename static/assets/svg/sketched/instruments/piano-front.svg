<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Piano front view - hand sketched style (upright piano) -->
  <!-- Main body -->
  <path d="M 12 15 Q 11.5 14.5 12 14 L 88 14 Q 88.5 14.5 88 15 L 88 88 Q 88.2 89 87 89 L 13 89 Q 12 89 12 88 Z" fill="#6b4226" fill-opacity="0.8" stroke="#4a2e18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top panel -->
  <path d="M 14 14 Q 13.5 11 14 10 L 86 10 Q 86.5 11 86 14" stroke="#4a2e18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#5a3520" fill-opacity="0.8"/>
  <!-- Music stand area -->
  <path d="M 18 18 L 82 18 L 82 32 L 18 32 Z" fill="#3d2b1f" fill-opacity="0.6" stroke="#4a2e18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sheet music hint -->
  <line x1="30" y1="22" x2="70" y2="22" stroke="#8b7355" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="30" y1="24" x2="70" y2="24" stroke="#8b7355" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="30" y1="26" x2="70" y2="26" stroke="#8b7355" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="30" y1="28" x2="70" y2="28" stroke="#8b7355" stroke-width="0.5" stroke-linecap="round"/>
  <!-- Keyboard area background -->
  <rect x="16" y="36" width="68" height="30" rx="1" fill="#f5f0e0" fill-opacity="0.9" stroke="#4a2e18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- White keys -->
  <line x1="25.7" y1="36" x2="25.7" y2="66" stroke="#bbb" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="35.4" y1="36" x2="35.4" y2="66" stroke="#bbb" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="45.1" y1="36" x2="45.1" y2="66" stroke="#bbb" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="54.8" y1="36" x2="54.8" y2="66" stroke="#bbb" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="64.5" y1="36" x2="64.5" y2="66" stroke="#bbb" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="74.2" y1="36" x2="74.2" y2="66" stroke="#bbb" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Black keys -->
  <rect x="22" y="36" rx="0.5" width="5" height="18" fill="#2a2a2a" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="31" y="36" rx="0.5" width="5" height="18" fill="#2a2a2a" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="36" rx="0.5" width="5" height="18" fill="#2a2a2a" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52" y="36" rx="0.5" width="5" height="18" fill="#2a2a2a" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="61" y="36" rx="0.5" width="5" height="18" fill="#2a2a2a" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="71" y="36" rx="0.5" width="5" height="18" fill="#2a2a2a" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower panel -->
  <path d="M 16 68 L 84 68 L 84 82 L 16 82 Z" fill="#5a3520" fill-opacity="0.5" stroke="#4a2e18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pedals -->
  <path d="M 40 86 Q 40 84 42 84 L 46 84 Q 48 84 48 86" stroke="#8b7355" stroke-width="1.5" stroke-linecap="round" fill="#8b7355" fill-opacity="0.6"/>
  <path d="M 52 86 Q 52 84 54 84 L 58 84 Q 60 84 60 86" stroke="#8b7355" stroke-width="1.5" stroke-linecap="round" fill="#8b7355" fill-opacity="0.6"/>
  <!-- Legs -->
  <path d="M 14 89 L 14 96 Q 14 97 15 97 L 18 97 Q 19 97 19 96 L 19 89" stroke="#4a2e18" stroke-width="2" stroke-linecap="round" fill="#6b4226" fill-opacity="0.8"/>
  <path d="M 81 89 L 81 96 Q 81 97 82 97 L 85 97 Q 86 97 86 96 L 86 89" stroke="#4a2e18" stroke-width="2" stroke-linecap="round" fill="#6b4226" fill-opacity="0.8"/>
