<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Xylophone tilted view - hand sketched style (3/4 perspective) -->
  <!-- Frame rails (angled) -->
  <path d="M 5 72 Q 8 70 15 68 L 92 55 Q 95 56 96 58" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 5 78 Q 8 80 15 80 L 92 67 Q 95 66 96 64" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round" fill="none"/>
  <line x1="5" y1="72" x2="5" y2="78" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="96" y1="58" x2="96" y2="64" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="15" y1="80" x2="12" y2="92" stroke="#8b5e3c" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="85" y1="68" x2="88" y2="80" stroke="#8b5e3c" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="74" x2="48" y2="88" stroke="#8b5e3c" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Bars (perspective: parallelogram shapes, longest to shortest) -->
  <!-- Bar 1 - C (red) -->
  <path d="M 6 22 L 12 19 L 16 68 L 10 71 Z" fill="#c75b5b" fill-opacity="0.8" stroke="#a04040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 2 - D (orange) -->
  <path d="M 17 24 L 23 21 L 27 67 L 21 70 Z" fill="#d4884a" fill-opacity="0.8" stroke="#b06830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 3 - E (yellow) -->
  <path d="M 28 28 L 34 25 L 38 66 L 32 69 Z" fill="#c7c75b" fill-opacity="0.8" stroke="#a0a040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 4 - F (green) -->
  <path d="M 39 32 L 45 29 L 49 65 L 43 68 Z" fill="#5bc75b" fill-opacity="0.8" stroke="#40a040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 5 - G (blue) -->
  <path d="M 50 35 L 56 32 L 60 64 L 54 67 Z" fill="#5b8cc7" fill-opacity="0.8" stroke="#4070a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 6 - A (indigo) -->
  <path d="M 61 38 L 67 35 L 71 63 L 65 66 Z" fill="#7b5bc7" fill-opacity="0.8" stroke="#6040a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 7 - B (violet) -->
  <path d="M 72 41 L 78 38 L 82 62 L 76 65 Z" fill="#c75bb8" fill-opacity="0.8" stroke="#a040a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bar 8 - high C (pink) -->
  <path d="M 82 44 L 87 42 L 90 61 L 85 63 Z" fill="#c75b7b" fill-opacity="0.8" stroke="#a04060" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mallet 1 -->
  <line x1="20" y1="8" x2="32" y2="26" stroke="#b87d4a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="8" r="3.2" fill="#c75b5b" fill-opacity="0.8" stroke="#a04040" stroke-width="1"/>
  <!-- Mallet 2 -->
  <line x1="70" y1="12" x2="58" y2="33" stroke="#b87d4a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="70" cy="12" r="3.2" fill="#5b8cc7" fill-opacity="0.8" stroke="#4070a0" stroke-width="1"/>
</svg>