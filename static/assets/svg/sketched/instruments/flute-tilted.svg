<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Flute tilted view - hand sketched style (diagonal) -->
  <g transform="rotate(-30, 50, 50)">
    <!-- Main tube -->
    <path d="M 3 48 Q 2 46 4 45 L 96 45 Q 98 46 98 49 Q 98 52 96 53 L 4 53 Q 2 52 3 50 Z" fill="#c0c0c0" fill-opacity="0.75" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head joint end cap -->
    <path d="M 4 45 Q 2 45.5 1 47 Q 0 49 1 51 Q 2 53 4 53" stroke="#888" stroke-width="1.8" stroke-linecap="round" fill="#aaa" fill-opacity="0.7"/>
    <!-- Embouchure hole -->
    <ellipse cx="16" cy="49" rx="3.2" ry="1.8" fill="#555" fill-opacity="0.7" stroke="#666" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Tone holes -->
    <circle cx="30" cy="49" r="1.8" fill="#ddd" fill-opacity="0.7" stroke="#888" stroke-width="1"/>
    <circle cx="38" cy="49" r="1.8" fill="#ddd" fill-opacity="0.7" stroke="#888" stroke-width="1"/>
    <circle cx="46" cy="49" r="2" fill="#ddd" fill-opacity="0.7" stroke="#888" stroke-width="1"/>
    <circle cx="54" cy="49" r="1.8" fill="#ddd" fill-opacity="0.7" stroke="#888" stroke-width="1"/>
    <circle cx="61" cy="49" r="1.6" fill="#ddd" fill-opacity="0.7" stroke="#888" stroke-width="1"/>
    <circle cx="68" cy="49" r="1.8" fill="#ddd" fill-opacity="0.7" stroke="#888" stroke-width="1"/>
    <circle cx="75" cy="49" r="1.6" fill="#ddd" fill-opacity="0.7" stroke="#888" stroke-width="1"/>
    <!-- Key rod -->
    <line x1="28" y1="44.5" x2="78" y2="44.5" stroke="#aaa" stroke-width="0.5" stroke-linecap="round"/>
    <!-- Key mechanisms -->
    <line x1="30" y1="45" x2="30" y2="46.5" stroke="#999" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="38" y1="45" x2="38" y2="46.5" stroke="#999" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="46" y1="45" x2="46" y2="46.5" stroke="#999" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="54" y1="45" x2="54" y2="46.5" stroke="#999" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="68" y1="45" x2="68" y2="46.5" stroke="#999" stroke-width="0.7" stroke-linecap="round"/>
    <!-- End keys -->
    <ellipse cx="84" cy="48" rx="1.3" ry="2.2" fill="#ddd" fill-opacity="0.6" stroke="#888" stroke-width="0.7"/>
    <ellipse cx="88" cy="48" rx="1.3" ry="2.2" fill="#ddd" fill-opacity="0.6" stroke="#888" stroke-width="0.7"/>
    <!-- Highlight -->
    <line x1="8" y1="46.5" x2="94" y2="46.5" stroke="#eee" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
    <!-- Joint rings -->
    <line x1="25" y1="45" x2="25" y2="53" stroke="#999" stroke-width="1" stroke-linecap="round"/>
    <line x1="58" y1="45" x2="58" y2="53" stroke="#999" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>