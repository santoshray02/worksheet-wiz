<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Guitar front view - hand sketched style -->
  <!-- Neck -->
  <path d="M 48 8 Q 47.5 9 47 18 Q 46.8 28 47 38" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#b87d4a" fill-opacity="0.8"/>
  <path d="M 52 8 Q 52.5 9 53 18 Q 53.2 28 53 38" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#b87d4a" fill-opacity="0.8"/>
  <!-- Neck fill -->
  <path d="M 48 8 Q 47.5 9 47 18 Q 46.8 28 47 38 L 53 38 Q 53.2 28 53 18 Q 52.5 9 52 8 Z" fill="#b87d4a" fill-opacity="0.8" stroke="none"/>
  <!-- Headstock -->
  <path d="M 46 8 Q 45 5 46 3 Q 49 1 50 1 Q 51 1 54 3 Q 55 5 54 8 Z" stroke="#6b4226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#8b5e3c" fill-opacity="0.8"/>
  <!-- Tuning pegs -->
  <circle cx="47" cy="4" r="1.2" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.8"/>
  <circle cx="47" cy="7" r="1.2" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.8"/>
  <circle cx="53" cy="4" r="1.2" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.8"/>
  <circle cx="53" cy="7" r="1.2" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.8"/>
  <!-- Fret lines -->
  <line x1="47.5" y1="12" x2="52.5" y2="12" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="47.5" y1="17" x2="52.5" y2="17" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="47.5" y1="22" x2="52.5" y2="22" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="47.5" y1="27" x2="52.5" y2="27" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="47.5" y1="32" x2="52.5" y2="32" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <!-- Body upper bout -->
  <path d="M 47 38 Q 38 40 34 48 Q 32 54 36 58 Q 40 61 47 62" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#b87d4a" fill-opacity="0.8"/>
  <path d="M 53 38 Q 62 40 66 48 Q 68 54 64 58 Q 60 61 53 62" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#b87d4a" fill-opacity="0.8"/>
  <!-- Body lower bout -->
  <path d="M 47 62 Q 35 64 30 74 Q 28 82 33 88 Q 38 93 50 94" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#b87d4a" fill-opacity="0.8"/>
  <path d="M 53 62 Q 65 64 70 74 Q 72 82 67 88 Q 62 93 50 94" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#b87d4a" fill-opacity="0.8"/>
  <!-- Body fill -->
  <path d="M 47 38 Q 38 40 34 48 Q 32 54 36 58 Q 38 60 47 62 Q 35 64 30 74 Q 28 82 33 88 Q 38 93 50 94 Q 62 93 67 88 Q 72 82 70 74 Q 65 64 53 62 Q 60 61 64 58 Q 68 54 66 48 Q 62 40 53 38 Z" fill="#b87d4a" fill-opacity="0.75" stroke="none"/>
  <!-- Sound hole -->
  <ellipse cx="50" cy="72" rx="8" ry="7.5" stroke="#6b4226" stroke-width="2" fill="#3d2b1f" fill-opacity="0.7" stroke-linecap="round"/>
  <!-- Bridge -->
  <path d="M 43 84 Q 50 85.5 57 84" stroke="#6b4226" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Strings -->
  <line x1="48.5" y1="8" x2="48" y2="84" stroke="#aaa" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="50" y1="8" x2="50" y2="84.5" stroke="#aaa" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="51.5" y1="8" x2="52" y2="84" stroke="#aaa" stroke-width="0.6" stroke-linecap="round"/>
</svg>