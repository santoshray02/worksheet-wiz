<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Guitar tilted view - hand sketched style -->
  <!-- Neck (tilted ~20 degrees) -->
  <path d="M 38 12 Q 37 15 36 25 Q 35.5 32 36 40" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 44 10 Q 43.5 14 43 24 Q 42.5 31 43 39" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Neck fill -->
  <path d="M 38 12 Q 37 15 36 25 Q 35.5 32 36 40 L 43 39 Q 42.5 31 43 24 Q 43.5 14 44 10 Z" fill="#b87d4a" fill-opacity="0.8" stroke="none"/>
  <!-- Headstock -->
  <path d="M 36 12 Q 34 9 35 6 Q 38 3 40 3 Q 42 3 45 5 Q 46 8 45 11 Z" stroke="#6b4226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#8b5e3c" fill-opacity="0.8"/>
  <!-- Tuning pegs -->
  <circle cx="37" cy="6" r="1.1" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.7"/>
  <circle cx="37" cy="9" r="1.1" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.7"/>
  <circle cx="43.5" cy="5.5" r="1.1" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.7"/>
  <circle cx="43.5" cy="8.5" r="1.1" fill="#555" fill-opacity="0.8" stroke="#333" stroke-width="0.7"/>
  <!-- Fret lines -->
  <line x1="37" y1="16" x2="43.5" y2="15" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="36.8" y1="21" x2="43.2" y2="20" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="36.5" y1="26" x2="43" y2="25" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="36.2" y1="31" x2="42.8" y2="30" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round"/>
  <!-- Body (tilted perspective) -->
  <path d="M 36 40 Q 26 43 23 52 Q 21 58 25 63 Q 28 66 36 67 Q 24 70 20 80 Q 18 87 24 92 Q 30 97 44 96 Q 58 95 64 90 Q 70 84 68 76 Q 64 68 53 66 Q 60 64 63 60 Q 67 55 64 50 Q 60 43 52 40 Z" fill="#b87d4a" fill-opacity="0.75" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sound hole -->
  <ellipse cx="44" cy="76" rx="7.5" ry="7" stroke="#6b4226" stroke-width="2" fill="#3d2b1f" fill-opacity="0.7" stroke-linecap="round" transform="rotate(-5, 44, 76)"/>
  <!-- Bridge -->
  <path d="M 37 87 Q 44 88.5 51 87" stroke="#6b4226" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Strings -->
  <line x1="39" y1="10" x2="39" y2="87" stroke="#aaa" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="41" y1="10" x2="42" y2="87.5" stroke="#aaa" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="43" y1="10" x2="45" y2="87" stroke="#aaa" stroke-width="0.6" stroke-linecap="round"/>
  <!-- Shadow/depth hint -->
  <path d="M 23 52 Q 22 55 22 58" stroke="#8b5e3c" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>