<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tambourine tilted view - hand sketched style (3/4 perspective) -->
  <!-- Drum head (elliptical for perspective) -->
  <ellipse cx="50" cy="42" rx="36" ry="24" fill="#f5f0e0" fill-opacity="0.8" stroke="#8b5e3c" stroke-width="2" stroke-linecap="round"/>
  <!-- Frame side (visible depth) -->
  <path d="M 14 42 Q 14 50 15 52 Q 20 60 35 64 Q 50 68 65 64 Q 80 60 85 52 Q 86 50 86 42" fill="#b87d4a" fill-opacity="0.7" stroke="#8b5e3c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Frame rim top -->
  <ellipse cx="50" cy="42" rx="37" ry="25" fill="none" stroke="#8b5e3c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Jingles on the frame sides -->
  <!-- Left jingles -->
  <ellipse cx="16" cy="46" rx="3.5" ry="4" fill="#d4b84a" fill-opacity="0.8" stroke="#a08620" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="16" cy="46" rx="1.8" ry="2" fill="#e8d066" fill-opacity="0.5" stroke="none"/>
  <!-- Left-center -->
  <ellipse cx="26" cy="56" rx="3.5" ry="4" fill="#d4b84a" fill-opacity="0.8" stroke="#a08620" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="26" cy="56" rx="1.8" ry="2" fill="#e8d066" fill-opacity="0.5" stroke="none"/>
  <!-- Center -->
  <ellipse cx="42" cy="62" rx="3.5" ry="4" fill="#d4b84a" fill-opacity="0.8" stroke="#a08620" stroke-width="1" stroke-linecap="round"/>
  <!-- Center-right -->
  <ellipse cx="58" cy="62" rx="3.5" ry="4" fill="#d4b84a" fill-opacity="0.8" stroke="#a08620" stroke-width="1" stroke-linecap="round"/>
  <!-- Right -->
  <ellipse cx="74" cy="56" rx="3.5" ry="4" fill="#d4b84a" fill-opacity="0.8" stroke="#a08620" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="74" cy="56" rx="1.8" ry="2" fill="#e8d066" fill-opacity="0.5" stroke="none"/>
  <!-- Far right -->
  <ellipse cx="84" cy="46" rx="3.5" ry="4" fill="#d4b84a" fill-opacity="0.8" stroke="#a08620" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="84" cy="46" rx="1.8" ry="2" fill="#e8d066" fill-opacity="0.5" stroke="none"/>
  <!-- Top rim jingles (visible from top) -->
  <ellipse cx="24" cy="24" rx="4" ry="2" fill="#d4b84a" fill-opacity="0.7" stroke="#a08620" stroke-width="0.8" stroke-linecap="round"/>
  <ellipse cx="50" cy="18" rx="4" ry="2" fill="#d4b84a" fill-opacity="0.7" stroke="#a08620" stroke-width="0.8" stroke-linecap="round"/>
  <ellipse cx="76" cy="24" rx="4" ry="2" fill="#d4b84a" fill-opacity="0.7" stroke="#a08620" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Wood grain on frame -->
  <path d="M 20 48 Q 30 52 45 54 Q 55 55 65 54" stroke="#8b5e3c" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Drum head texture -->
  <path d="M 30 35 Q 50 32 70 36" stroke="#d5c8a0" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 25 42 Q 50 46 75 42" stroke="#d5c8a0" stroke-width="0.5" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>