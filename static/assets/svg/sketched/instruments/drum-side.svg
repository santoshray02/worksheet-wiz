<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Drum side view - hand sketched style -->
  <!-- Drum body (cylinder from side) -->
  <path d="M 22 22 L 22 78 Q 22 82 26 84 Q 35 88 50 88 Q 65 88 74 84 Q 78 82 78 78 L 78 22 Q 78 18 74 16 Q 65 12 50 12 Q 35 12 26 16 Q 22 18 22 22 Z" fill="#c75b5b" fill-opacity="0.75" stroke="#8b3a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top head -->
  <ellipse cx="50" cy="18" rx="28" ry="8" fill="#f5f0e0" fill-opacity="0.85" stroke="#8b7355" stroke-width="2" stroke-linecap="round"/>
  <!-- Top rim -->
  <ellipse cx="50" cy="20" rx="29" ry="8.5" fill="none" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom rim -->
  <ellipse cx="50" cy="82" rx="28" ry="7" fill="none" stroke="#8b3a3a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tension rods on visible side -->
  <line x1="24" y1="24" x2="24" y2="80" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="76" y1="24" x2="76" y2="80" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Snare wires on bottom (hint) -->
  <path d="M 35 85 Q 42 87 50 87 Q 58 87 65 85" stroke="#ddd" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <path d="M 36 86 Q 43 88.5 50 88.5 Q 57 88.5 64 86" stroke="#ddd" stroke-width="0.8" stroke-linecap="round" fill="none"/>
  <!-- Lug on left -->
  <rect x="21" y="40" width="5" height="7" rx="1" fill="#bbb" fill-opacity="0.7" stroke="#888" stroke-width="0.8"/>
  <rect x="21" y="55" width="5" height="7" rx="1" fill="#bbb" fill-opacity="0.7" stroke="#888" stroke-width="0.8"/>
  <!-- Lug on right -->
  <rect x="74" y="40" width="5" height="7" rx="1" fill="#bbb" fill-opacity="0.7" stroke="#888" stroke-width="0.8"/>
  <rect x="74" y="55" width="5" height="7" rx="1" fill="#bbb" fill-opacity="0.7" stroke="#888" stroke-width="0.8"/>
  <!-- Decorative stripe -->
  <path d="M 22 45 Q 50 42 78 45" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 22 58 Q 50 61 78 58" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Stand legs hint -->
  <line x1="35" y1="88" x2="28" y2="97" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="88" x2="72" y2="97" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="88" x2="50" y2="97" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
</svg>