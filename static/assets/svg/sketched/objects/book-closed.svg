<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Book closed view - hand sketched style -->
  <!-- Book spine (left edge) -->
  <path d="M 20 15 Q 18 15 17 17 L 17 83 Q 17 85 20 85" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#8b5e3c" fill-opacity="0.8"/>
  <!-- Front cover -->
  <path d="M 20 12 L 80 12 Q 82 12 83 14 L 83 82 Q 83 84 80 84 L 20 84" fill="#5b8cc7" fill-opacity="0.8" stroke="#4070a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spine detail -->
  <path d="M 20 12 L 20 84" stroke="#4070a0" stroke-width="2" stroke-linecap="round"/>
  <!-- Pages (visible at bottom edge) -->
  <path d="M 20 84 Q 20 86 21 87 L 80 87 Q 82 87 83 85 L 83 84" fill="#f5f0e0" fill-opacity="0.9" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Page line details -->
  <line x1="22" y1="85" x2="81" y2="85" stroke="#ddd" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="21.5" y1="86" x2="81" y2="86" stroke="#ddd" stroke-width="0.5" stroke-linecap="round"/>
  <!-- Back cover hint -->
  <path d="M 20 85 Q 18 85 17 87 L 80 87 Q 19 87 20 85" stroke="#4070a0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Title area decoration on cover -->
  <rect x="30" y="28" width="42" height="22" rx="2" fill="none" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Title lines -->
  <line x1="36" y1="36" x2="66" y2="36" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="42" x2="62" y2="42" stroke="#f5f0e0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <!-- Cover decoration -->
  <path d="M 35 58 Q 50 54 65 58" stroke="#f5f0e0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 38 62 Q 50 58 62 62" stroke="#f5f0e0" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Spine ridges -->
  <line x1="18" y1="25" x2="20" y2="25" stroke="#6b4226" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="35" x2="20" y2="35" stroke="#6b4226" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="65" x2="20" y2="65" stroke="#6b4226" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="18" y1="75" x2="20" y2="75" stroke="#6b4226" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
</svg>