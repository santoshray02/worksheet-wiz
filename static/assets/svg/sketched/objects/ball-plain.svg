<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Ball plain view - hand sketched style -->
  <!-- Main ball -->
  <circle cx="50" cy="50" r="35" fill="#c75b5b" fill-opacity="0.8" stroke="#a04040" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Curved stripe across ball -->
  <path d="M 22 35 Q 35 50 28 68" stroke="#f5f0e0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 78 35 Q 65 50 72 68" stroke="#f5f0e0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Horizontal stripe -->
  <path d="M 22 35 Q 40 28 50 28 Q 60 28 78 35" stroke="#f5f0e0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 28 68 Q 40 74 50 74 Q 60 74 72 68" stroke="#f5f0e0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Highlight -->
  <path d="M 36 30 Q 38 26 42 24" stroke="#e8a0a0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Shadow underneath -->
  <ellipse cx="50" cy="90" rx="22" ry="4" fill="#888" fill-opacity="0.2" stroke="none"/>
</svg>