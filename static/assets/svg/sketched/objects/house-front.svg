<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- House front view - hand sketched style -->
  <!-- Main walls -->
  <path d="M 15 45 L 15 88 Q 15 89 16 89 L 84 89 Q 85 89 85 88 L 85 45" fill="#e8c97a" fill-opacity="0.8" stroke="#b8943a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Roof -->
  <path d="M 10 47 Q 9 48 10 49 L 50 15 L 90 49 Q 91 48 90 47 L 50 12 Z" fill="#c75b5b" fill-opacity="0.8" stroke="#a04040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chimney -->
  <path d="M 70 18 L 70 30 L 78 24 L 78 12 Z" fill="#8b6e4e" fill-opacity="0.8" stroke="#6b4226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chimney smoke -->
  <path d="M 74 12 Q 72 8 74 5 Q 76 2 74 0" stroke="#aaa" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Door -->
  <path d="M 42 89 L 42 60 Q 42 58 44 58 L 56 58 Q 58 58 58 60 L 58 89" fill="#8b5e3c" fill-opacity="0.8" stroke="#6b4226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Doorknob -->
  <circle cx="55" cy="75" r="1.5" fill="#d4b84a" fill-opacity="0.8" stroke="#a08620" stroke-width="0.8"/>
  <!-- Left window -->
  <rect x="21" y="55" width="14" height="14" rx="1" fill="#5b8cc7" fill-opacity="0.7" stroke="#4070a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Window cross -->
  <line x1="28" y1="55" x2="28" y2="69" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="62" x2="35" y2="62" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right window -->
  <rect x="65" y="55" width="14" height="14" rx="1" fill="#5b8cc7" fill-opacity="0.7" stroke="#4070a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Window cross -->
  <line x1="72" y1="55" x2="72" y2="69" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="62" x2="79" y2="62" stroke="#f5f0e0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Door step -->
  <path d="M 39 89 L 61 89 L 63 93 L 37 93 Z" fill="#999" fill-opacity="0.5" stroke="#777" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Ground line -->
  <path d="M 3 92 Q 30 90 50 91 Q 70 90 97 92" stroke="#5bc75b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Brick detail hints -->
  <line x1="20" y1="50" x2="35" y2="50" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="25" y1="53" x2="40" y2="53" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="65" y1="50" x2="80" y2="50" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="70" y1="53" x2="83" y2="53" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
</svg>