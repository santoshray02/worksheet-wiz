  <path d="M 50 20 Q 46 16 8 20 Q 5 21 5 23 L 5 84 Q 5 86 8 86 L 50 82" fill="#5b8cc7" fill-opacity="0.7" stroke="#4070a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
