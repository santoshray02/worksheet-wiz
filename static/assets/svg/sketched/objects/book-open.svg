  <line x1="15" y1="30" x2="45" y2="28" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="15" y1="36" x2="45" y2="34" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="15" y1="42" x2="45" y2="40" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
