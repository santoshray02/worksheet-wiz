  <path d="M 50 20 Q 48 18 10 22 Q 8 23 8 25 L 8 82 Q 8 84 10 84 L 50 80" fill="#f5f0e0" fill-opacity="0.9" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right page -->
  <path d="M 50 20 Q 52 18 90 22 Q 92 23 92 25 L 92 82 Q 92 84 90 84 L 50 80" fill="#f5f0e0" fill-opacity="0.9" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
