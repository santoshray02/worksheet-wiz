  <line x1="15" y1="54" x2="40" y2="52" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="15" y1="60" x2="45" y2="58" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="15" y1="66" x2="42" y2="64" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="15" y1="72" x2="45" y2="70" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <!-- Right page text lines -->
  <line x1="55" y1="28" x2="85" y2="30" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="34" x2="85" y2="36" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="40" x2="85" y2="42" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="46" x2="85" y2="48" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="52" x2="80" y2="54" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="58" x2="85" y2="60" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="64" x2="82" y2="66" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
  <line x1="55" y1="70" x2="85" y2="72" stroke="#ccc" stroke-width="1" stroke-linecap="round"/>
