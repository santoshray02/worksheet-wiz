<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pencil writing view - hand sketched style (angled, with writing lines) -->
  <!-- Pencil body (angled ~45 degrees) -->
  <g transform="rotate(-45, 55, 60)">
    <!-- Main body -->
    <path d="M 48 10 L 48 65 L 62 65 L 62 10 Z" fill="#c7c75b" fill-opacity="0.8" stroke="#a0a040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sharpened tip -->
    <path d="M 48 65 L 55 82 L 62 65 Z" fill="#e8c97a" fill-opacity="0.8" stroke="#b8943a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Graphite tip -->
    <path d="M 52 76 L 55 82 L 58 76 Z" fill="#444" fill-opacity="0.8" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ferrule -->
    <rect x="46" y="5" width="18" height="7" rx="1" fill="#c0c0c0" fill-opacity="0.8" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="46" y1="7" x2="64" y2="7" stroke="#999" stroke-width="0.5"/>
    <line x1="46" y1="9" x2="64" y2="9" stroke="#999" stroke-width="0.5"/>
    <!-- Eraser -->
    <path d="M 47 5 Q 47 1 49 0 L 61 0 Q 63 1 63 5" fill="#c75b7b" fill-opacity="0.8" stroke="#a04060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hex edge hints -->
    <line x1="51" y1="10" x2="51" y2="65" stroke="#8b8b2e" stroke-width="0.5" stroke-linecap="round" opacity="0.3"/>
    <line x1="59" y1="10" x2="59" y2="65" stroke="#8b8b2e" stroke-width="0.5" stroke-linecap="round" opacity="0.3"/>
  </g>
  <!-- Writing lines on paper (below the pencil tip) -->
  <path d="M 60 78 Q 65 76 72 78 Q 78 80 82 78" stroke="#555" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 62 82 Q 68 80 75 82 Q 80 84 86 82" stroke="#555" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 64 86 Q 70 84 76 86 Q 82 88 88 86" stroke="#555" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 66 90 Q 72 88 78 90 Q 82 91 85 90" stroke="#555" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
  <!-- Paper corner hint -->
  <path d="M 55 72 L 95 72 L 95 96 L 55 96 Z" fill="#f5f0e0" fill-opacity="0.3" stroke="#ccc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Paper lines (ruled) -->
  <line x1="58" y1="76" x2="92" y2="76" stroke="#ddd" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="58" y1="80" x2="92" y2="80" stroke="#ddd" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="58" y1="84" x2="92" y2="84" stroke="#ddd" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="58" y1="88" x2="92" y2="88" stroke="#ddd" stroke-width="0.5" stroke-linecap="round"/>
  <line x1="58" y1="92" x2="92" y2="92" stroke="#ddd" stroke-width="0.5" stroke-linecap="round"/>
</svg>