<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sun setting view - hand sketched style (half sun at horizon) -->
  <!-- Sky gradient suggestion (warm colors) -->
  <path d="M 0 65 L 100 65 L 100 100 L 0 100 Z" fill="#e8c97a" fill-opacity="0.2" stroke="none"/>
  <!-- Horizon line -->
  <path d="M 0 68 Q 25 66 50 67 Q 75 66 100 68" stroke="#b8943a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Sun (half circle above horizon) -->
  <path d="M 18 67 Q 18 42 50 28 Q 82 42 82 67" fill="#c7c75b" fill-opacity="0.85" stroke="#a0a040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rays above horizon -->
  <!-- Top -->
  <line x1="50" y1="24" x2="50" y2="10" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top-right -->
  <line x1="68" y1="35" x2="80" y2="22" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="78" y1="52" x2="92" y2="50" stroke="#c7c75b" stroke-width="2" stroke-linecap="round"/>
  <!-- Top-left -->
  <line x1="32" y1="35" x2="20" y2="22" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left -->
  <line x1="22" y1="52" x2="8" y2="50" stroke="#c7c75b" stroke-width="2" stroke-linecap="round"/>
  <!-- In-between rays -->
  <line x1="60" y1="28" x2="68" y2="15" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="40" y1="28" x2="32" y2="15" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="75" y1="42" x2="88" y2="35" stroke="#c7c75b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="42" x2="12" y2="35" stroke="#c7c75b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Warm color glow around sun -->
  <path d="M 25 67 Q 30 60 40 55 Q 50 52 60 55 Q 70 60 75 67" stroke="#d4884a" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 15 67 Q 25 55 40 48 Q 50 45 60 48 Q 75 55 85 67" stroke="#c75b5b" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.25"/>
  <!-- Water/horizon reflection -->
  <path d="M 35 72 Q 42 70 50 71 Q 58 70 65 72" stroke="#c7c75b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 40 76 Q 45 75 50 75 Q 55 75 60 76" stroke="#c7c75b" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.3"/>
  <path d="M 42 80 Q 46 79 50 79 Q 54 79 58 80" stroke="#c7c75b" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.25"/>
  <!-- Clouds silhouette -->
  <path d="M 5 62 Q 10 58 18 60 Q 22 58 28 60 Q 32 62 28 64 Q 22 65 18 63 Q 12 65 5 62" fill="#d4884a" fill-opacity="0.3" stroke="#d4884a" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>