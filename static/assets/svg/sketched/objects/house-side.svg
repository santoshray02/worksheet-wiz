  <path d="M 85 42 L 93 42 L 93 46 L 85 46" fill="#a04040" fill-opacity="0.6" stroke="#a04040" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Windows - three side windows -->
  <rect x="20" y="52" width="12" height="14" rx="1" fill="#5b8cc7" fill-opacity="0.7" stroke="#4070a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26" y1="52" x2="26" y2="66" stroke="#f5f0e0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="59" x2="32" y2="59" stroke="#f5f0e0" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="44" y="52" width="12" height="14" rx="1" fill="#5b8cc7" fill-opacity="0.7" stroke="#4070a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="50" y1="52" x2="50" y2="66" stroke="#f5f0e0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="59" x2="56" y2="59" stroke="#f5f0e0" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="68" y="52" width="12" height="14" rx="1" fill="#5b8cc7" fill-opacity="0.7" stroke="#4070a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="74" y1="52" x2="74" y2="66" stroke="#f5f0e0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="68" y1="59" x2="80" y2="59" stroke="#f5f0e0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Wall texture / brick hints -->
  <line x1="18" y1="72" x2="40" y2="72" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="25" y1="75" x2="55" y2="75" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="50" y1="78" x2="82" y2="78" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="18" y1="81" x2="45" y2="81" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="60" y1="84" x2="82" y2="84" stroke="#b8943a" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Gutter/drainpipe -->
  <line x1="87" y1="46" x2="87" y2="89" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ground line -->
  <path d="M 3 92 Q 30 90 50 91 Q 70 90 97 92" stroke="#5bc75b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
