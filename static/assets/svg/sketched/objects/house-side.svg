<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- House side view - hand sketched style -->
  <!-- Side wall -->
  <path d="M 15 42 L 15 88 Q 15 89 16 89 L 84 89 Q 85 89 85 88 L 85 42" fill="#e8c97a" fill-opacity="0.8" stroke="#b8943a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Roof (gable end visible from side) -->
  <path d="M 10 44 Q 9 45 10 46 L 85 46 L 85 42 L 50 14 Z" fill="#c75b5b" fill-opacity="0.8" stroke="#a04040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
