<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sun happy view - hand sketched style with smiley face -->
  <!-- Rays (drawn before circle so they go behind) -->
  <!-- Top -->
  <line x1="50" y1="22" x2="50" y2="8" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top-right -->
  <line x1="68" y1="30" x2="78" y2="18" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="76" y1="50" x2="92" y2="50" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-right -->
  <line x1="68" y1="70" x2="78" y2="82" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom -->
  <line x1="50" y1="78" x2="50" y2="92" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-left -->
  <line x1="32" y1="70" x2="22" y2="82" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left -->
  <line x1="24" y1="50" x2="8" y2="50" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top-left -->
  <line x1="32" y1="30" x2="22" y2="18" stroke="#c7c75b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shorter in-between rays -->
  <line x1="60" y1="24" x2="66" y2="14" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="74" y1="38" x2="86" y2="32" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="86" y2="68" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="60" y1="76" x2="66" y2="86" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="40" y1="76" x2="34" y2="86" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="26" y1="62" x2="14" y2="68" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="26" y1="38" x2="14" y2="32" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="34" y2="14" stroke="#c7c75b" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Main sun circle -->
  <circle cx="50" cy="50" r="26" fill="#c7c75b" fill-opacity="0.85" stroke="#a0a040" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Happy face - Eyes -->
  <circle cx="42" cy="44" r="2.5" fill="#6b5e20" fill-opacity="0.8"/>
  <circle cx="58" cy="44" r="2.5" fill="#6b5e20" fill-opacity="0.8"/>
  <!-- Eye highlights -->
  <circle cx="43" cy="43" r="0.8" fill="#fff" fill-opacity="0.6"/>
  <circle cx="59" cy="43" r="0.8" fill="#fff" fill-opacity="0.6"/>
  <!-- Happy mouth (smile) -->
  <path d="M 38 54 Q 44 62 50 62 Q 56 62 62 54" stroke="#6b5e20" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Rosy cheeks -->
  <ellipse cx="36" cy="54" rx="3" ry="2" fill="#e8a07a" fill-opacity="0.5"/>
  <ellipse cx="64" cy="54" rx="3" ry="2" fill="#e8a07a" fill-opacity="0.5"/>
</svg>