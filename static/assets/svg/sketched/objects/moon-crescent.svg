<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Moon crescent view - hand sketched style -->
  <!-- Background stars (small) -->
  <circle cx="15" cy="20" r="1" fill="#c7c75b" fill-opacity="0.6"/>
  <circle cx="80" cy="15" r="1.2" fill="#c7c75b" fill-opacity="0.5"/>
  <circle cx="25" cy="75" r="0.8" fill="#c7c75b" fill-opacity="0.5"/>
  <circle cx="85" cy="70" r="1" fill="#c7c75b" fill-opacity="0.6"/>
  <circle cx="70" cy="85" r="0.8" fill="#c7c75b" fill-opacity="0.4"/>
  <circle cx="12" cy="50" r="1" fill="#c7c75b" fill-opacity="0.5"/>
  <circle cx="90" cy="40" r="0.8" fill="#c7c75b" fill-opacity="0.5"/>
  <!-- Star shapes (a few twinkle stars) -->
  <path d="M 20 40 L 21 37 L 22 40 L 25 41 L 22 42 L 21 45 L 20 42 L 17 41 Z" fill="#c7c75b" fill-opacity="0.5" stroke="none"/>
  <path d="M 75 25 L 76 22 L 77 25 L 80 26 L 77 27 L 76 30 L 75 27 L 72 26 Z" fill="#c7c75b" fill-opacity="0.4" stroke="none"/>
  <!-- Crescent moon shape -->
  <!-- Outer circle (visible part) -->
  <circle cx="50" cy="50" r="32" fill="#e8d88a" fill-opacity="0.85" stroke="#c7b050" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Inner circle (shadow/overlap creating crescent) -->
  <circle cx="62" cy="44" r="28" fill="#1a1a2e" fill-opacity="0.95" stroke="none"/>
  <!-- Clean up crescent edge -->
  <circle cx="62" cy="44" r="28" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Subtle crater/surface texture on visible crescent -->
  <circle cx="38" cy="45" r="2.5" fill="#d4c070" fill-opacity="0.4" stroke="#c7b050" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="42" cy="58" r="3" fill="#d4c070" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="35" cy="62" r="1.8" fill="#d4c070" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.5" stroke-linecap="round"/>
  <circle cx="45" cy="70" r="2" fill="#d4c070" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.5" stroke-linecap="round"/>
  <!-- Glow effect -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#e8d88a" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
</svg>