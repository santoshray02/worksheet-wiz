  <ellipse cx="42" cy="40" rx="6" ry="5" fill="#d4c070" fill-opacity="0.4" stroke="#c7b050" stroke-width="0.8" stroke-linecap="round"/>
  <ellipse cx="55" cy="48" rx="8" ry="6" fill="#d4c070" fill-opacity="0.35" stroke="#c7b050" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="40" cy="55" r="4" fill="#d4c070" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.6" stroke-linecap="round"/>
  <circle cx="58" cy="35" r="3" fill="#d4c070" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.6" stroke-linecap="round"/>
  <circle cx="48" cy="65" r="5" fill="#d4c070" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.7" stroke-linecap="round"/>
  <circle cx="62" cy="58" r="3.5" fill="#d4c070" fill-opacity="0.25" stroke="#c7b050" stroke-width="0.5" stroke-linecap="round"/>
  <!-- Small craters -->
  <circle cx="35" cy="45" r="1.5" fill="#c0a850" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.4"/>
  <circle cx="55" cy="62" r="2" fill="#c0a850" fill-opacity="0.3" stroke="#c7b050" stroke-width="0.4"/>
  <circle cx="65" cy="45" r="1.5" fill="#c0a850" fill-opacity="0.25" stroke="#c7b050" stroke-width="0.4"/>
