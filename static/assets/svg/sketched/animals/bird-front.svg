<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #3a3a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fill-body { fill: #c45a5a; fill-opacity: 0.75; }
    .fill-belly { fill: #e8c4a8; fill-opacity: 0.82; }
    .fill-beak { fill: #d4a44e; fill-opacity: 0.85; }
    .fill-wing { fill: #a84848; fill-opacity: 0.7; }
  </style>
  <!-- Body -->
  <path class="fill-body" d="M50 92 C32 92, 22 82, 22 68 C22 58, 28 52, 36 48 L50 46 L64 48 C72 52, 78 58, 78 68 C78 82, 68 92, 50 92Z" />
  <path class="outline" d="M50 92 C32 92, 22 82, 22 68 C22 58, 28 52, 36 48 L50 46 L64 48 C72 52, 78 58, 78 68 C78 82, 68 92, 50 92Z" />
  <!-- Belly -->
  <path class="fill-belly" d="M40 56 C42 52, 50 50, 58 52 C64 56, 66 64, 64 72 C62 78, 56 82, 50 82 C44 82, 38 78, 36 72 C34 64, 36 58, 40 56Z" />
  <!-- Head -->
  <ellipse class="fill-body" cx="50" cy="30" rx="18" ry="16" />
  <ellipse class="outline" cx="50" cy="30" rx="18" ry="16" />
  <!-- Head tuft -->
  <path class="fill-body" d="M46 16 C44 10, 48 4, 50 6 C52 4, 56 10, 54 16Z" />
  <path class="outline" d="M46 16 C44 10, 48 4, 50 6 C52 4, 56 10, 54 16Z" />
  <path d="M48 16 C47 12, 49 8, 50 9" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.4" />
  <!-- Eyes -->
  <circle cx="41" cy="28" r="4.5" fill="white" fill-opacity="0.9" />
  <circle cx="41" cy="28" r="4.5" class="outline" />
  <circle cx="40.5" cy="27.5" r="2.5" fill="#2a2a2a" />
  <circle cx="39.8" cy="26.8" r="1" fill="white" fill-opacity="0.9" />
  <circle cx="59" cy="28" r="4.5" fill="white" fill-opacity="0.9" />
  <circle cx="59" cy="28" r="4.5" class="outline" />
  <circle cx="59.5" cy="27.5" r="2.5" fill="#2a2a2a" />
  <circle cx="58.8" cy="26.8" r="1" fill="white" fill-opacity="0.9" />
  <!-- Beak -->
  <path class="fill-beak" d="M46 36 L50 42 L54 36Z" />
  <path class="outline" d="M46 36 L50 42 L54 36Z" />
  <path class="detail" d="M48 37 L50 40 L52 37" />
  <!-- Cheek blush -->
  <ellipse cx="37" cy="34" rx="3" ry="2" fill="#d47a7a" fill-opacity="0.4" />
  <ellipse cx="63" cy="34" rx="3" ry="2" fill="#d47a7a" fill-opacity="0.4" />
  <!-- Wings (folded at sides) -->
  <path class="fill-wing" d="M22 56 C16 60, 12 68, 14 74 C16 78, 20 76, 22 72 C24 68, 24 62, 22 56Z" />
  <path class="outline" d="M22 56 C16 60, 12 68, 14 74 C16 78, 20 76, 22 72 C24 68, 24 62, 22 56Z" />
  <path class="detail" d="M20 60 C18 64, 16 68, 16 72" />
  <path class="fill-wing" d="M78 56 C84 60, 88 68, 86 74 C84 78, 80 76, 78 72 C76 68, 76 62, 78 56Z" />
  <path class="outline" d="M78 56 C84 60, 88 68, 86 74 C84 78, 80 76, 78 72 C76 68, 76 62, 78 56Z" />
  <path class="detail" d="M80 60 C82 64, 84 68, 84 72" />
  <!-- Feather details on wings -->
  <path class="detail" d="M18 66 C16 68, 15 70, 16 72" opacity="0.5" />
  <path class="detail" d="M82 66 C84 68, 85 70, 84 72" opacity="0.5" />
  <!-- Legs -->
  <line x1="42" y1="88" x2="42" y2="96" stroke="#d4a44e" stroke-width="2.5" stroke-linecap="round" />
  <line x1="58" y1="88" x2="58" y2="96" stroke="#d4a44e" stroke-width="2.5" stroke-linecap="round" />
  <!-- Feet -->
  <path d="M36 96 L42 96 L48 96" fill="none" stroke="#d4a44e" stroke-width="2" stroke-linecap="round" />
  <path d="M42 96 L42 98" fill="none" stroke="#d4a44e" stroke-width="2" stroke-linecap="round" />
  <path d="M52 96 L58 96 L64 96" fill="none" stroke="#d4a44e" stroke-width="2" stroke-linecap="round" />
  <path d="M58 96 L58 98" fill="none" stroke="#d4a44e" stroke-width="2" stroke-linecap="round" />
  <!-- Belly feather details -->
  <path class="detail" d="M44 62 C46 60, 48 62, 50 60 C52 62, 54 60, 56 62" opacity="0.4" />
  <path class="detail" d="M42 68 C44 66, 46 68, 48 66 C50 68, 52 66, 54 68 C56 66, 58 68" opacity="0.4" />
  <!-- Double stroke -->
  <path d="M36 24 C40 18, 46 16, 50 16" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.35" />
</svg>