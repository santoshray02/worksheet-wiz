<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .detail { fill: none; stroke: #6b5a4a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fur { fill: #d4c8b8; fill-opacity: 0.8; stroke: #6b5a4a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .inner-ear { fill: #d4a0a0; fill-opacity: 0.7; stroke: #6b5a4a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .belly { fill: #e8e0d4; fill-opacity: 0.85; stroke: #6b5a4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Ears flowing back -->
  <path class="fur" d="M46 10 C50 4, 56 2, 58 6 C60 12, 56 22, 50 28 C48 28, 46 26, 46 24 C44 18, 44 14, 46 10Z"/>
  <path class="inner-ear" d="M48 12 C50 8, 54 6, 56 8 C57 12, 55 20, 52 24 C50 22, 48 18, 48 14Z"/>
  <path class="fur" d="M52 8 C56 2, 64 0, 66 4 C68 10, 64 22, 58 28 C56 28, 54 26, 54 24 C52 18, 50 12, 52 8Z"/>
  <path class="inner-ear" d="M54 10 C56 6, 60 4, 62 6 C64 10, 62 20, 58 24 C56 22, 54 16, 54 12Z"/>
  <!-- Tail -->
  <ellipse cx="82" cy="42" rx="5" ry="5" fill="#e8e0d4" fill-opacity="0.85" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round"/>
  <path class="detail" d="M80 39 C82 38, 84 38, 86 40"/>
  <!-- Body - stretched out for hopping -->
  <path class="fur" d="M32 30 C40 24, 56 24, 68 30 C78 36, 84 44, 82 50 C80 56, 72 60, 66 62 C62 60, 58 56, 54 54 L48 68 C48 72, 44 73, 43 70 L46 58 C42 56, 38 52, 36 48 L28 58 C26 62, 22 61, 22 58 L30 44 C28 38, 28 34, 32 30Z"/>
  <!-- Hind legs - kicked back -->
  <path d="M66 56 C72 58, 78 62, 80 68 L82 74 C82 78, 78 78, 77 75 L74 66 C72 64, 70 62, 68 60" fill="#c8bcac" fill-opacity="0.75" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 58 C66 62, 72 66, 74 72 L76 78 C76 82, 72 82, 71 78 L68 70 C66 66, 64 64, 62 62" fill="#c8bcac" fill-opacity="0.7" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front legs - reaching forward -->
  <path d="M34 46 C30 50, 24 56, 20 62 L18 68 C16 72, 12 71, 14 68 L20 56" fill="none" stroke="#6b5a4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 48 C34 52, 28 58, 24 64 L22 70 C20 74, 16 73, 18 70 L24 58" fill="none" stroke="#6b5a4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head -->
  <path class="fur" d="M22 22 C24 16, 34 12, 42 16 C48 18, 52 26, 50 34 C48 40, 42 44, 34 44 C26 44, 20 38, 18 32 C17 28, 18 24, 22 22Z"/>
  <!-- Eye -->
  <ellipse cx="34" cy="28" rx="4" ry="4.5" fill="#f5f0e0" fill-opacity="0.9" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="35" cy="28.5" rx="2" ry="2.5" fill="#4a3028"/>
  <circle cx="36" cy="27.5" r="0.8" fill="#fff"/>
  <!-- Nose -->
  <path d="M20 32 C19 30, 20 28, 22 28 C23 28, 24 30, 23 32Z" fill="#d4a0a0" fill-opacity="0.85" stroke="#6b5a4a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mouth - happy -->
  <path class="detail" d="M22 32 C24 36, 28 38, 30 38"/>
  <!-- Whiskers -->
  <path class="detail" d="M20 30 C14 28, 8 28, 4 29"/>
  <path class="detail" d="M20 32 C14 34, 8 36, 4 38"/>
  <!-- Motion lines -->
  <path d="M86 38 L92 36" fill="none" stroke="#6b5a4a" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M86 44 L94 44" fill="none" stroke="#6b5a4a" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M86 50 L92 52" fill="none" stroke="#6b5a4a" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Ground shadow hint -->
  <ellipse cx="50" cy="82" rx="24" ry="3" fill="#6b5a4a" fill-opacity="0.1"/>
  <!-- Paw details -->
  <path class="detail" d="M12 69 L16 69"/>
  <path class="detail" d="M16 71 L20 71"/>
  <path class="detail" d="M76 76 L80 76"/>
  <path class="detail" d="M70 79 L74 79"/>
</svg>