    .belly { fill: #b8d4a0; fill-opacity: 0.75; stroke: #2a5a3a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .eye-dome { fill: #7ba87b; fill-opacity: 0.85; stroke: #2a5a3a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Back legs (behind body) -->
