<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #3a3a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fill-body { fill: #d4956a; fill-opacity: 0.78; }
    .fill-inner { fill: #e8c4a8; fill-opacity: 0.8; }
    .fill-nose { fill: #c47a6c; fill-opacity: 0.85; }
  </style>
  <!-- Body -->
  <path class="fill-body" d="M50 92 C30 92, 22 82, 22 68 C22 58, 28 52, 35 50 C35 50, 34 48, 35 45 L50 45 L65 45 C66 48, 65 50, 65 50 C72 52, 78 58, 78 68 C78 82, 70 92, 50 92Z" />
  <path class="outline" d="M50 92 C30 92, 22 82, 22 68 C22 58, 28 52, 35 50 C35 50, 34 48, 35 45 L50 45 L65 45 C66 48, 65 50, 65 50 C72 52, 78 58, 78 68 C78 82, 70 92, 50 92Z" />
  <!-- Head -->
  <ellipse class="fill-body" cx="50" cy="35" rx="22" ry="19" />
  <ellipse class="outline" cx="50" cy="35" rx="22" ry="19" />
  <!-- Left ear -->
  <path class="fill-body" d="M30 24 C28 14, 32 6, 35 8 C38 10, 38 18, 36 24Z" />
  <path class="outline" d="M30 24 C28 14, 32 6, 35 8 C38 10, 38 18, 36 24Z" />
  <path class="fill-inner" d="M31.5 22 C30 15, 33 10, 35 11 C36.5 12, 36.5 18, 35 22Z" />
