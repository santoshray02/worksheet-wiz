<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #3a3a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fill-body { fill: #b8864e; fill-opacity: 0.78; }
    .fill-belly { fill: #dfc9a8; fill-opacity: 0.82; }
    .fill-nose { fill: #4a3a3a; fill-opacity: 0.9; }
  </style>
  <!-- Tail (wagging up) -->
  <path d="M82 44 C86 36, 88 26, 84 20 C82 24, 84 32, 80 40" fill="none" stroke="#b8864e" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  <path class="outline" d="M82 44 C86 36, 88 26, 84 20" style="fill:none;" />
  <!-- Body -->
  <ellipse class="fill-body" cx="56" cy="52" rx="28" ry="20" />
  <ellipse class="outline" cx="56" cy="52" rx="28" ry="20" />
  <!-- Belly -->
  <path class="fill-belly" d="M40 58 C44 62, 56 64, 68 60 C70 56, 68 52, 64 50 C56 48, 44 50, 40 54Z" />
  <!-- Head -->
  <ellipse class="fill-body" cx="20" cy="36" rx="16" ry="15" />
  <ellipse class="outline" cx="20" cy="36" rx="16" ry="15" />
  <!-- Snout -->
  <path class="fill-belly" d="M6 38 C4 34, 6 30, 10 30 C14 30, 16 34, 14 38 C12 42, 8 42, 6 38Z" />
  <path class="outline" d="M6 38 C4 34, 6 30, 10 30 C14 30, 16 34, 14 38 C12 42, 8 42, 6 38Z" />
  <!-- Ear (floppy) -->
  <path class="fill-body" d="M26 24 C30 20, 34 22, 34 28 C34 34, 30 38, 26 36 C24 34, 24 28, 26 24Z" />
  <path class="outline" d="M26 24 C30 20, 34 22, 34 28 C34 34, 30 38, 26 36 C24 34, 24 28, 26 24Z" />
  <!-- Neck -->
  <path class="fill-body" d="M30 45 C34 48, 36 50, 38 52 C36 48, 32 44, 28 42Z" />
  <!-- Eye -->
  <ellipse cx="16" cy="34" rx="3.5" ry="4" fill="#5a3e2a" fill-opacity="0.85" />
  <ellipse cx="16" cy="34" rx="3.5" ry="4" class="outline" />
  <circle cx="15.5" cy="33.5" r="2" fill="#1a1a1a" />
  <circle cx="14.8" cy="32.8" r="0.9" fill="white" fill-opacity="0.9" />
  <!-- Eyebrow -->
  <path class="detail" d="M12 29 C14 27, 18 27, 20 29" />
  <!-- Nose -->
  <ellipse class="fill-nose" cx="7" cy="35" rx="3" ry="2.5" />
  <ellipse cx="6.5" cy="34.5" rx="1" ry="0.6" fill="white" fill-opacity="0.25" />
  <!-- Mouth -->
  <path class="detail" d="M8 38 C10 40, 14 41, 18 40" />
  <!-- Front legs -->
  <path class="fill-body" d="M38 64 C37 72, 36 80, 35 90 C35 93, 40 93, 40 90 C40 80, 40 72, 40 64Z" />
  <path class="outline" d="M38 64 C37 72, 36 80, 35 90 C35 93, 40 93, 40 90 C40 80, 40 72, 40 64Z" />
  <path class="fill-body" d="M46 65 C45 73, 44 80, 43 90 C43 93, 48 93, 48 90 C48 80, 48 73, 48 65Z" />
  <path class="outline" d="M46 65 C45 73, 44 80, 43 90 C43 93, 48 93, 48 90 C48 80, 48 73, 48 65Z" />
  <!-- Back legs -->
  <path class="fill-body" d="M66 62 C66 70, 64 80, 63 90 C63 93, 68 93, 68 90 C68 80, 68 70, 68 62Z" />
  <path class="outline" d="M66 62 C66 70, 64 80, 63 90 C63 93, 68 93, 68 90 C68 80, 68 70, 68 62Z" />
  <path class="fill-body" d="M74 60 C74 68, 72 78, 71 90 C71 93, 76 93, 76 90 C76 78, 76 68, 76 60Z" />
  <path class="outline" d="M74 60 C74 68, 72 78, 71 90 C71 93, 76 93, 76 90 C76 78, 76 68, 76 60Z" />
  <!-- Paw details -->
  <path class="detail" d="M36 91 L37 89" />
  <path class="detail" d="M44 91 L45 89" />
  <path class="detail" d="M64 91 L65 89" />
  <path class="detail" d="M72 91 L73 89" />
  <!-- Collar -->
  <path d="M28 46 C32 48, 36 49, 38 48" fill="none" stroke="#c45a5a" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <!-- Fur details -->
  <path class="detail" d="M48 46 C50 44, 52 45, 54 44" />
  <path class="detail" d="M58 44 C60 42, 62 43, 64 42" />
  <path class="detail" d="M52 50 C54 48, 56 49, 58 48" />
  <!-- Double stroke -->
  <path d="M10 28 C14 24, 20 22, 26 24" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.35" />
</svg>