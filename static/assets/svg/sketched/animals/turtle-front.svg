<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .detail { fill: none; stroke: #3a5a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .shell { fill: #8a7a5a; fill-opacity: 0.8; stroke: #3a5a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .shell-pattern { fill: #7a6a4a; fill-opacity: 0.4; stroke: #3a5a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .skin { fill: #7ba87b; fill-opacity: 0.8; stroke: #3a5a3a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .belly-shell { fill: #c4b47a; fill-opacity: 0.75; stroke: #3a5a3a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Back legs peeking out -->
  <path d="M26 72 C22 76, 18 80, 16 82 L14 86 C14 88, 16 90, 18 88 L22 84 C24 82, 26 78, 28 74" fill="#6a9a6a" fill-opacity="0.7" stroke="#3a5a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M74 72 C78 76, 82 80, 84 82 L86 86 C86 88, 84 90, 82 88 L78 84 C76 82, 74 78, 72 74" fill="#6a9a6a" fill-opacity="0.7" stroke="#3a5a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Toe details -->
  <path class="detail" d="M14 86 L12 88"/>
  <path class="detail" d="M16 87 L14 90"/>
  <path class="detail" d="M18 88 L18 91"/>
  <path class="detail" d="M82 88 L82 91"/>
  <path class="detail" d="M84 87 L86 90"/>
  <path class="detail" d="M86 86 L88 88"/>
  <!-- Shell (dome shape) -->
  <path class="shell" d="M50 22 C70 20, 86 36, 86 54 C86 70, 74 82, 50 82 C26 82, 14 70, 14 54 C14 36, 30 20, 50 22Z"/>
  <!-- Shell pattern - hexagonal segments -->
  <path class="shell-pattern" d="M50 26 C56 26, 62 30, 64 36 C66 42, 62 48, 56 50 C52 52, 48 52, 44 50 C38 48, 34 42, 36 36 C38 30, 44 26, 50 26Z"/>
  <path class="shell-pattern" d="M36 36 C30 32, 22 34, 18 40 C16 46, 18 52, 24 54 C28 56, 34 54, 36 50"/>
  <path class="shell-pattern" d="M64 36 C70 32, 78 34, 82 40 C84 46, 82 52, 76 54 C72 56, 66 54, 64 50"/>
  <path class="shell-pattern" d="M44 50 C40 54, 34 60, 30 66 C28 70, 30 76, 36 78 C42 80, 48 76, 48 70"/>
  <path class="shell-pattern" d="M56 50 C60 54, 66 60, 70 66 C72 70, 70 76, 64 78 C58 80, 52 76, 52 70"/>
  <path class="shell-pattern" d="M48 70 C48 74, 50 78, 52 70"/>
  <!-- Shell edge line -->
  <path class="detail" d="M18 64 C22 72, 30 78, 40 80"/>
  <path class="detail" d="M82 64 C78 72, 70 78, 60 80"/>
  <!-- Belly/plastron visible at bottom -->
  <path class="belly-shell" d="M36 76 C40 80, 46 82, 50 82 C54 82, 60 80, 64 76 L64 80 C60 84, 54 86, 50 86 C46 86, 40 84, 36 80Z"/>
  <!-- Front legs -->
  <path class="skin" d="M24 56 C18 58, 12 62, 10 66 L8 70 C8 72, 10 74, 12 72 L16 68 C18 66, 22 62, 26 60"/>
  <path class="skin" d="M76 56 C82 58, 88 62, 90 66 L92 70 C92 72, 90 74, 88 72 L84 68 C82 66, 78 62, 74 60"/>
  <!-- Front foot toes -->
  <path class="detail" d="M8 70 L6 72"/>
  <path class="detail" d="M10 71 L8 74"/>
  <path class="detail" d="M12 72 L12 75"/>
  <path class="detail" d="M88 72 L88 75"/>
  <path class="detail" d="M90 71 L92 74"/>
  <path class="detail" d="M92 70 L94 72"/>
  <!-- Head -->
  <path class="skin" d="M50 18 C58 16, 64 20, 64 28 C64 34, 60 38, 54 40 C52 40, 48 40, 46 40 C40 38, 36 34, 36 28 C36 20, 42 16, 50 18Z"/>
  <!-- Eyes -->
  <ellipse cx="43" cy="28" rx="3.5" ry="4" fill="#f0ead0" fill-opacity="0.9" stroke="#3a5a3a" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="57" cy="28" rx="3.5" ry="4" fill="#f0ead0" fill-opacity="0.9" stroke="#3a5a3a" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="43.5" cy="28.5" rx="1.8" ry="2.4" fill="#1a2a1a"/>
  <ellipse cx="57.5" cy="28.5" rx="1.8" ry="2.4" fill="#1a2a1a"/>
  <circle cx="44.5" cy="27.5" r="0.7" fill="#fff"/>
  <circle cx="58.5" cy="27.5" r="0.7" fill="#fff"/>
  <!-- Nostrils -->
  <ellipse cx="48" cy="34" rx="1" ry="0.8" fill="#3a5a3a" fill-opacity="0.5"/>
  <ellipse cx="52" cy="34" rx="1" ry="0.8" fill="#3a5a3a" fill-opacity="0.5"/>
  <!-- Mouth - gentle smile -->
  <path d="M44 36 C46 38, 50 39, 54 38 C56 37, 56 36, 56 36" fill="none" stroke="#3a5a3a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Skin texture on head -->
  <path class="detail" d="M40 22 C42 24, 44 24, 46 22" opacity="0.4"/>
  <path class="detail" d="M54 22 C56 24, 58 24, 60 22" opacity="0.4"/>
  <!-- Tail hint at bottom -->
  <path d="M50 82 C50 86, 48 90, 46 92" fill="none" stroke="#3a5a3a" stroke-width="1.8" stroke-linecap="round"/>
</svg>