<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #3a3a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fill-body { fill: #d4956a; fill-opacity: 0.78; }
    .fill-inner { fill: #e8c4a8; fill-opacity: 0.8; }
    .fill-nose { fill: #c47a6c; fill-opacity: 0.85; }
  </style>
  <!-- Tail -->
  <path class="outline" d="M82 52 C88 42, 92 30, 86 22 C84 19, 80 20, 82 25" style="fill:none;" />
  <path d="M82 52 C88 42, 92 30, 86 22 C84 19, 80 20, 82 25" fill="none" stroke="#d4956a" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <!-- Body -->
  <ellipse class="fill-body" cx="58" cy="58" rx="26" ry="18" />
  <ellipse class="outline" cx="58" cy="58" rx="26" ry="18" />
  <!-- Head -->
  <ellipse class="fill-body" cx="24" cy="38" rx="18" ry="16" />
  <ellipse class="outline" cx="24" cy="38" rx="18" ry="16" />
  <!-- Neck connection -->
  <path class="fill-body" d="M35 45 C38 48, 40 52, 42 55 C38 50, 34 46, 30 44Z" />
  <!-- Left ear (far) -->
  <path class="fill-body" d="M16 26 C14 18, 16 12, 19 14 C21 15, 21 20, 20 26Z" />
  <path class="outline" d="M16 26 C14 18, 16 12, 19 14 C21 15, 21 20, 20 26Z" />
