  <path class="fill-body" d="M28 24 C28 16, 31 10, 33 12 C35 14, 34 19, 32 25Z" />
  <path class="outline" d="M28 24 C28 16, 31 10, 33 12 C35 14, 34 19, 32 25Z" />
  <path class="fill-inner" d="M29 23 C29 18, 31 14, 32 15 C33 16, 32.5 19, 31.5 23Z" />
  <!-- Eye -->
  <ellipse cx="18" cy="36" rx="4" ry="4.5" fill="#4a7a5c" fill-opacity="0.8" />
  <ellipse cx="18" cy="36" rx="4" ry="4.5" class="outline" />
  <ellipse cx="17.5" cy="36" rx="1.8" ry="3.2" fill="#2a2a2a" />
  <circle cx="17" cy="34.5" r="0.9" fill="white" fill-opacity="0.9" />
  <!-- Nose -->
  <path class="fill-nose" d="M8 40 C7 38.5, 8 37, 10 37 C11 37.5, 10 40.5, 8 40Z" />
  <!-- Mouth -->
  <path class="detail" d="M10 40 C12 42, 15 43, 18 42" />
