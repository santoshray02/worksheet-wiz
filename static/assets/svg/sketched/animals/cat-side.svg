  <line class="detail" x1="10" y1="38" x2="2" y2="35" />
  <line class="detail" x1="10" y1="40" x2="1" y2="39" />
  <line class="detail" x1="10" y1="42" x2="3" y2="44" />
  <!-- Front legs -->
  <path class="fill-body" d="M40 68 C39 76, 38 84, 37 90 C37 92, 42 92, 42 90 C42 84, 42 76, 42 68Z" />
  <path class="outline" d="M40 68 C39 76, 38 84, 37 90 C37 92, 42 92, 42 90 C42 84, 42 76, 42 68Z" />
  <path class="fill-body" d="M47 69 C46 77, 45 84, 44 90 C44 92, 49 92, 49 90 C49 84, 49 77, 49 69Z" />
  <path class="outline" d="M47 69 C46 77, 45 84, 44 90 C44 92, 49 92, 49 90 C49 84, 49 77, 49 69Z" />
  <!-- Back legs -->
  <path class="fill-body" d="M68 66 C67 74, 65 82, 64 90 C64 92, 69 92, 69 90 C69 82, 69 74, 70 66Z" />
  <path class="outline" d="M68 66 C67 74, 65 82, 64 90 C64 92, 69 92, 69 90 C69 82, 69 74, 70 66Z" />
  <path class="fill-body" d="M74 64 C74 72, 73 82, 72 90 C72 92, 77 92, 77 90 C77 82, 76 72, 76 64Z" />
  <path class="outline" d="M74 64 C74 72, 73 82, 72 90 C72 92, 77 92, 77 90 C77 82, 76 72, 76 64Z" />
  <!-- Paw details -->
  <path class="detail" d="M38 90 L39 88" />
  <path class="detail" d="M45 90 L46 88" />
  <path class="detail" d="M65 90 L66 88" />
  <path class="detail" d="M73 90 L74 88" />
  <!-- Fur texture on body -->
  <path class="detail" d="M50 50 C52 49, 54 50, 55 49" />
  <path class="detail" d="M60 48 C62 47, 64 48, 65 47" />
  <path class="detail" d="M55 55 C57 54, 59 55, 60 54" />
