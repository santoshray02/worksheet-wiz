<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #3a3a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fill-body { fill: #d49a6a; fill-opacity: 0.75; }
    .fill-belly { fill: #e8d4b8; fill-opacity: 0.8; }
    .fill-fin { fill: #c4845a; fill-opacity: 0.7; }
  </style>
  <!-- Bubbles -->
  <circle cx="10" cy="30" r="2.5" fill="none" stroke="#7aaccf" stroke-width="1" opacity="0.5" />
  <circle cx="6" cy="38" r="1.5" fill="none" stroke="#7aaccf" stroke-width="0.8" opacity="0.4" />
  <circle cx="12" cy="22" r="1.8" fill="none" stroke="#7aaccf" stroke-width="0.8" opacity="0.45" />
  <!-- Tail fin (with swimming motion curve) -->
  <path class="fill-fin" d="M82 48 C90 36, 96 28, 98 26 C95 36, 93 44, 91 48 C93 52, 95 60, 98 70 C96 68, 90 60, 82 48Z" />
  <path class="outline" d="M82 48 C90 36, 96 28, 98 26 C95 36, 93 44, 91 48 C93 52, 95 60, 98 70 C96 68, 90 60, 82 48Z" />
  <path class="detail" d="M84 46 C88 40, 92 36, 95 30" />
  <path class="detail" d="M84 50 C88 56, 92 60, 95 66" />
  <!-- Body (slightly curved for swimming motion) -->
  <path class="fill-body" d="M18 48 C16 34, 28 22, 48 20 C68 18, 82 30, 84 48 C86 66, 72 78, 52 78 C32 78, 20 66, 18 48Z" />
  <path class="outline" d="M18 48 C16 34, 28 22, 48 20 C68 18, 82 30, 84 48 C86 66, 72 78, 52 78 C32 78, 20 66, 18 48Z" />
  <!-- Belly -->
  <path class="fill-belly" d="M22 54 C26 66, 38 74, 52 74 C66 74, 78 66, 82 54 C78 60, 66 66, 52 66 C38 66, 26 60, 22 54Z" />
  <!-- Dorsal fin -->
  <path class="fill-fin" d="M42 22 C44 12, 52 6, 58 8 C64 10, 64 18, 62 22 C56 20, 48 18, 42 22Z" />
  <path class="outline" d="M42 22 C44 12, 52 6, 58 8 C64 10, 64 18, 62 22" />
  <path class="detail" d="M46 20 C48 12, 54 10, 58 12" />
  <!-- Ventral fin -->
  <path class="fill-fin" d="M48 74 C46 80, 42 84, 44 86 C46 88, 50 84, 52 78Z" />
  <path class="outline" d="M48 74 C46 80, 42 84, 44 86 C46 88, 50 84, 52 78" />
  <!-- Pectoral fin (angled for swimming) -->
  <path class="fill-fin" d="M34 50 C26 54, 22 62, 26 66 C30 68, 36 62, 38 54Z" />
  <path class="outline" d="M34 50 C26 54, 22 62, 26 66 C30 68, 36 62, 38 54Z" />
  <!-- Eye -->
  <circle cx="28" cy="42" r="6" fill="white" fill-opacity="0.9" />
  <circle cx="28" cy="42" r="6" class="outline" />
  <circle cx="27" cy="41.5" r="3.5" fill="#3a5a8c" fill-opacity="0.85" />
  <circle cx="26.5" cy="41" r="2" fill="#1a1a1a" />
  <circle cx="25.8" cy="40" r="0.9" fill="white" fill-opacity="0.9" />
  <!-- Mouth (slightly open) -->
  <path class="outline" d="M18 48 C15 46, 13 48, 15 50 C16 51, 18 50, 18 48Z" style="stroke-width:2" />
  <!-- Scales -->
  <path class="detail" d="M40 34 C42 32, 44 34, 42 36" opacity="0.5" />
  <path class="detail" d="M48 32 C50 30, 52 32, 50 34" opacity="0.5" />
  <path class="detail" d="M56 34 C58 32, 60 34, 58 36" opacity="0.5" />
  <path class="detail" d="M64 36 C66 34, 68 36, 66 38" opacity="0.5" />
  <path class="detail" d="M44 42 C46 40, 48 42, 46 44" opacity="0.5" />
  <path class="detail" d="M52 40 C54 38, 56 40, 54 42" opacity="0.5" />
  <path class="detail" d="M60 42 C62 40, 64 42, 62 44" opacity="0.5" />
  <path class="detail" d="M48 50 C50 48, 52 50, 50 52" opacity="0.5" />
  <path class="detail" d="M56 48 C58 46, 60 48, 58 50" opacity="0.5" />
  <path class="detail" d="M68 44 C70 42, 72 44, 70 46" opacity="0.5" />
  <!-- Motion lines -->
  <path d="M4 46 L2 46" stroke="#7aaccf" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <path d="M6 50 L2 50" stroke="#7aaccf" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <path d="M5 54 L3 54" stroke="#7aaccf" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <!-- Double stroke accent -->
  <path d="M24 32 C34 24, 46 22, 56 22" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.3" />
</svg>