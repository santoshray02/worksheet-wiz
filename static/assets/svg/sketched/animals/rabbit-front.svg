  <ellipse cx="61" cy="42.5" rx="2.5" ry="3" fill="#4a3028"/>
  <circle cx="42.5" cy="41" r="1" fill="#fff"/>
  <circle cx="62.5" cy="41" r="1" fill="#fff"/>
