  <path class="fur" d="M36 40 C42 34, 56 32, 68 38 C76 42, 80 50, 78 58 C76 64, 70 70, 64 72 L62 82 C62 86, 58 87, 57 84 L58 74 C54 76, 48 76, 44 74 L42 84 C42 87, 38 87, 37 84 L38 72 C32 68, 28 60, 30 50Z"/>
  <!-- Hind leg -->
  <path d="M62 66 C66 68, 68 72, 66 78 L64 84 C64 87, 60 87, 59 84 L60 74" fill="#c8bcac" fill-opacity="0.75" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belly -->
  <path d="M40 58 C44 66, 52 70, 60 68" fill="none" stroke="#6b5a4a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Head -->
  <path class="fur" d="M22 30 C24 24, 32 20, 40 24 C46 26, 50 32, 48 40 C46 48, 40 52, 32 52 C24 52, 18 46, 18 40 C17 36, 18 32, 22 30Z"/>
  <!-- Eye -->
  <ellipse cx="34" cy="36" rx="4.5" ry="5" fill="#f5f0e0" fill-opacity="0.9" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="35" cy="36.5" rx="2.2" ry="2.8" fill="#4a3028"/>
  <circle cx="36" cy="35.5" r="0.9" fill="#fff"/>
  <!-- Nose -->
  <path d="M20 40 C19 38, 20 36, 22 36 C23 36, 24 38, 23 40Z" fill="#d4a0a0" fill-opacity="0.85" stroke="#6b5a4a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mouth -->
  <path class="detail" d="M22 40 C24 44, 28 46, 30 46"/>
  <!-- Whiskers -->
  <path class="detail" d="M20 38 C16 36, 10 36, 6 37"/>
  <path class="detail" d="M20 40 C16 41, 10 42, 6 44"/>
  <path class="detail" d="M20 42 C16 44, 12 46, 8 48"/>
  <!-- Cheek fluff -->
  <path class="detail" d="M20 46 C18 48, 16 46, 18 44"/>
  <!-- Paw details -->
  <path class="detail" d="M36 85 L40 85"/>
  <path class="detail" d="M56 85 L60 85"/>
  <path class="detail" d="M58 85 L62 85"/>
  <!-- Fur texture -->
