<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .detail { fill: none; stroke: #6b5a4a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fur { fill: #d4c8b8; fill-opacity: 0.8; stroke: #6b5a4a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .inner-ear { fill: #d4a0a0; fill-opacity: 0.7; stroke: #6b5a4a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .belly { fill: #e8e0d4; fill-opacity: 0.85; stroke: #6b5a4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Ear (back) -->
  <path d="M42 6 C44 2, 48 0, 50 2 C52 6, 50 18, 46 26 C44 28, 42 26, 42 24 C40 18, 40 10, 42 6Z" fill="#c4b8a8" fill-opacity="0.7" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ear (front) -->
  <path class="fur" d="M34 8 C32 2, 28 0, 26 2 C22 8, 26 22, 30 30 C32 32, 36 30, 36 26 C38 18, 36 12, 34 8Z"/>
  <path class="inner-ear" d="M32 12 C31 8, 29 8, 28 10 C26 16, 28 24, 31 28 C32 26, 34 22, 34 16 C34 14, 33 13, 32 12Z"/>
  <!-- Tail puff -->
  <ellipse cx="78" cy="58" rx="5" ry="5.5" fill="#e8e0d4" fill-opacity="0.85" stroke="#6b5a4a" stroke-width="2" stroke-linecap="round"/>
  <path class="detail" d="M76 55 C78 54, 80 54, 82 56"/>
  <path class="detail" d="M76 58 C78 57, 80 58, 81 60"/>
