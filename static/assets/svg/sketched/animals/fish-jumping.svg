<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #3a3a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fill-body { fill: #7a9ec4; fill-opacity: 0.75; }
    .fill-belly { fill: #b8d4e8; fill-opacity: 0.8; }
    .fill-fin { fill: #6a8cb4; fill-opacity: 0.7; }
  </style>
  <!-- Water splash at bottom -->
  <path d="M20 88 C24 84, 28 86, 32 82 C36 86, 40 84, 44 88 C48 84, 52 86, 56 82 C60 86, 64 84, 68 88 C72 84, 76 86, 80 82" fill="none" stroke="#7aaccf" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <path d="M28 92 C32 90, 36 92, 40 90 C44 92, 48 90, 52 92 C56 90, 60 92, 64 90 C68 92, 72 90, 74 92" fill="none" stroke="#7aaccf" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <!-- Water droplets -->
  <ellipse cx="30" cy="76" rx="1.5" ry="2" fill="#7aaccf" fill-opacity="0.5" />
  <ellipse cx="62" cy="72" rx="1.2" ry="1.8" fill="#7aaccf" fill-opacity="0.4" />
  <ellipse cx="46" cy="70" rx="1" ry="1.5" fill="#7aaccf" fill-opacity="0.45" />
  <ellipse cx="72" cy="78" rx="1.3" ry="1.7" fill="#7aaccf" fill-opacity="0.35" />
  <!-- Tail fin (pointing down since fish jumps up) -->
  <path class="fill-fin" d="M56 68 C64 74, 68 80, 70 84 C66 78, 62 74, 60 72 C62 76, 62 80, 64 86 C62 82, 58 76, 56 68Z" />
  <path class="outline" d="M56 68 C64 74, 68 80, 70 84 C66 78, 62 74, 60 72 C62 76, 62 80, 64 86 C62 82, 58 76, 56 68Z" />
  <!-- Body (vertical/jumping upward, arched) -->
  <path class="fill-body" d="M42 14 C30 16, 22 28, 22 42 C22 56, 30 66, 42 70 C46 72, 52 72, 56 70 C68 66, 76 56, 76 42 C76 28, 68 16, 56 14 C52 12, 46 12, 42 14Z" />
  <path class="outline" d="M42 14 C30 16, 22 28, 22 42 C22 56, 30 66, 42 70 C46 72, 52 72, 56 70 C68 66, 76 56, 76 42 C76 28, 68 16, 56 14 C52 12, 46 12, 42 14Z" />
  <!-- Belly -->
  <path class="fill-belly" d="M28 42 C28 54, 34 64, 44 68 C48 70, 52 70, 54 68 C42 66, 34 56, 34 42 C34 30, 40 22, 48 18 C40 20, 28 30, 28 42Z" />
  <!-- Dorsal fin (on right side since jumping) -->
  <path class="fill-fin" d="M72 30 C80 28, 86 32, 84 38 C82 42, 78 42, 74 38 C76 36, 76 32, 72 30Z" />
  <path class="outline" d="M72 30 C80 28, 86 32, 84 38 C82 42, 78 42, 74 38" />
  <!-- Pectoral fin -->
  <path class="fill-fin" d="M30 44 C22 42, 18 46, 20 50 C22 54, 28 52, 30 48Z" />
  <path class="outline" d="M30 44 C22 42, 18 46, 20 50 C22 54, 28 52, 30 48Z" />
  <!-- Eye -->
  <circle cx="42" cy="30" r="5.5" fill="white" fill-opacity="0.9" />
  <circle cx="42" cy="30" r="5.5" class="outline" />
  <circle cx="41" cy="29.5" r="3" fill="#3a5a8c" fill-opacity="0.85" />
  <circle cx="40.5" cy="29" r="1.8" fill="#1a1a1a" />
  <circle cx="40" cy="28" r="0.8" fill="white" fill-opacity="0.9" />
  <!-- Mouth (open with joy) -->
  <path class="outline" d="M34 18 C30 16, 28 18, 30 22 C32 24, 36 22, 36 20 C36 18, 35 17, 34 18Z" style="stroke-width:2" />
  <!-- Scales -->
  <path class="detail" d="M44 38 C46 36, 48 38, 46 40" opacity="0.5" />
  <path class="detail" d="M52 36 C54 34, 56 36, 54 38" opacity="0.5" />
  <path class="detail" d="M48 46 C50 44, 52 46, 50 48" opacity="0.5" />
  <path class="detail" d="M56 44 C58 42, 60 44, 58 46" opacity="0.5" />
  <path class="detail" d="M44 54 C46 52, 48 54, 46 56" opacity="0.5" />
  <path class="detail" d="M52 52 C54 50, 56 52, 54 54" opacity="0.5" />
  <path class="detail" d="M60 48 C62 46, 64 48, 62 50" opacity="0.5" />
  <path class="detail" d="M48 62 C50 60, 52 62, 50 64" opacity="0.5" />
  <!-- Motion arc lines -->
  <path d="M18 70 C14 58, 16 42, 24 28" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.3" stroke-dasharray="3,4" />
  <path d="M14 72 C10 58, 12 40, 20 26" fill="none" stroke="#3a3a3a" stroke-width="0.6" stroke-linecap="round" opacity="0.2" stroke-dasharray="2,4" />
  <!-- Double stroke accent -->
  <path d="M38 18 C44 14, 52 14, 58 18" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.3" />
</svg>