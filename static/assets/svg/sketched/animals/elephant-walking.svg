<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #3a3a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #3a3a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .fill-body { fill: #8a9baa; fill-opacity: 0.78; }
    .fill-inner { fill: #b8a8c4; fill-opacity: 0.75; }
    .fill-tusk { fill: #e8e0d0; fill-opacity: 0.85; }
  </style>
  <!-- Tail (swinging) -->
  <path d="M90 40 C94 36, 96 30, 94 26" fill="none" stroke="#8a9baa" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path class="outline" d="M90 40 C94 36, 96 30, 94 26" style="fill:none; stroke-width:1.5" />
  <path class="detail" d="M94 26 C92 24, 94 22, 96 24" />
  <!-- Body -->
  <path class="fill-body" d="M26 32 C16 34, 10 44, 10 54 C10 66, 18 74, 32 76 L70 76 C82 74, 88 66, 88 54 C88 44, 82 36, 74 32Z" />
  <path class="outline" d="M26 32 C16 34, 10 44, 10 54 C10 66, 18 74, 32 76 L70 76 C82 74, 88 66, 88 54 C88 44, 82 36, 74 32Z" />
  <!-- Ear -->
  <path class="fill-body" d="M28 18 C20 14, 12 18, 10 26 C8 34, 12 40, 20 40 C24 40, 26 36, 26 30Z" />
  <path class="outline" d="M28 18 C20 14, 12 18, 10 26 C8 34, 12 40, 20 40 C24 40, 26 36, 26 30Z" />
  <path class="fill-inner" d="M26 20 C20 18, 16 22, 14 28 C12 34, 16 38, 20 36 C22 34, 24 30, 24 24Z" />
  <!-- Head -->
  <path class="fill-body" d="M20 12 C20 4, 30 -2, 40 0 C50 2, 52 10, 50 20 C48 28, 42 34, 34 36 C26 38, 20 32, 18 24Z" />
  <path class="outline" d="M20 12 C20 4, 30 -2, 40 0 C50 2, 52 10, 50 20 C48 28, 42 34, 34 36 C26 38, 20 32, 18 24Z" />
  <!-- Eye -->
  <ellipse cx="32" cy="14" rx="3.5" ry="4" fill="#4a4a5a" fill-opacity="0.85" />
  <ellipse cx="32" cy="14" rx="3.5" ry="4" class="outline" />
  <circle cx="32" cy="13.5" r="2" fill="#1a1a1a" />
  <circle cx="31.2" cy="12.8" r="0.9" fill="white" fill-opacity="0.9" />
  <!-- Happy eyebrow -->
  <path class="detail" d="M28 9 C30 7, 34 7, 36 9" />
  <!-- Trunk (swinging forward while walking) -->
  <path class="fill-body" d="M34 30 C30 34, 24 38, 18 42 C14 46, 10 50, 8 54 C6 58, 4 60, 2 62 C0 64, 2 66, 6 64 C8 62, 10 58, 14 52 C18 46, 22 42, 28 38 C30 36, 32 34, 36 32Z" />
  <path class="outline" d="M34 30 C30 34, 24 38, 18 42 C14 46, 10 50, 8 54 C6 58, 4 60, 2 62 C0 64, 2 66, 6 64" />
  <!-- Trunk wrinkles -->
  <path class="detail" d="M28 36 C26 38, 24 36, 22 38" opacity="0.6" />
  <path class="detail" d="M22 44 C20 46, 18 44, 16 46" opacity="0.6" />
  <path class="detail" d="M16 52 C14 54, 12 52, 10 54" opacity="0.6" />
  <!-- Tusk -->
  <path class="fill-tusk" d="M30 34 C26 38, 20 40, 16 38 C14 36, 16 34, 20 34 C24 34, 28 32, 30 34Z" />
  <path class="outline" d="M26 36 C22 38, 18 38, 16 36" style="stroke-width:2" />
  <!-- Front left leg (forward stride) -->
  <path class="fill-body" d="M24 68 C20 74, 16 80, 14 88 C14 92, 22 92, 22 88 C22 82, 24 76, 28 70Z" />
  <path class="outline" d="M24 68 C20 74, 16 80, 14 88 C14 92, 22 92, 22 88 C22 82, 24 76, 28 70Z" />
  <!-- Front right leg (back position) -->
  <path class="fill-body" d="M36 70 C38 76, 40 82, 42 88 C42 92, 34 92, 34 88 C34 82, 34 76, 34 70Z" />
  <path class="outline" d="M36 70 C38 76, 40 82, 42 88 C42 92, 34 92, 34 88 C34 82, 34 76, 34 70Z" />
  <!-- Back left leg (back stride) -->
  <path class="fill-body" d="M62 70 C64 76, 68 82, 70 88 C70 92, 62 92, 62 88 C62 82, 60 76, 58 70Z" />
  <path class="outline" d="M62 70 C64 76, 68 82, 70 88 C70 92, 62 92, 62 88 C62 82, 60 76, 58 70Z" />
  <!-- Back right leg (forward stride) -->
  <path class="fill-body" d="M74 68 C72 74, 68 80, 66 88 C66 92, 74 92, 74 88 C74 82, 74 76, 76 70Z" />
  <path class="outline" d="M74 68 C72 74, 68 80, 66 88 C66 92, 74 92, 74 88 C74 82, 74 76, 76 70Z" />
  <!-- Toenail details -->
  <path class="detail" d="M15 90 C16 88, 18 88, 19 90" opacity="0.5" />
  <path class="detail" d="M19 90 C20 88, 21 88, 22 90" opacity="0.5" />
  <path class="detail" d="M35 90 C36 88, 38 88, 39 90" opacity="0.5" />
  <path class="detail" d="M39 90 C40 88, 41 88, 42 90" opacity="0.5" />
  <path class="detail" d="M63 90 C64 88, 66 88, 67 90" opacity="0.5" />
  <path class="detail" d="M67 90 C68 88, 69 88, 70 90" opacity="0.5" />
  <path class="detail" d="M67 90 C68 88, 70 88, 71 90" opacity="0.5" />
  <path class="detail" d="M71 90 C72 88, 73 88, 74 90" opacity="0.5" />
  <!-- Body wrinkle details -->
  <path class="detail" d="M44 40 C48 38, 52 40, 56 38" opacity="0.4" />
  <path class="detail" d="M48 46 C52 44, 56 46, 60 44" opacity="0.4" />
  <path class="detail" d="M52 52 C56 50, 60 52, 64 50" opacity="0.4" />
  <!-- Dust/motion details at feet -->
  <path d="M10 92 C12 90, 14 92, 16 90" fill="none" stroke="#b8a89a" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <path d="M62 94 C64 92, 66 94, 68 92" fill="none" stroke="#b8a89a" stroke-width="1" stroke-linecap="round" opacity="0.3" />
  <!-- Double stroke accent -->
  <path d="M24 8 C30 2, 38 0, 44 2" fill="none" stroke="#3a3a3a" stroke-width="0.8" stroke-linecap="round" opacity="0.3" />
</svg>