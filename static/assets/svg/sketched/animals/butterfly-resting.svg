<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .detail { fill: none; stroke: #4a3a5a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .wing-upper { fill: #c4789a; fill-opacity: 0.75; stroke: #4a3a5a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wing-lower { fill: #d4a06a; fill-opacity: 0.7; stroke: #4a3a5a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Flower stem -->
  <path d="M50 78 C48 82, 46 88, 44 94" fill="none" stroke="#7ba87b" stroke-width="2" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M46 86 C42 84, 38 86, 40 90 C42 88, 44 86, 46 86Z" fill="#7ba87b" fill-opacity="0.6" stroke="#5a7a5a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Flower petals -->
  <ellipse cx="44" cy="74" rx="5" ry="4" fill="#d4a0c4" fill-opacity="0.6" stroke="#8a6a8a" stroke-width="1.2" stroke-linecap="round" transform="rotate(-20 44 74)"/>
  <ellipse cx="56" cy="74" rx="5" ry="4" fill="#d4a0c4" fill-opacity="0.6" stroke="#8a6a8a" stroke-width="1.2" stroke-linecap="round" transform="rotate(20 56 74)"/>
  <ellipse cx="46" cy="70" rx="4.5" ry="3.5" fill="#d4a0c4" fill-opacity="0.6" stroke="#8a6a8a" stroke-width="1.2" stroke-linecap="round" transform="rotate(-40 46 70)"/>
  <ellipse cx="54" cy="70" rx="4.5" ry="3.5" fill="#d4a0c4" fill-opacity="0.6" stroke="#8a6a8a" stroke-width="1.2" stroke-linecap="round" transform="rotate(40 54 70)"/>
  <ellipse cx="50" cy="68" rx="4" ry="3.5" fill="#d4a0c4" fill-opacity="0.6" stroke="#8a6a8a" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Flower center -->
  <circle cx="50" cy="72" r="4" fill="#d4c46a" fill-opacity="0.7" stroke="#8a7a3a" stroke-width="1.2"/>
  <!-- Wings folded up (resting position - wings held together above body) -->
  <!-- Left wing surface visible -->
  <path class="wing-upper" d="M48 62 C42 52, 30 38, 18 30 C10 26, 6 30, 8 38 C12 48, 24 58, 38 62 C42 64, 46 64, 48 62Z"/>
  <!-- Right wing mostly hidden behind left -->
  <path d="M52 62 C56 54, 62 44, 68 36" fill="#b0688a" fill-opacity="0.3" stroke="#4a3a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower left wing -->
  <path class="wing-lower" d="M48 64 C42 66, 30 72, 22 76 C16 80, 20 84, 26 84 C34 82, 42 76, 46 70 C48 68, 48 66, 48 64Z"/>
  <!-- Lower right wing hint -->
  <path d="M52 64 C56 68, 60 72, 62 74" fill="#c4905a" fill-opacity="0.25" stroke="#4a3a5a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wing patterns -->
  <ellipse cx="24" cy="42" rx="4.5" ry="5" fill="#9a5a7a" fill-opacity="0.5" stroke="#4a3a5a" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="14" cy="36" rx="2.5" ry="3" fill="#b4688a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="0.8"/>
  <ellipse cx="34" cy="52" rx="3" ry="3" fill="#9a5a7a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="0.8"/>
  <ellipse cx="30" cy="76" rx="3" ry="3.5" fill="#b4805a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="0.8"/>
  <!-- Wing vein details -->
  <path class="detail" d="M46 60 C38 52, 28 42, 18 34"/>
  <path class="detail" d="M46 58 C40 54, 32 46, 24 40"/>
  <path class="detail" d="M48 66 C42 70, 34 76, 28 78"/>
  <!-- Body -->
  <path d="M48 52 C50 50, 52 50, 52 54 L52 70 C52 72, 50 74, 50 74 C50 74, 48 72, 48 70 L48 54Z" fill="#5a4a3a" fill-opacity="0.8" stroke="#4a3a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body segments -->
  <path class="detail" d="M48.5 58 L51.5 58"/>
  <path class="detail" d="M48.5 62 L51.5 62"/>
  <path class="detail" d="M48.5 66 L51.5 66"/>
  <!-- Head -->
  <ellipse cx="50" cy="50" rx="4" ry="4.5" fill="#5a4a3a" fill-opacity="0.8" stroke="#4a3a5a" stroke-width="2" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="48" cy="49" r="1.5" fill="#f5f0e0" fill-opacity="0.9"/>
  <circle cx="48.3" cy="49.2" r="0.6" fill="#2a2020"/>
  <!-- Antennae -->
  <path d="M48 46 C44 38, 38 30, 34 26" fill="none" stroke="#4a3a5a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M52 46 C50 40, 46 34, 42 30" fill="none" stroke="#4a3a5a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="34" cy="26" r="2" fill="#c4789a" fill-opacity="0.7" stroke="#4a3a5a" stroke-width="1.2"/>
  <circle cx="42" cy="30" r="1.5" fill="#c4789a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="1"/>
  <!-- Proboscis reaching into flower -->
  <path d="M50 53 C52 58, 52 64, 50 70" fill="none" stroke="#4a3a5a" stroke-width="1" stroke-linecap="round"/>
  <!-- Legs on flower -->
  <path class="detail" d="M49 56 L46 60"/>
  <path class="detail" d="M49 60 L46 64"/>
</svg>