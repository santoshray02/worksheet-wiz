<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .outline { fill: none; stroke: #5a4a2a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .detail { fill: none; stroke: #5a4a2a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .mane { fill: #c4a24d; fill-opacity: 0.8; stroke: #8a7030; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .face { fill: #e8cc7a; fill-opacity: 0.85; stroke: #5a4a2a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .body { fill: #d4b45a; fill-opacity: 0.75; stroke: #5a4a2a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Tail raised -->
  <path d="M78 50 C84 46, 90 38, 92 30 C93 26, 90 24, 89 28 C88 34, 84 42, 80 48" fill="none" stroke="#5a4a2a" stroke-width="2.2" stroke-linecap="round"/>
