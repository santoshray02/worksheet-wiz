  <path class="body" d="M28 44 C34 36, 48 34, 60 36 C72 38, 80 44, 82 52 C83 58, 80 64, 76 68 L74 80 C74 84, 70 85, 69 82 L68 72 C64 74, 54 76, 48 74 L46 82 C46 85, 42 85, 41 82 L42 72 C38 70, 34 66, 32 62 L30 78 C30 82, 26 83, 25 80 L26 66 C22 60, 21 52, 24 46Z"/>
