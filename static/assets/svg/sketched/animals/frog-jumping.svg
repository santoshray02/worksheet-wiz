<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .detail { fill: none; stroke: #2a5a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .body { fill: #7ba87b; fill-opacity: 0.8; stroke: #2a5a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .belly { fill: #b8d4a0; fill-opacity: 0.75; stroke: #2a5a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Motion lines -->
  <path d="M78 62 L86 66" fill="none" stroke="#2a5a3a" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <path d="M80 56 L90 58" fill="none" stroke="#2a5a3a" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <path d="M76 68 L84 74" fill="none" stroke="#2a5a3a" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
  <!-- Back legs - fully extended -->
  <path d="M58 46 C66 50, 74 56, 80 58 C84 60, 88 58, 90 56 C92 54, 92 52, 90 52 L84 54" fill="#6a9a6a" fill-opacity="0.7" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 50 C62 56, 70 62, 76 64 C80 66, 84 64, 86 62 C88 60, 88 58, 86 58 L80 60" fill="#7ba87b" fill-opacity="0.8" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back foot toes - splayed -->
  <path class="detail" d="M90 52 L94 50"/>
  <path class="detail" d="M90 53 L94 54"/>
  <path class="detail" d="M89 54 L92 56"/>
  <path class="detail" d="M86 58 L90 56"/>
  <path class="detail" d="M86 59 L90 60"/>
  <path class="detail" d="M85 60 L88 62"/>
  <!-- Body - stretched, angled upward -->
  <path class="body" d="M20 28 C28 20, 46 18, 58 24 C68 28, 74 38, 72 48 C70 54, 64 60, 54 62 C44 64, 34 60, 28 54 C22 48, 18 38, 20 28Z"/>
  <!-- Belly -->
  <path class="belly" d="M32 44 C36 52, 44 58, 52 58 C58 58, 64 54, 66 48"/>
  <!-- Front legs - reaching forward -->
  <path d="M26 48 C22 52, 16 56, 12 54 C8 52, 8 48, 10 46 L14 46 C16 46, 16 48, 14 50" fill="#7ba87b" fill-opacity="0.8" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 44 C26 48, 18 50, 14 48 C10 46, 10 42, 12 40 L16 40 C18 40, 18 42, 16 44" fill="#7ba87b" fill-opacity="0.8" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front foot toes -->
  <path class="detail" d="M10 46 L8 44"/>
  <path class="detail" d="M11 47 L8 48"/>
  <path class="detail" d="M12 40 L10 38"/>
  <path class="detail" d="M13 41 L10 42"/>
  <!-- Head -->
  <path class="body" d="M14 24 C16 16, 26 12, 34 16 C40 18, 44 24, 42 32 C40 38, 34 42, 26 42 C18 42, 12 36, 12 30 C11 28, 12 26, 14 24Z"/>
  <!-- Eye dome - big for jumping expression -->
  <path d="M26 10 C30 6, 38 6, 38 12 C38 16, 36 18, 32 18 C28 18, 24 16, 26 10Z" fill="#7ba87b" fill-opacity="0.85" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eye - wide open -->
  <ellipse cx="32" cy="13" rx="4.5" ry="5" fill="#e8e4c0" fill-opacity="0.9" stroke="#2a5a3a" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="32.5" cy="13.5" rx="2.5" ry="3.2" fill="#1a2a1a"/>
  <circle cx="33.5" cy="12.5" r="1" fill="#fff"/>
  <!-- Nostril -->
  <ellipse cx="16" cy="26" rx="1.5" ry="1" fill="#2a5a3a" fill-opacity="0.5"/>
  <!-- Mouth - open slightly with excitement -->
  <path d="M14 34 C18 38, 24 40, 28 38" fill="none" stroke="#2a5a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- Spots -->
  <ellipse cx="36" cy="28" rx="3" ry="2.5" fill="#5a8a5a" fill-opacity="0.4" stroke="#2a5a3a" stroke-width="0.8"/>
  <ellipse cx="48" cy="32" rx="3.5" ry="3" fill="#5a8a5a" fill-opacity="0.4" stroke="#2a5a3a" stroke-width="0.8"/>
  <ellipse cx="60" cy="38" rx="3" ry="2.5" fill="#5a8a5a" fill-opacity="0.4" stroke="#2a5a3a" stroke-width="0.8"/>
  <ellipse cx="42" cy="42" rx="2.5" ry="2" fill="#5a8a5a" fill-opacity="0.3" stroke="#2a5a3a" stroke-width="0.8"/>
  <!-- Ground shadow -->
  <ellipse cx="50" cy="90" rx="20" ry="3" fill="#2a5a3a" fill-opacity="0.1"/>
</svg>