<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .detail { fill: none; stroke: #2a5a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .body { fill: #7ba87b; fill-opacity: 0.8; stroke: #2a5a3a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .belly { fill: #b8d4a0; fill-opacity: 0.75; stroke: #2a5a3a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Back leg (far side) -->
  <path d="M72 58 C78 62, 84 68, 82 74 L78 76 C76 76, 76 74, 78 72 C76 68, 72 64, 68 62" fill="#6a9a6a" fill-opacity="0.6" stroke="#2a5a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body -->
  <path class="body" d="M26 40 C32 32, 50 28, 66 32 C78 36, 86 46, 84 56 C82 64, 74 72, 62 74 C50 76, 38 74, 30 70 C22 66, 18 56, 20 48 C21 44, 23 42, 26 40Z"/>
  <!-- Belly -->
  <path class="belly" d="M30 58 C34 66, 44 72, 56 72 C64 72, 72 68, 76 62 L74 66 C70 72, 58 76, 46 76 C36 76, 28 70, 28 64Z"/>
  <!-- Back leg (near side, folded) -->
  <path d="M64 62 C72 60, 80 58, 84 62 C88 66, 86 72, 82 76 L78 78 C76 78, 76 76, 78 74 C80 70, 80 66, 76 66 L68 68" fill="#7ba87b" fill-opacity="0.8" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back foot toes -->
  <path class="detail" d="M78 78 L76 80"/>
  <path class="detail" d="M80 78 L80 81"/>
  <path class="detail" d="M82 76 L84 78"/>
  <!-- Front leg -->
  <path d="M32 64 C30 68, 28 74, 30 78 L34 78 C36 78, 36 76, 34 74 L36 68" fill="#7ba87b" fill-opacity="0.8" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front foot toes -->
  <path class="detail" d="M30 78 L28 80"/>
  <path class="detail" d="M32 78 L32 81"/>
  <path class="detail" d="M34 78 L36 80"/>
  <!-- Head -->
  <path class="body" d="M18 36 C20 28, 30 24, 38 28 C44 30, 48 36, 46 44 C44 50, 38 54, 30 54 C22 54, 16 48, 16 42 C15 40, 16 38, 18 36Z"/>
  <!-- Eye dome -->
  <path d="M30 22 C34 18, 40 18, 40 24 C40 28, 38 30, 34 30 C30 30, 28 28, 30 22Z" fill="#7ba87b" fill-opacity="0.85" stroke="#2a5a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eye -->
  <ellipse cx="35" cy="25" rx="4" ry="4.5" fill="#e8e4c0" fill-opacity="0.9" stroke="#2a5a3a" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="35.5" cy="25.5" rx="2" ry="2.8" fill="#1a2a1a"/>
  <circle cx="36.5" cy="24.5" r="0.8" fill="#fff"/>
  <!-- Nostril -->
  <ellipse cx="20" cy="38" rx="1.5" ry="1" fill="#2a5a3a" fill-opacity="0.5"/>
  <!-- Mouth -->
  <path d="M18 44 C22 50, 28 52, 34 52" fill="none" stroke="#2a5a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- Spots -->
  <ellipse cx="40" cy="40" rx="3.5" ry="3" fill="#5a8a5a" fill-opacity="0.4" stroke="#2a5a3a" stroke-width="0.8"/>
  <ellipse cx="54" cy="44" rx="4" ry="3.5" fill="#5a8a5a" fill-opacity="0.4" stroke="#2a5a3a" stroke-width="0.8"/>
  <ellipse cx="68" cy="48" rx="3.5" ry="3" fill="#5a8a5a" fill-opacity="0.4" stroke="#2a5a3a" stroke-width="0.8"/>
  <ellipse cx="48" cy="54" rx="2.5" ry="2" fill="#5a8a5a" fill-opacity="0.3" stroke="#2a5a3a" stroke-width="0.8"/>
  <ellipse cx="76" cy="52" rx="2" ry="2" fill="#5a8a5a" fill-opacity="0.3" stroke="#2a5a3a" stroke-width="0.8"/>
  <!-- Texture lines on back -->
  <path class="detail" d="M36 34 C38 36, 40 36, 42 34" opacity="0.4"/>
  <path class="detail" d="M52 36 C54 38, 56 38, 58 36" opacity="0.4"/>
  <path class="detail" d="M66 40 C68 42, 70 42, 72 40" opacity="0.4"/>
</svg>