<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .detail { fill: none; stroke: #4a3a5a; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .wing-upper { fill: #c4789a; fill-opacity: 0.75; stroke: #4a3a5a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wing-lower { fill: #d4a06a; fill-opacity: 0.7; stroke: #4a3a5a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!-- Upper wing (visible side) -->
  <path class="wing-upper" d="M42 40 C36 30, 24 16, 12 12 C4 8, 2 16, 4 24 C8 36, 20 48, 34 52 C38 52, 42 50, 44 46Z"/>
  <!-- Lower wing -->
  <path class="wing-lower" d="M42 50 C36 54, 26 62, 20 72 C16 78, 20 84, 26 84 C34 84, 40 74, 42 66 C44 60, 44 54, 42 50Z"/>
  <!-- Far wing hint (partially visible) -->
  <path d="M48 38 C52 30, 56 24, 58 20" fill="#b0688a" fill-opacity="0.3" stroke="#4a3a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48 52 C52 56, 54 62, 54 66" fill="#c4905a" fill-opacity="0.25" stroke="#4a3a5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wing patterns - upper -->
  <ellipse cx="22" cy="26" rx="5" ry="5.5" fill="#9a5a7a" fill-opacity="0.5" stroke="#4a3a5a" stroke-width="1" stroke-linecap="round"/>
  <ellipse cx="12" cy="22" rx="2.5" ry="3" fill="#b4688a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="0.8"/>
  <ellipse cx="30" cy="38" rx="3.5" ry="3" fill="#9a5a7a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="0.8"/>
  <!-- Wing patterns - lower -->
  <ellipse cx="28" cy="70" rx="3.5" ry="4" fill="#b4805a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="0.8"/>
  <ellipse cx="22" cy="78" rx="2" ry="2.5" fill="#b4805a" fill-opacity="0.35" stroke="#4a3a5a" stroke-width="0.8"/>
  <!-- Wing vein lines -->
  <path class="detail" d="M42 42 C34 36, 24 28, 16 22"/>
  <path class="detail" d="M42 44 C36 42, 28 38, 20 34"/>
  <path class="detail" d="M42 52 C38 56, 32 66, 28 72"/>
  <path class="detail" d="M42 54 C40 58, 36 64, 32 68"/>
  <!-- Body -->
  <path d="M44 32 C46 30, 48 30, 48 34 L48 72 C48 76, 46 78, 45 78 C44 78, 42 76, 42 72 L42 34 C42 32, 43 31, 44 32Z" fill="#5a4a3a" fill-opacity="0.8" stroke="#4a3a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body segments -->
  <path class="detail" d="M42.5 40 L47.5 40"/>
  <path class="detail" d="M42.5 46 L47.5 46"/>
  <path class="detail" d="M42.5 52 L47.5 52"/>
  <path class="detail" d="M42.5 58 L47.5 58"/>
  <path class="detail" d="M42.5 64 L47.5 64"/>
  <path class="detail" d="M43 70 L47 70"/>
  <!-- Head -->
  <ellipse cx="45" cy="30" rx="4.5" ry="5" fill="#5a4a3a" fill-opacity="0.8" stroke="#4a3a5a" stroke-width="2" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="43" cy="29" r="1.8" fill="#f5f0e0" fill-opacity="0.9"/>
  <circle cx="43.3" cy="29.2" r="0.8" fill="#2a2020"/>
  <!-- Antenna -->
  <path d="M43 25 C38 16, 32 8, 28 4" fill="none" stroke="#4a3a5a" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="28" cy="4" r="2" fill="#c4789a" fill-opacity="0.7" stroke="#4a3a5a" stroke-width="1.2"/>
  <!-- Second antenna hint -->
  <path d="M46 25 C44 18, 40 12, 36 8" fill="none" stroke="#4a3a5a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="36" cy="8" r="1.5" fill="#c4789a" fill-opacity="0.4" stroke="#4a3a5a" stroke-width="1"/>
  <!-- Tiny legs -->
  <path class="detail" d="M43 42 L39 44"/>
  <path class="detail" d="M43 48 L39 50"/>
  <path class="detail" d="M43 54 L39 56"/>
  <!-- Proboscis curled -->
  <path d="M42 32 C40 34, 38 36, 38 38 C38 40, 40 40, 40 38" fill="none" stroke="#4a3a5a" stroke-width="1" stroke-linecap="round"/>
</svg>