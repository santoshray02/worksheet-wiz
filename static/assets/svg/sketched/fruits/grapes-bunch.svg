<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Grapes bunch - hand sketched style -->
  <!-- Stem -->
  <path d="M50 10 C50 14, 49 18, 48 22"
    fill="none" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Branch stems -->
  <path d="M48 22 C42 24, 38 26, 35 30"
    fill="none" stroke="#6b4226" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M48 22 C54 24, 58 26, 62 30"
    fill="none" stroke="#6b4226" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Leaf -->
  <path d="M52 12 C58 8, 66 8, 72 12 C68 16, 60 16, 52 12Z"
    fill="#7ba87b" fill-opacity="0.7" stroke="#4a7a4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 12 C60 10, 66 10, 70 12"
    fill="none" stroke="#4a7a4a" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Top row grapes -->
  <circle cx="38" cy="32" r="8" fill="#7b5a8b" fill-opacity="0.8" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="54" cy="30" r="8" fill="#8b6a9b" fill-opacity="0.8" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="66" cy="34" r="7.5" fill="#7b5a8b" fill-opacity="0.78" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <!-- Middle row -->
  <circle cx="30" cy="46" r="8" fill="#8b6a9b" fill-opacity="0.8" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="44" r="8.5" fill="#7b5a8b" fill-opacity="0.82" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="62" cy="46" r="8" fill="#8b6a9b" fill-opacity="0.78" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower middle row -->
  <circle cx="36" cy="60" r="8" fill="#7b5a8b" fill-opacity="0.8" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="58" r="8.5" fill="#8b6a9b" fill-opacity="0.8" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom row -->
  <circle cx="42" cy="73" r="7.5" fill="#8b6a9b" fill-opacity="0.78" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="56" cy="72" r="7" fill="#7b5a8b" fill-opacity="0.8" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom grape -->
  <circle cx="48" cy="84" r="7" fill="#7b5a8b" fill-opacity="0.78" stroke="#5a3a6b" stroke-width="2" stroke-linecap="round"/>
  <!-- Highlights on grapes -->
  <circle cx="35" cy="29" r="2" fill="white" fill-opacity="0.2"/>
  <circle cx="43" cy="41" r="2.2" fill="white" fill-opacity="0.2"/>
  <circle cx="49" cy="55" r="2" fill="white" fill-opacity="0.2"/>
</svg>
