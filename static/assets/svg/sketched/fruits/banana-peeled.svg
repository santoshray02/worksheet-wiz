<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Banana peeled - hand sketched style -->
  <!-- Peel left side -->
  <path d="M38 35 C30 32, 22 38, 18 50 C15 60, 16 72, 20 80 C22 76, 24 68, 28 58 C32 48, 35 42, 38 38Z"
    fill="#d4a24d" fill-opacity="0.75" stroke="#a07830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Peel right side -->
  <path d="M62 35 C70 32, 78 38, 82 48 C85 58, 84 70, 80 78 C78 72, 75 64, 72 56 C68 46, 65 40, 62 38Z"
    fill="#d4a24d" fill-opacity="0.75" stroke="#a07830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Peel back -->
  <path d="M45 33 C42 28, 38 22, 35 16 C38 18, 42 22, 46 30Z"
    fill="#d4a24d" fill-opacity="0.7" stroke="#a07830" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner banana fruit -->
  <path d="M40 36 C38 42, 37 55, 38 65 C39 75, 42 82, 45 88 C48 82, 55 75, 58 65 C61 55, 62 42, 60 36 C55 33, 45 33, 40 36Z"
    fill="#f5e6a8" fill-opacity="0.85" stroke="#c4a040" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stem top -->
  <path d="M48 33 C49 28, 50 22, 50 16"
    fill="none" stroke="#6b4226" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Texture lines on fruit -->
  <path d="M45 42 C44 52, 43 62, 43 72"
    fill="none" stroke="#d4c480" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M54 42 C55 52, 55 62, 53 72"
    fill="none" stroke="#d4c480" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Bottom tip -->
  <path d="M45 88 C46 90, 47 92, 46 93"
    fill="none" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/>
</svg>
