  <circle cx="72" cy="40" r="6" fill="none" stroke="#5a8a5a" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.4"/>
  <!-- Stem end -->
  <path d="M12 55 C8 56, 5 55, 3 52"
