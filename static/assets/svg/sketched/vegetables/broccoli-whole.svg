<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Broccoli whole - hand sketched style -->
  <!-- Stem -->
  <path d="M42 60 C40 70, 40 80, 42 92 L58 92 C60 80, 60 70, 58 60Z"
    fill="#7ba87b" fill-opacity="0.75" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stem texture -->
  <path d="M45 68 C46 72, 46 78, 45 85"
    fill="none" stroke="#5a8a5a" stroke-width="1" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M55 66 C54 72, 54 80, 55 88"
    fill="none" stroke="#5a8a5a" stroke-width="1" stroke-linecap="round" stroke-opacity="0.4"/>
  <!-- Crown clusters (bumpy florets) -->
  <!-- Center top -->
  <circle cx="50" cy="25" r="12" fill="#4a8a4a" fill-opacity="0.8" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Left cluster -->
  <circle cx="32" cy="32" r="11" fill="#5a9a5a" fill-opacity="0.78" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right cluster -->
  <circle cx="68" cy="32" r="11" fill="#4a8a4a" fill-opacity="0.8" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower left -->
  <circle cx="28" cy="48" r="10" fill="#5a9a5a" fill-opacity="0.78" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower right -->
  <circle cx="72" cy="48" r="10" fill="#4a8a4a" fill-opacity="0.78" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Center fill -->
  <circle cx="50" cy="42" r="12" fill="#4a8a4a" fill-opacity="0.8" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Top small bumps -->
  <circle cx="42" cy="18" r="7" fill="#5a9a5a" fill-opacity="0.75" stroke="#2a6a2a" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="58" cy="18" r="7" fill="#4a8a4a" fill-opacity="0.75" stroke="#2a6a2a" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="6" fill="#5a9a5a" fill-opacity="0.7" stroke="#2a6a2a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tiny texture dots on florets -->
  <circle cx="48" cy="22" r="1" fill="#3a7a3a" fill-opacity="0.4"/>
  <circle cx="53" cy="28" r="1" fill="#3a7a3a" fill-opacity="0.4"/>
  <circle cx="35" cy="35" r="1" fill="#3a7a3a" fill-opacity="0.4"/>
  <circle cx="65" cy="35" r="1" fill="#3a7a3a" fill-opacity="0.4"/>
  <circle cx="50" cy="38" r="1" fill="#3a7a3a" fill-opacity="0.4"/>
  <!-- Small branch on stem -->
  <path d="M42 72 C38 70, 35 68, 32 66"
    fill="none" stroke="#4a7a4a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
