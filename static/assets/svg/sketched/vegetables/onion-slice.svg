<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Onion slice - hand sketched cross section showing rings -->
  <!-- Outermost skin ring -->
  <circle cx="50" cy="50" r="36"
    fill="#d4a870" fill-opacity="0.75" stroke="#a07840" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Concentric rings (layers) -->
  <circle cx="50" cy="50" r="31"
    fill="#e8d0a0" fill-opacity="0.5" stroke="#c0a068" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="26"
    fill="#f0ddb8" fill-opacity="0.5" stroke="#c0a068" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="21"
    fill="#e8d0a0" fill-opacity="0.45" stroke="#c0a068" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="16"
    fill="#f0ddb8" fill-opacity="0.45" stroke="#c0a068" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="11"
    fill="#e8d0a0" fill-opacity="0.4" stroke="#c0a068" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="6"
    fill="#f5e8c8" fill-opacity="0.5" stroke="#c0a068" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Center core -->
  <circle cx="50" cy="50" r="2.5"
    fill="#d4c090" fill-opacity="0.6" stroke="#b09060" stroke-width="1"/>
  <!-- Slight imperfections in rings to make them look hand-drawn -->
  <path d="M50 19 C52 20, 53 21, 52 22"
    fill="none" stroke="#c0a068" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.3"/>
  <path d="M75 48 C76 50, 76 52, 74 54"
    fill="none" stroke="#c0a068" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.3"/>
  <!-- Membrane lines between layers -->
  <path d="M50 14 L50 17"
    fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M50 83 L50 86"
    fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M14 50 L17 50"
    fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M83 50 L86 50"
    fill="none" stroke="#b09060" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
