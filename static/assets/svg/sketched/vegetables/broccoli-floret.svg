<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Broccoli floret - hand sketched style, single small piece -->
  <!-- Short stem -->
  <path d="M44 65 C42 75, 42 82, 44 92 L56 92 C58 82, 58 75, 56 65Z"
    fill="#7ba87b" fill-opacity="0.75" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stem texture -->
  <path d="M48 70 C48 76, 48 82, 48 88"
    fill="none" stroke="#5a8a5a" stroke-width="1" stroke-linecap="round" stroke-opacity="0.4"/>
  <!-- Cut face at bottom -->
  <ellipse cx="50" cy="92" rx="7" ry="2.5"
    fill="#a8c8a0" fill-opacity="0.7" stroke="#4a7a4a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Main floret top cluster -->
  <circle cx="50" cy="40" r="15" fill="#4a8a4a" fill-opacity="0.8" stroke="#2a6a2a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Surrounding floret bumps -->
  <circle cx="35" cy="48" r="10" fill="#5a9a5a" fill-opacity="0.78" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="65" cy="48" r="10" fill="#5a9a5a" fill-opacity="0.78" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="30" r="9" fill="#4a8a4a" fill-opacity="0.78" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="30" r="9" fill="#5a9a5a" fill-opacity="0.78" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="24" r="8" fill="#4a8a4a" fill-opacity="0.75" stroke="#2a6a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- Tiny bumps on top -->
  <circle cx="45" cy="20" r="4" fill="#5a9a5a" fill-opacity="0.7" stroke="#2a6a2a" stroke-width="1.2"/>
  <circle cx="55" cy="20" r="4" fill="#4a8a4a" fill-opacity="0.7" stroke="#2a6a2a" stroke-width="1.2"/>
  <!-- Texture dots -->
  <circle cx="48" cy="35" r="1.2" fill="#3a7a3a" fill-opacity="0.4"/>
  <circle cx="55" cy="42" r="1" fill="#3a7a3a" fill-opacity="0.4"/>
  <circle cx="42" cy="44" r="1" fill="#3a7a3a" fill-opacity="0.4"/>
</svg>
