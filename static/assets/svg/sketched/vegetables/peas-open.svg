<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Peas open pod - hand sketched style, showing peas inside -->
  <!-- Bottom half of pod -->
  <path d="M8 58 C14 50, 28 44, 50 42 C72 40, 86 44, 94 50 C92 56, 84 62, 64 65 C44 68, 20 66, 8 58Z"
    fill="#7ba87b" fill-opacity="0.8" stroke="#4a7a4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top half (peeled back) -->
  <path d="M8 58 C12 54, 20 50, 30 48 C34 44, 32 36, 26 32 C18 28, 10 34, 6 42 C4 48, 5 54, 8 58Z"
    fill="#8bb88b" fill-opacity="0.7" stroke="#4a7a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner pod surface (lighter green) -->
  <path d="M14 52 C24 46, 42 42, 60 41 C76 40, 88 43, 92 48"
    fill="none" stroke="#a0c8a0" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Peas sitting in pod -->
  <circle cx="28" cy="50" r="7.5" fill="#6aaa5a" fill-opacity="0.85" stroke="#3a7a3a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="48" r="8" fill="#5a9a4a" fill-opacity="0.85" stroke="#3a7a3a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="47" r="8" fill="#6aaa5a" fill-opacity="0.85" stroke="#3a7a3a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76" cy="48" r="7.5" fill="#5a9a4a" fill-opacity="0.85" stroke="#3a7a3a" stroke-width="2" stroke-linecap="round"/>
  <!-- Pea highlights -->
  <circle cx="25" cy="47" r="2" fill="white" fill-opacity="0.2"/>
  <circle cx="41" cy="45" r="2.2" fill="white" fill-opacity="0.2"/>
  <circle cx="57" cy="44" r="2.2" fill="white" fill-opacity="0.2"/>
  <circle cx="73" cy="45" r="2" fill="white" fill-opacity="0.2"/>
  <!-- Stem -->
  <path d="M8 58 C5 59, 3 58, 2 55"
    fill="none" stroke="#4a7a4a" stroke-width="2" stroke-linecap="round"/>
  <!-- Tip -->
  <path d="M94 50 C96 48, 98 47, 99 48"
    fill="none" stroke="#4a7a4a" stroke-width="1.8" stroke-linecap="round"/>
</svg>
