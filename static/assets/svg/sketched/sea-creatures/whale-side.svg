<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Whale - Side View -->
  <g stroke="#2a5a7b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <path d="M15,50 C18,35 30,28 50,30 C70,32 82,40 88,50 C82,60 70,68 50,70 C30,72 18,65 15,50 Z"
          fill="#6b9dba" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Double stroke overlay on body top -->
    <path d="M20,38 C30,30 50,28 65,32" fill="none" stroke-width="1.2" opacity="0.4"/>
    <!-- Belly line -->
    <path d="M22,52 C35,58 55,60 78,52" fill="none" stroke-width="1.5" opacity="0.5"/>
    <!-- Tail -->
    <path d="M15,50 C10,44 4,36 2,32 C6,36 10,38 14,42" fill="none" stroke-width="2.5"/>
    <path d="M15,50 C10,56 4,64 2,68 C6,64 10,62 14,58" fill="none" stroke-width="2.5"/>
    <path d="M2,32 C5,38 4,50 2,68" fill="#6b9dba" fill-opacity="0.6" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="72" cy="45" r="3" fill="#2a3a4a" stroke-width="1.5"/>
    <circle cx="73" cy="44" r="1" fill="white" stroke="none"/>
    <!-- Mouth -->
    <path d="M84,52 C86,54 87,55 88,55" fill="none" stroke-width="2"/>
    <!-- Spout -->
    <path d="M40,29 C38,22 36,16 34,12" fill="none" stroke-width="1.5" stroke="#5a8aa9"/>
    <path d="M34,12 C30,8 28,6 26,8" fill="none" stroke-width="1.2" stroke="#5a8aa9"/>
    <path d="M34,12 C38,8 40,6 42,8" fill="none" stroke-width="1.2" stroke="#5a8aa9"/>
    <!-- Fin -->
    <path d="M50,65 C48,75 52,80 55,75 C56,72 54,68 52,65" fill="#5a8aa9" fill-opacity="0.7" stroke-width="2"/>
    <!-- Detail lines on body -->
    <path d="M60,38 C62,40 62,42" fill="none" stroke-width="1" opacity="0.3"/>
    <path d="M55,40 C56,42 56,44" fill="none" stroke-width="1" opacity="0.3"/>
    <!-- Bubbles -->
    <circle cx="92" cy="38" r="2" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.5"/>
    <circle cx="96" cy="32" r="1.5" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.4"/>
    <circle cx="94" cy="28" r="1" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.3"/>
  </g>
</svg>