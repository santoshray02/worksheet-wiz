<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Whale - Diving View -->
  <g stroke="#2a5a7b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body - angled downward -->
    <path d="M30,20 C35,22 45,30 52,42 C58,52 60,62 58,72 C54,70 48,64 42,54 C36,44 32,32 30,20 Z"
          fill="#6b9dba" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Double stroke on body -->
    <path d="M34,25 C40,32 48,42 52,50" fill="none" stroke-width="1.2" opacity="0.4"/>
    <!-- Belly -->
    <path d="M42,30 C48,38 54,50 58,62" fill="none" stroke-width="1.5" opacity="0.4"/>
    <!-- Tail flukes at top -->
    <path d="M30,20 C22,14 14,10 10,8 C14,14 18,18 24,20" fill="none" stroke-width="2.5"/>
    <path d="M30,20 C36,14 42,10 46,8 C42,14 38,18 34,20" fill="none" stroke-width="2.5"/>
    <path d="M10,8 C18,10 30,12 46,8" fill="#6b9dba" fill-opacity="0.6" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="52" cy="58" r="2.5" fill="#2a3a4a" stroke-width="1.5"/>
    <circle cx="53" cy="57" r="0.8" fill="white" stroke="none"/>
    <!-- Mouth -->
    <path d="M58,70 C60,72 61,74 60,76" fill="none" stroke-width="2"/>
    <!-- Fin -->
    <path d="M38,48 C32,52 30,58 34,56 C36,55 38,52 40,50" fill="#5a8aa9" fill-opacity="0.7" stroke-width="2"/>
    <!-- Water surface ripples -->
    <path d="M5,5 C15,3 25,5 35,3" fill="none" stroke-width="1.5" stroke="#8fbcbb" opacity="0.4"/>
    <path d="M40,4 C50,2 60,4 70,2" fill="none" stroke-width="1.5" stroke="#8fbcbb" opacity="0.3"/>
    <!-- Bubbles trail -->
    <circle cx="36" cy="30" r="2" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.5"/>
    <circle cx="32" cy="24" r="1.5" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.4"/>
    <circle cx="28" cy="18" r="1.8" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.35"/>
    <!-- Detail sketch lines -->
    <path d="M44,40 C45,42" fill="none" stroke-width="1" opacity="0.3"/>
    <path d="M48,46 C49,48" fill="none" stroke-width="1" opacity="0.3"/>
  </g>
</svg>