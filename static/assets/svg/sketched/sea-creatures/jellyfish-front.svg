<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Jellyfish - Front View -->
  <g stroke="#5a5a8b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bell/dome -->
    <path d="M18,42 C16,28 22,14 50,12 C78,14 84,28 82,42 C78,46 66,48 50,48 C34,48 22,46 18,42 Z"
          fill="#8b9dca" fill-opacity="0.75" stroke-width="2.5"/>
    <!-- Double stroke on dome -->
    <path d="M24,22 C34,14 58,12 74,18" fill="none" stroke-width="1.2" opacity="0.3"/>
    <!-- Dome highlight -->
    <path d="M30,24 C38,20 52,18 62,22" fill="none" stroke-width="1.5" opacity="0.2" stroke="white"/>
    <!-- Dome texture -->
    <path d="M28,32 C38,28 58,28 72,32" fill="none" stroke-width="1" opacity="0.25"/>
    <path d="M24,38 C36,34 62,34 76,38" fill="none" stroke-width="1" opacity="0.2"/>
    <!-- Frilly edge -->
    <path d="M18,42 C22,46 26,44 30,46 C34,48 38,46 42,48 C46,50 50,48 54,50 C58,48 62,50 66,48 C70,46 74,48 78,46 C80,44 82,42"
          fill="none" stroke-width="2" opacity="0.7"/>
    <!-- Eyes -->
    <circle cx="40" cy="30" r="3.5" fill="white" fill-opacity="0.9" stroke-width="1.5"/>
    <circle cx="40" cy="31" r="2" fill="#2a3a5a" stroke-width="1"/>
    <circle cx="41" cy="30" r="0.7" fill="white" stroke="none"/>
    <circle cx="60" cy="30" r="3.5" fill="white" fill-opacity="0.9" stroke-width="1.5"/>
    <circle cx="60" cy="31" r="2" fill="#2a3a5a" stroke-width="1"/>
    <circle cx="61" cy="30" r="0.7" fill="white" stroke="none"/>
    <!-- Smile -->
    <path d="M45,38 C47,41 53,41 55,38" fill="none" stroke-width="1.5"/>
    <!-- Tentacles - wavy, flowing down -->
    <path d="M26,48 C24,56 26,62 24,68 C22,74 24,80 22,86 C20,90 22,94 24,96"
          fill="none" stroke="#8b9dca" stroke-width="2" opacity="0.7"/>
    <path d="M34,48 C36,56 34,62 36,68 C38,74 36,80 38,86 C40,90 38,94 36,96"
          fill="none" stroke="#8b9dca" stroke-width="2" opacity="0.7"/>
    <path d="M42,50 C40,58 42,64 40,70 C38,76 40,82 38,88"
          fill="none" stroke="#8b9dca" stroke-width="1.5" opacity="0.5"/>
    <path d="M50,50 C50,58 48,64 50,70 C52,76 50,82 50,90 C50,94 48,96 50,98"
          fill="none" stroke="#8b9dca" stroke-width="2" opacity="0.7"/>
    <path d="M58,50 C60,58 58,64 60,70 C62,76 60,82 62,88"
          fill="none" stroke="#8b9dca" stroke-width="1.5" opacity="0.5"/>
    <path d="M66,48 C64,56 66,62 64,68 C62,74 64,80 62,86 C60,90 62,94 64,96"
          fill="none" stroke="#8b9dca" stroke-width="2" opacity="0.7"/>
    <path d="M74,48 C76,56 74,62 76,68 C78,74 76,80 78,86 C80,90 78,94 76,96"
          fill="none" stroke="#8b9dca" stroke-width="2" opacity="0.7"/>
    <!-- Bubbles -->
    <circle cx="86" cy="18" r="2" fill="none" stroke-width="1" stroke="#6b9dba" opacity="0.5"/>
    <circle cx="90" cy="10" r="1.5" fill="none" stroke-width="1" stroke="#6b9dba" opacity="0.4"/>
    <circle cx="88" cy="4" r="1" fill="none" stroke-width="1" stroke="#6b9dba" opacity="0.3"/>
  </g>
</svg>