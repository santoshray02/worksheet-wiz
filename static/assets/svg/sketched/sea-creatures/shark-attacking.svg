<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shark - Attacking View (mouth open, angled forward) -->
  <g stroke="#3a5a6b" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body - angled slightly upward, dynamic pose -->
    <path d="M5,60 C10,52 20,44 35,38 C50,34 65,34 76,38 C84,42 88,46 90,48
             C88,52 84,56 76,58 C65,62 50,64 35,62 C20,60 10,58 5,60 Z"
          fill="#6b8a9d" fill-opacity="0.8" stroke-width="2.5"/>
    <!-- Double stroke on body -->
    <path d="M15,46 C30,38 55,34 74,38" fill="none" stroke-width="1.2" opacity="0.35"/>
    <!-- Belly -->
    <path d="M12,58 C28,62 52,64 78,56" fill="#a8bcc8" fill-opacity="0.4" stroke="none"/>
    <!-- Open mouth - top jaw -->
    <path d="M90,48 C94,44 98,40 99,36 C96,38 92,42 90,46"
          fill="#6b8a9d" fill-opacity="0.7" stroke-width="2.5"/>
    <!-- Open mouth - bottom jaw -->
    <path d="M90,48 C94,52 98,58 99,62 C96,60 92,54 90,50"
          fill="#6b8a9d" fill-opacity="0.7" stroke-width="2.5"/>
    <!-- Inside mouth -->
    <path d="M90,46 C94,44 98,40 99,36 L99,62 C98,58 94,52 90,50 Z"
          fill="#c4756e" fill-opacity="0.6" stroke="none"/>
    <!-- Teeth - top -->
    <path d="M92,42 L93,38" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M94,40 L95,36" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M96,39 L97,35" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M98,38 L99,35" fill="none" stroke="white" stroke-width="1.2"/>
    <!-- Teeth - bottom -->
    <path d="M92,54 L93,58" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M94,56 L95,60" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M96,57 L97,62" fill="none" stroke="white" stroke-width="1.5"/>
    <path d="M98,58 L99,62" fill="none" stroke="white" stroke-width="1.2"/>
    <!-- Dorsal fin -->
    <path d="M42,36 C40,24 44,14 48,12 C50,16 50,24 48,34"
          fill="#6b8a9d" fill-opacity="0.85" stroke-width="2.5"/>
    <!-- Tail -->
    <path d="M5,60 C2,54 -1,46 -2,38 C2,44 5,50 7,56" fill="none" stroke-width="2.5"/>
    <path d="M5,60 C2,66 -1,72 -2,78 C2,72 5,66 7,62" fill="none" stroke-width="2.5"/>
    <path d="M-2,38 C0,48 0,60 -2,78" fill="#6b8a9d" fill-opacity="0.6" stroke-width="1.5"/>
    <!-- Pectoral fin - spread out -->
    <path d="M55,58 C50,66 48,74 52,74 C56,72 56,66 56,60"
          fill="#5a7a8d" fill-opacity="0.7" stroke-width="2"/>
    <!-- Eye - angry/intense -->
    <circle cx="82" cy="42" r="3" fill="white" fill-opacity="0.9" stroke-width="1.5"/>
    <circle cx="82" cy="42" r="2" fill="#1a2a3a" stroke-width="1"/>
    <circle cx="83" cy="41" r="0.6" fill="white" stroke="none"/>
    <!-- Angry eyebrow line -->
    <path d="M78,38 C80,36 84,36 86,38" fill="none" stroke-width="2"/>
    <!-- Gill slits -->
    <path d="M72,42 C72,46 72,50" fill="none" stroke-width="1.5" opacity="0.5"/>
    <path d="M68,40 C68,44 68,50" fill="none" stroke-width="1.5" opacity="0.5"/>
    <path d="M64,40 C64,44 64,50" fill="none" stroke-width="1.5" opacity="0.5"/>
    <!-- Motion lines -->
    <path d="M-4,44 C-8,44 -12,44" fill="none" stroke-width="1.5" opacity="0.3"/>
    <path d="M-4,50 C-8,50 -14,50" fill="none" stroke-width="1.5" opacity="0.3"/>
    <path d="M-4,56 C-8,56 -12,56" fill="none" stroke-width="1.5" opacity="0.3"/>
    <!-- Bubbles (agitated) -->
    <circle cx="4" cy="36" r="2" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.5"/>
    <circle cx="8" cy="30" r="1.5" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.4"/>
    <circle cx="2" cy="28" r="1" fill="none" stroke-width="1" stroke="#5a8aa9" opacity="0.3"/>
  </g>
</svg>