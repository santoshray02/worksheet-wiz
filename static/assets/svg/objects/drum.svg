<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Drum body -->
  <ellipse cx="50" cy="80" rx="32" ry="10" fill="#CC3333" stroke="#991111" stroke-width="1.5"/>
  <rect x="18" y="40" width="64" height="40" fill="#E04040" stroke="none"/>
  <ellipse cx="50" cy="40" rx="32" ry="10" fill="#FF5555" stroke="#CC3333" stroke-width="1.5"/>
  <!-- Side strokes -->
  <line x1="18" y1="40" x2="18" y2="80" stroke="#991111" stroke-width="1.5"/>
  <line x1="82" y1="40" x2="82" y2="80" stroke="#991111" stroke-width="1.5"/>
  <!-- Decorative stripes -->
  <rect x="18" y="50" width="64" height="4" fill="#FFD700" opacity="0.8"/>
  <rect x="18" y="60" width="64" height="4" fill="#4DA8DA" opacity="0.8"/>
  <rect x="18" y="70" width="64" height="4" fill="#6BCB77" opacity="0.8"/>
  <!-- Zigzag pattern -->
  <polyline points="20,56 26,53 32,56 38,53 44,56 50,53 56,56 62,53 68,56 74,53 80,56" fill="none" stroke="#FFD700" stroke-width="1.2"/>
  <!-- Drum top highlight -->
  <ellipse cx="46" cy="38" rx="14" ry="4" fill="white" opacity="0.2" transform="rotate(-5, 46, 38)"/>
  <!-- Drumstick left -->
  <line x1="15" y1="10" x2="42" y2="38" stroke="#C8841E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="42" cy="38" r="2.5" fill="#E8B960" stroke="#C8841E" stroke-width="1"/>
  <!-- Drumstick right -->
  <line x1="85" y1="10" x2="58" y2="38" stroke="#C8841E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="58" cy="38" r="2.5" fill="#E8B960" stroke="#C8841E" stroke-width="1"/>
  <!-- Impact stars -->
  <text x="35" y="8" font-size="7" fill="#FFD700">&#10022;</text>
  <text x="60" y="6" font-size="5" fill="#FF6B9D">&#10022;</text>
</svg>