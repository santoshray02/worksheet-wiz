<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Piano body -->
  <rect x="5" y="15" width="90" height="70" rx="5" fill="#2C2C2C" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Inner panel -->
  <rect x="10" y="20" width="80" height="58" rx="3" fill="#3A3A3A"/>
  <!-- White keys -->
  <rect x="12" y="25" width="10" height="48" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.8"/>
  <rect x="23" y="25" width="10" height="48" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.8"/>
  <rect x="34" y="25" width="10" height="48" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.8"/>
  <rect x="45" y="25" width="10" height="48" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.8"/>
  <rect x="56" y="25" width="10" height="48" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.8"/>
  <rect x="67" y="25" width="10" height="48" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.8"/>
  <rect x="78" y="25" width="10" height="48" rx="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.8"/>
  <!-- Black keys -->
  <rect x="19" y="25" width="7" height="30" rx="1.5" fill="#1A1A1A" stroke="#000000" stroke-width="0.5"/>
  <rect x="30" y="25" width="7" height="30" rx="1.5" fill="#1A1A1A" stroke="#000000" stroke-width="0.5"/>
  <rect x="52" y="25" width="7" height="30" rx="1.5" fill="#1A1A1A" stroke="#000000" stroke-width="0.5"/>
  <rect x="63" y="25" width="7" height="30" rx="1.5" fill="#1A1A1A" stroke="#000000" stroke-width="0.5"/>
  <rect x="74" y="25" width="7" height="30" rx="1.5" fill="#1A1A1A" stroke="#000000" stroke-width="0.5"/>
  <!-- Highlight on black keys -->
  <rect x="20" y="26" width="2" height="8" rx="1" fill="white" opacity="0.15"/>
  <rect x="31" y="26" width="2" height="8" rx="1" fill="white" opacity="0.15"/>
  <rect x="53" y="26" width="2" height="8" rx="1" fill="white" opacity="0.15"/>
  <rect x="64" y="26" width="2" height="8" rx="1" fill="white" opacity="0.15"/>
  <rect x="75" y="26" width="2" height="8" rx="1" fill="white" opacity="0.15"/>
  <!-- Music notes floating above -->
  <text x="20" y="14" font-size="10" fill="#FF6B9D" font-family="serif">&#9835;</text>
  <text x="55" y="10" font-size="8" fill="#6BCB77" font-family="serif">&#9834;</text>
  <text x="75" y="14" font-size="9" fill="#4DA8DA" font-family="serif">&#9833;</text>
  <!-- Top panel shine -->
  <rect x="12" y="20" width="76" height="4" rx="2" fill="white" opacity="0.08"/>
</svg>