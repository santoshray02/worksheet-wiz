<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Roof -->
  <polygon points="50,10 90,45 10,45" fill="#F44336" stroke="#B71C1C" stroke-width="2" stroke-linejoin="round"/>
  <!-- Walls -->
  <rect x="18" y="45" width="64" height="45" fill="#FFF9C4" stroke="#5D4037" stroke-width="2"/>
  <!-- Door -->
  <rect x="40" y="60" width="20" height="30" rx="2" fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/>
  <!-- Door knob -->
  <circle cx="55" cy="77" r="2" fill="#FFD54F" stroke="#5D4037" stroke-width="1"/>
  <!-- Left window -->
  <rect x="24" y="55" width="12" height="12" rx="1" fill="#BBDEFB" stroke="#5D4037" stroke-width="1.5"/>
  <line x1="30" y1="55" x2="30" y2="67" stroke="#5D4037" stroke-width="1"/>
  <line x1="24" y1="61" x2="36" y2="61" stroke="#5D4037" stroke-width="1"/>
  <!-- Right window -->
  <rect x="64" y="55" width="12" height="12" rx="1" fill="#BBDEFB" stroke="#5D4037" stroke-width="1.5"/>
  <line x1="70" y1="55" x2="70" y2="67" stroke="#5D4037" stroke-width="1"/>
  <line x1="64" y1="61" x2="76" y2="61" stroke="#5D4037" stroke-width="1"/>
  <!-- Chimney -->
  <rect x="68" y="15" width="10" height="22" fill="#795548" stroke="#5D4037" stroke-width="1.5"/>
</svg>
