<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer ring (frame) -->
  <circle cx="50" cy="50" r="38" fill="#E8A020" stroke="#B87A10" stroke-width="3"/>
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="32" fill="#F5D080" stroke="#D4A030" stroke-width="1.5"/>
  <!-- Drum head -->
  <circle cx="50" cy="50" r="28" fill="#FFF5E0" stroke="#E8C870" stroke-width="1"/>
  <!-- Drum head highlight -->
  <ellipse cx="44" cy="44" rx="12" ry="10" fill="white" opacity="0.3" transform="rotate(-15, 44, 44)"/>
  <!-- Cross pattern on head -->
  <line x1="50" y1="25" x2="50" y2="75" stroke="#E8D5B0" stroke-width="0.5" opacity="0.5"/>
  <line x1="25" y1="50" x2="75" y2="50" stroke="#E8D5B0" stroke-width="0.5" opacity="0.5"/>
  <!-- Jingles (metal discs) - top -->
  <ellipse cx="50" cy="14" rx="5" ry="3" fill="#FFD700" stroke="#CC9900" stroke-width="0.8"/>
  <ellipse cx="49" cy="13" rx="2" ry="1" fill="white" opacity="0.4"/>
  <!-- Jingles - top right -->
  <ellipse cx="74" cy="24" rx="5" ry="3" fill="#C0C0C0" stroke="#909090" stroke-width="0.8" transform="rotate(40, 74, 24)"/>
  <ellipse cx="73" cy="23" rx="2" ry="1" fill="white" opacity="0.4" transform="rotate(40, 73, 23)"/>
  <!-- Jingles - right -->
  <ellipse cx="86" cy="50" rx="5" ry="3" fill="#FFD700" stroke="#CC9900" stroke-width="0.8" transform="rotate(90, 86, 50)"/>
  <ellipse cx="85" cy="49" rx="2" ry="1" fill="white" opacity="0.4" transform="rotate(90, 85, 49)"/>
  <!-- Jingles - bottom right -->
  <ellipse cx="74" cy="76" rx="5" ry="3" fill="#C0C0C0" stroke="#909090" stroke-width="0.8" transform="rotate(-40, 74, 76)"/>
  <ellipse cx="73" cy="75" rx="2" ry="1" fill="white" opacity="0.4" transform="rotate(-40, 73, 75)"/>
  <!-- Jingles - bottom -->
  <ellipse cx="50" cy="86" rx="5" ry="3" fill="#FFD700" stroke="#CC9900" stroke-width="0.8"/>
  <ellipse cx="49" cy="85" rx="2" ry="1" fill="white" opacity="0.4"/>
  <!-- Jingles - bottom left -->
  <ellipse cx="26" cy="76" rx="5" ry="3" fill="#C0C0C0" stroke="#909090" stroke-width="0.8" transform="rotate(40, 26, 76)"/>
  <ellipse cx="25" cy="75" rx="2" ry="1" fill="white" opacity="0.4" transform="rotate(40, 25, 75)"/>
  <!-- Jingles - left -->
  <ellipse cx="14" cy="50" rx="5" ry="3" fill="#FFD700" stroke="#CC9900" stroke-width="0.8" transform="rotate(90, 14, 50)"/>
  <ellipse cx="13" cy="49" rx="2" ry="1" fill="white" opacity="0.4" transform="rotate(90, 13, 49)"/>
  <!-- Jingles - top left -->
  <ellipse cx="26" cy="24" rx="5" ry="3" fill="#C0C0C0" stroke="#909090" stroke-width="0.8" transform="rotate(-40, 26, 24)"/>
  <ellipse cx="25" cy="23" rx="2" ry="1" fill="white" opacity="0.4" transform="rotate(-40, 25, 23)"/>
  <!-- Decorative dots on frame -->
  <circle cx="50" cy="19" r="1" fill="#B87A10"/>
  <circle cx="66" cy="22" r="1" fill="#B87A10"/>
  <circle cx="78" cy="35" r="1" fill="#B87A10"/>
  <circle cx="81" cy="50" r="1" fill="#B87A10"/>
  <circle cx="78" cy="65" r="1" fill="#B87A10"/>
  <circle cx="66" cy="78" r="1" fill="#B87A10"/>
  <circle cx="50" cy="81" r="1" fill="#B87A10"/>
  <circle cx="34" cy="78" r="1" fill="#B87A10"/>
  <circle cx="22" cy="65" r="1" fill="#B87A10"/>
  <circle cx="19" cy="50" r="1" fill="#B87A10"/>
  <circle cx="22" cy="35" r="1" fill="#B87A10"/>
  <circle cx="34" cy="22" r="1" fill="#B87A10"/>
</svg>