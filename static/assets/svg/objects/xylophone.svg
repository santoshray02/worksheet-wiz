<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Frame legs -->
  <line x1="12" y1="25" x2="8" y2="90" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <line x1="88" y1="25" x2="92" y2="90" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame cross bars -->
  <line x1="10" y1="82" x2="90" y2="82" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="50" x2="89" y2="50" stroke="#8B6914" stroke-width="2" stroke-linecap="round"/>
  <!-- Rainbow bars (longest to shortest, bottom to top) -->
  <!-- C - Red (longest) -->
  <rect x="10" y="70" width="80" height="8" rx="3" fill="#FF4444" stroke="#CC2222" stroke-width="1"/>
  <rect x="14" y="71.5" width="30" height="2.5" rx="1" fill="white" opacity="0.25"/>
  <!-- D - Orange -->
  <rect x="14" y="60" width="72" height="8" rx="3" fill="#FF8C00" stroke="#CC6E00" stroke-width="1"/>
  <rect x="18" y="61.5" width="26" height="2.5" rx="1" fill="white" opacity="0.25"/>
  <!-- E - Yellow -->
  <rect x="18" y="50" width="64" height="8" rx="3" fill="#FFD700" stroke="#CCA800" stroke-width="1"/>
  <rect x="22" y="51.5" width="22" height="2.5" rx="1" fill="white" opacity="0.25"/>
  <!-- F - Green -->
  <rect x="22" y="40" width="56" height="8" rx="3" fill="#4CAF50" stroke="#388E3C" stroke-width="1"/>
  <rect x="26" y="41.5" width="20" height="2.5" rx="1" fill="white" opacity="0.25"/>
  <!-- G - Blue -->
  <rect x="26" y="30" width="48" height="8" rx="3" fill="#2196F3" stroke="#1565C0" stroke-width="1"/>
  <rect x="30" y="31.5" width="18" height="2.5" rx="1" fill="white" opacity="0.25"/>
  <!-- A - Indigo -->
  <rect x="30" y="20" width="40" height="8" rx="3" fill="#7B68EE" stroke="#5B48CE" stroke-width="1"/>
  <rect x="34" y="21.5" width="14" height="2.5" rx="1" fill="white" opacity="0.25"/>
  <!-- B - Violet (shortest) -->
  <rect x="34" y="10" width="32" height="8" rx="3" fill="#E040A0" stroke="#B02878" stroke-width="1"/>
  <rect x="38" y="11.5" width="12" height="2.5" rx="1" fill="white" opacity="0.25"/>
  <!-- Mallet left -->
  <line x1="15" y1="5" x2="35" y2="28" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="35" cy="28" r="4" fill="#FF6B9D" stroke="#CC4477" stroke-width="1"/>
  <circle cx="34" cy="27" r="1.5" fill="white" opacity="0.3"/>
  <!-- Mallet right -->
  <line x1="85" y1="5" x2="65" y2="28" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="65" cy="28" r="4" fill="#FF6B9D" stroke="#CC4477" stroke-width="1"/>
  <circle cx="64" cy="27" r="1.5" fill="white" opacity="0.3"/>
  <!-- Music notes -->
  <text x="3" y="10" font-size="7" fill="#FF6B9D" font-family="serif">&#9834;</text>
  <text x="90" y="12" font-size="6" fill="#4DA8DA" font-family="serif">&#9835;</text>
</svg>