<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fuselage -->
  <ellipse cx="50" cy="50" rx="38" ry="10" fill="#F0F4F8" stroke="#B0BEC5" stroke-width="1.5"/>
  <!-- Fuselage highlight -->
  <ellipse cx="48" cy="46" rx="30" ry="4" fill="white" opacity="0.5"/>
  <!-- Nose -->
  <ellipse cx="88" cy="50" rx="6" ry="7" fill="#4A90D9" stroke="#2E6DB4" stroke-width="1.5"/>
  <!-- Nose highlight -->
  <ellipse cx="87" cy="48" rx="3" ry="3" fill="#7AB8F5" opacity="0.5"/>
  <!-- Cockpit window -->
  <ellipse cx="82" cy="48" rx="5" ry="4" fill="#B8E4FF" stroke="#2E6DB4" stroke-width="1"/>
  <ellipse cx="81" cy="47" rx="2" ry="2" fill="white" opacity="0.5"/>
  <!-- Windows -->
  <circle cx="70" cy="48" r="2.5" fill="#B8E4FF" stroke="#B0BEC5" stroke-width="0.8"/>
  <circle cx="63" cy="48" r="2.5" fill="#B8E4FF" stroke="#B0BEC5" stroke-width="0.8"/>
  <circle cx="56" cy="48" r="2.5" fill="#B8E4FF" stroke="#B0BEC5" stroke-width="0.8"/>
  <circle cx="49" cy="48" r="2.5" fill="#B8E4FF" stroke="#B0BEC5" stroke-width="0.8"/>
  <circle cx="42" cy="48" r="2.5" fill="#B8E4FF" stroke="#B0BEC5" stroke-width="0.8"/>
  <!-- Blue stripe -->
  <rect x="15" y="51" width="70" height="3" rx="1.5" fill="#4A90D9" opacity="0.7"/>
  <!-- Main wings -->
  <polygon points="55,50 65,50 58,28 42,28 48,50" fill="#4A90D9" stroke="#2E6DB4" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="55,50 65,50 58,72 42,72 48,50" fill="#4A90D9" stroke="#2E6DB4" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Wing highlights -->
  <polygon points="52,48 60,48 56,32 46,32 50,48" fill="#7AB8F5" opacity="0.3"/>
  <!-- Tail fin vertical -->
  <polygon points="14,50 20,50 18,30 12,35" fill="#FF6B6B" stroke="#E05555" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Tail fin highlight -->
  <polygon points="15,48 18,48 17,36 13,39" fill="#FF9999" opacity="0.4"/>
  <!-- Tail wings -->
  <polygon points="16,48 22,48 20,40 14,42" fill="#4A90D9" stroke="#2E6DB4" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="16,52 22,52 20,60 14,58" fill="#4A90D9" stroke="#2E6DB4" stroke-width="1" stroke-linejoin="round"/>
  <!-- Engine under wing -->
  <ellipse cx="55" cy="35" rx="4" ry="2.5" fill="#E0E0E0" stroke="#B0BEC5" stroke-width="1"/>
  <ellipse cx="55" cy="65" rx="4" ry="2.5" fill="#E0E0E0" stroke="#B0BEC5" stroke-width="1"/>
  <!-- Cute clouds -->
  <circle cx="8" cy="22" r="4" fill="white" opacity="0.4"/>
  <circle cx="14" cy="20" r="5" fill="white" opacity="0.4"/>
  <circle cx="20" cy="22" r="4" fill="white" opacity="0.4"/>
  <circle cx="80" cy="78" r="3" fill="white" opacity="0.3"/>
  <circle cx="85" cy="76" r="4" fill="white" opacity="0.3"/>
  <circle cx="90" cy="78" r="3" fill="white" opacity="0.3"/>
</svg>