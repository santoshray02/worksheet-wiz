<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main rotor mast -->
  <rect x="48" y="20" width="4" height="10" rx="1" fill="#888"/>
  <!-- Main rotor blades -->
  <ellipse cx="50" cy="20" rx="40" ry="3" fill="#666" stroke="#444" stroke-width="1" opacity="0.7"/>
  <!-- Rotor hub -->
  <circle cx="50" cy="20" r="3" fill="#888" stroke="#666" stroke-width="1"/>
  <circle cx="50" cy="20" r="1.5" fill="#AAA"/>
  <!-- Body -->
  <ellipse cx="45" cy="45" rx="28" ry="16" fill="#E53935" stroke="#C62828" stroke-width="2"/>
  <!-- Body highlight -->
  <ellipse cx="40" cy="40" rx="18" ry="8" fill="#FF6B6B" opacity="0.4"/>
  <!-- Cockpit window -->
  <ellipse cx="60" cy="42" rx="12" ry="10" fill="#B8E4FF" stroke="#C62828" stroke-width="1.5"/>
  <!-- Window shine -->
  <ellipse cx="57" cy="39" rx="5" ry="5" fill="white" opacity="0.4"/>
  <!-- Window frame -->
  <line x1="60" y1="32" x2="60" y2="52" stroke="#C62828" stroke-width="1" opacity="0.5"/>
  <!-- Tail boom -->
  <polygon points="17,40 17,50 -5,45 -5,42" fill="#E53935" stroke="#C62828" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Tail transition -->
  <path d="M17,38 L5,42 L5,48 L17,52" fill="#E53935" stroke="#C62828" stroke-width="1"/>
  <!-- Tail fin vertical -->
  <polygon points="0,45 -2,30 6,38" fill="#FFD233" stroke="#E6A817" stroke-width="1" stroke-linejoin="round"/>
  <!-- Tail fin horizontal -->
  <ellipse cx="0" cy="44" rx="6" ry="2" fill="#FFD233" stroke="#E6A817" stroke-width="1"/>
  <!-- Tail rotor -->
  <ellipse cx="-1" cy="36" rx="1.5" ry="7" fill="#666" opacity="0.6"/>
  <circle cx="-1" cy="36" r="2" fill="#888"/>
  <!-- Red stripe on body -->
  <path d="M25,52 Q45,58 65,52" fill="none" stroke="#FFD233" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Landing skids -->
  <line x1="30" y1="58" x2="30" y2="68" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="58" x2="55" y2="68" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="68" x2="63" y2="68" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="72" x2="63" y2="72" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- Skid cross supports -->
  <line x1="30" y1="68" x2="30" y2="72" stroke="#888" stroke-width="2"/>
  <line x1="55" y1="68" x2="55" y2="72" stroke="#888" stroke-width="2"/>
  <!-- Door handle -->
  <rect x="48" y="48" width="4" height="1.5" rx="0.5" fill="#FFD233"/>
  <!-- Cute rotor motion lines -->
  <path d="M12,17 Q10,15 8,17" fill="none" stroke="#AAA" stroke-width="0.8" opacity="0.5"/>
  <path d="M88,17 Q90,15 92,17" fill="none" stroke="#AAA" stroke-width="0.8" opacity="0.5"/>
</svg>