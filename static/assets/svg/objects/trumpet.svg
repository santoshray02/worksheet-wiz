<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Bell (flared end) -->
  <path d="M75,35 Q90,30 92,50 Q90,70 75,65" fill="#FFD700" stroke="#CC9900" stroke-width="1.5"/>
  <ellipse cx="92" cy="50" rx="5" ry="18" fill="#FFBF00" stroke="#CC9900" stroke-width="1.5"/>
  <!-- Bell inner -->
  <ellipse cx="92" cy="50" rx="3" ry="13" fill="#CC7700" opacity="0.5"/>
  <!-- Main tube -->
  <rect x="15" y="42" width="62" height="16" rx="4" fill="#FFD700" stroke="#CC9900" stroke-width="1.5"/>
  <!-- Highlight on tube -->
  <rect x="20" y="44" width="50" height="4" rx="2" fill="white" opacity="0.3"/>
  <!-- Valves -->
  <rect x="32" y="28" width="6" height="16" rx="3" fill="#FFBF00" stroke="#CC9900" stroke-width="1"/>
  <rect x="44" y="28" width="6" height="16" rx="3" fill="#FFBF00" stroke="#CC9900" stroke-width="1"/>
  <rect x="56" y="28" width="6" height="16" rx="3" fill="#FFBF00" stroke="#CC9900" stroke-width="1"/>
  <!-- Valve caps -->
  <circle cx="35" cy="28" r="3.5" fill="#FFE44D" stroke="#CC9900" stroke-width="1"/>
  <circle cx="47" cy="28" r="3.5" fill="#FFE44D" stroke="#CC9900" stroke-width="1"/>
  <circle cx="59" cy="28" r="3.5" fill="#FFE44D" stroke="#CC9900" stroke-width="1"/>
  <!-- Valve cap highlights -->
  <circle cx="34" cy="27" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="46" cy="27" r="1.2" fill="white" opacity="0.4"/>
  <circle cx="58" cy="27" r="1.2" fill="white" opacity="0.4"/>
  <!-- Mouthpiece -->
  <ellipse cx="12" cy="50" rx="5" ry="6" fill="#FFE44D" stroke="#CC9900" stroke-width="1.2"/>
  <ellipse cx="9" cy="50" rx="3" ry="4" fill="#FFD700" stroke="#CC9900" stroke-width="1"/>
  <!-- Lower tube curve -->
  <path d="M35,58 Q35,75 47,75 Q59,75 59,58" fill="none" stroke="#CC9900" stroke-width="3"/>
  <path d="M35,58 Q35,73 47,73 Q59,73 59,58" fill="none" stroke="#FFD700" stroke-width="2"/>
  <!-- Music notes -->
  <text x="78" y="22" font-size="10" fill="#FF6B9D" font-family="serif">&#9835;</text>
  <text x="88" y="15" font-size="7" fill="#6BCB77" font-family="serif">&#9834;</text>
  <!-- Bell highlight -->
  <ellipse cx="90" cy="44" rx="2" ry="8" fill="white" opacity="0.2"/>
</svg>