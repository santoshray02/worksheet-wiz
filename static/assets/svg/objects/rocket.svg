<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Stars background -->
  <circle cx="10" cy="10" r="1" fill="#FFD233" opacity="0.6"/>
  <circle cx="85" cy="8" r="1.2" fill="#FFD233" opacity="0.5"/>
  <circle cx="15" cy="80" r="0.8" fill="#FFD233" opacity="0.4"/>
  <circle cx="90" cy="70" r="1" fill="#FFD233" opacity="0.5"/>
  <circle cx="5" cy="45" r="0.8" fill="#FFD233" opacity="0.6"/>
  <circle cx="95" cy="40" r="1" fill="#FFD233" opacity="0.4"/>
  <circle cx="20" cy="25" r="0.6" fill="#FFD233" opacity="0.5"/>
  <circle cx="80" cy="90" r="0.8" fill="#FFD233" opacity="0.5"/>
  <!-- Flame - outer -->
  <ellipse cx="50" cy="88" rx="10" ry="10" fill="#FF6B00" opacity="0.6"/>
  <ellipse cx="50" cy="85" rx="7" ry="8" fill="#FF9500" opacity="0.7"/>
  <!-- Flame - inner -->
  <ellipse cx="50" cy="83" rx="5" ry="7" fill="#FFD233" opacity="0.8"/>
  <ellipse cx="50" cy="81" rx="3" ry="5" fill="#FFF3B0" opacity="0.9"/>
  <!-- Flame particles -->
  <circle cx="42" cy="90" r="2" fill="#FF6B00" opacity="0.4"/>
  <circle cx="58" cy="92" r="1.5" fill="#FF6B00" opacity="0.3"/>
  <circle cx="46" cy="95" r="1.5" fill="#FF9500" opacity="0.3"/>
  <!-- Rocket body -->
  <path d="M38,72 L38,35 Q38,15 50,8 Q62,15 62,35 L62,72 Z" fill="#F0F4F8" stroke="#B0BEC5" stroke-width="2"/>
  <!-- Body highlight -->
  <path d="M42,68 L42,38 Q42,20 50,14 Q52,16 52,38 L52,68 Z" fill="white" opacity="0.4"/>
  <!-- Nose cone -->
  <path d="M38,35 Q38,15 50,8 Q62,15 62,35" fill="#E53935" stroke="#C62828" stroke-width="1.5"/>
  <!-- Nose highlight -->
  <path d="M42,33 Q43,18 50,12 Q52,18 53,33" fill="#FF6B6B" opacity="0.4"/>
  <!-- Window / porthole -->
  <circle cx="50" cy="40" r="7" fill="#4A90D9" stroke="#2E6DB4" stroke-width="2"/>
  <circle cx="50" cy="40" r="5" fill="#B8E4FF"/>
  <!-- Window shine -->
  <circle cx="48" cy="38" r="2.5" fill="white" opacity="0.5"/>
  <!-- Red stripe -->
  <rect x="38" y="53" width="24" height="4" fill="#E53935"/>
  <!-- Blue stripe -->
  <rect x="38" y="59" width="24" height="3" fill="#4A90D9"/>
  <!-- Left fin -->
  <path d="M38,60 L22,78 L28,78 L38,72 Z" fill="#E53935" stroke="#C62828" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left fin highlight -->
  <path d="M37,62 L27,76 L30,76 L37,70 Z" fill="#FF6B6B" opacity="0.3"/>
  <!-- Right fin -->
  <path d="M62,60 L78,78 L72,78 L62,72 Z" fill="#E53935" stroke="#C62828" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right fin highlight -->
  <path d="M63,62 L73,76 L70,76 L63,70 Z" fill="#FF6B6B" opacity="0.3"/>
  <!-- Nozzle -->
  <path d="M42,72 L40,78 L60,78 L58,72 Z" fill="#888" stroke="#666" stroke-width="1"/>
  <ellipse cx="50" cy="78" rx="10" ry="2" fill="#666"/>
  <!-- Rivets -->
  <circle cx="42" cy="50" r="1" fill="#CCC"/>
  <circle cx="58" cy="50" r="1" fill="#CCC"/>
  <circle cx="42" cy="65" r="1" fill="#CCC"/>
  <circle cx="58" cy="65" r="1" fill="#CCC"/>
</svg>