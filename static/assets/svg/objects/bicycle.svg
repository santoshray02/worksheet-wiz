<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rear wheel -->
  <circle cx="28" cy="65" r="16" fill="none" stroke="#555" stroke-width="3"/>
  <circle cx="28" cy="65" r="14" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="2,4"/>
  <circle cx="28" cy="65" r="3" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Front wheel -->
  <circle cx="72" cy="65" r="16" fill="none" stroke="#555" stroke-width="3"/>
  <circle cx="72" cy="65" r="14" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="2,4"/>
  <circle cx="72" cy="65" r="3" fill="#888" stroke="#555" stroke-width="1.5"/>
  <!-- Spokes rear -->
  <line x1="28" y1="52" x2="28" y2="78" stroke="#AAA" stroke-width="0.7"/>
  <line x1="15" y1="65" x2="41" y2="65" stroke="#AAA" stroke-width="0.7"/>
  <line x1="18" y1="55" x2="38" y2="75" stroke="#AAA" stroke-width="0.7"/>
  <line x1="38" y1="55" x2="18" y2="75" stroke="#AAA" stroke-width="0.7"/>
  <!-- Spokes front -->
  <line x1="72" y1="52" x2="72" y2="78" stroke="#AAA" stroke-width="0.7"/>
  <line x1="59" y1="65" x2="85" y2="65" stroke="#AAA" stroke-width="0.7"/>
  <line x1="62" y1="55" x2="82" y2="75" stroke="#AAA" stroke-width="0.7"/>
  <line x1="82" y1="55" x2="62" y2="75" stroke="#AAA" stroke-width="0.7"/>
  <!-- Frame - main triangle -->
  <line x1="28" y1="65" x2="50" y2="45" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="45" x2="28" y2="65" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="45" x2="50" y2="65" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="65" x2="50" y2="65" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame - front fork -->
  <line x1="50" y1="45" x2="72" y2="65" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="50" y1="65" x2="45" y2="42" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat -->
  <ellipse cx="43" cy="40" rx="7" ry="3" fill="#333" stroke="#222" stroke-width="1"/>
  <!-- Seat highlight -->
  <ellipse cx="42" cy="39" rx="4" ry="1.5" fill="#555" opacity="0.5"/>
  <!-- Handlebar stem -->
  <line x1="72" y1="65" x2="68" y2="40" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="62" y1="38" x2="74" y2="38" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- Handlebar grips -->
  <circle cx="62" cy="38" r="2" fill="#555"/>
  <circle cx="74" cy="38" r="2" fill="#555"/>
  <!-- Pedal area -->
  <circle cx="50" cy="65" r="4" fill="#E53935" stroke="#C62828" stroke-width="1.5"/>
  <circle cx="50" cy="65" r="1.5" fill="#FFD233"/>
  <!-- Chain guard hint -->
  <path d="M46,65 Q38,72 32,68" fill="none" stroke="#C62828" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pedals -->
  <line x1="50" y1="65" x2="55" y2="60" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="54" y="58" width="4" height="2" rx="0.5" fill="#888" stroke="#666" stroke-width="0.5"/>
  <line x1="50" y1="65" x2="45" y2="70" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="42" y="70" width="4" height="2" rx="0.5" fill="#888" stroke="#666" stroke-width="0.5"/>
  <!-- Bell on handlebar -->
  <circle cx="66" cy="36" r="2.5" fill="#FFD233" stroke="#E6A817" stroke-width="0.8"/>
  <circle cx="65.5" cy="35.5" r="1" fill="#FFE680" opacity="0.6"/>
  <!-- Reflector rear -->
  <circle cx="12" cy="65" r="1.5" fill="#FF4444" stroke="#CC0000" stroke-width="0.5"/>
</svg>