<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sky gradient hint -->
  <rect x="0" y="0" width="100" height="65" fill="#E8F4FD"/>
  <!-- Sun -->
  <circle cx="85" cy="15" r="8" fill="#FFD233" opacity="0.8"/>
  <circle cx="84" cy="14" r="5" fill="#FFE680" opacity="0.5"/>
  <!-- Mast -->
  <line x1="45" y1="15" x2="45" y2="62" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Main sail -->
  <polygon points="47,18 47,58 78,58" fill="#FF6B6B" stroke="#E05555" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Sail highlight -->
  <polygon points="48,22 48,55 72,55" fill="#FF9999" opacity="0.3"/>
  <!-- Sail stripe -->
  <polygon points="47,38 47,48 63,48" fill="white" opacity="0.3"/>
  <!-- Front sail -->
  <polygon points="43,20 43,55 20,55" fill="#FFD233" stroke="#E6A817" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Front sail highlight -->
  <polygon points="42,25 42,52 25,52" fill="#FFE680" opacity="0.3"/>
  <!-- Flag -->
  <polygon points="45,15 45,10 54,12.5" fill="#4A90D9" stroke="#2E6DB4" stroke-width="0.8"/>
  <!-- Hull -->
  <path d="M15,62 Q12,62 14,72 L30,78 L60,78 L76,72 Q78,62 75,62 Z" fill="#4A90D9" stroke="#2E6DB4" stroke-width="2"/>
  <!-- Hull highlight -->
  <path d="M20,64 Q18,64 19,70 L32,74 L58,74 L71,70 Q72,64 70,64 Z" fill="#7AB8F5" opacity="0.3"/>
  <!-- Hull stripe -->
  <path d="M18,68 Q16,68 17,73 L31,77 L59,77 L73,73 Q74,68 72,68 Z" fill="#2E6DB4" opacity="0.4"/>
  <!-- Porthole -->
  <circle cx="40" cy="68" r="2.5" fill="#B8E4FF" stroke="#2E6DB4" stroke-width="1"/>
  <circle cx="50" cy="68" r="2.5" fill="#B8E4FF" stroke="#2E6DB4" stroke-width="1"/>
  <!-- Porthole shine -->
  <circle cx="39" cy="67" r="1" fill="white" opacity="0.5"/>
  <circle cx="49" cy="67" r="1" fill="white" opacity="0.5"/>
  <!-- Water -->
  <path d="M0,78 Q10,75 20,78 Q30,81 40,78 Q50,75 60,78 Q70,81 80,78 Q90,75 100,78 L100,100 L0,100 Z" fill="#4AB8D9" opacity="0.6"/>
  <path d="M0,83 Q10,80 20,83 Q30,86 40,83 Q50,80 60,83 Q70,86 80,83 Q90,80 100,83 L100,100 L0,100 Z" fill="#3A9CC5" opacity="0.5"/>
  <path d="M0,88 Q10,85 20,88 Q30,91 40,88 Q50,85 60,88 Q70,91 80,88 Q90,85 100,88 L100,100 L0,100 Z" fill="#2E86B0" opacity="0.5"/>
  <!-- Water sparkles -->
  <circle cx="25" cy="85" r="1" fill="white" opacity="0.5"/>
  <circle cx="65" cy="82" r="1" fill="white" opacity="0.4"/>
  <circle cx="80" cy="90" r="1" fill="white" opacity="0.3"/>
</svg>