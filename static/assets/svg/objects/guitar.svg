<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Neck -->
  <rect x="46" y="5" width="8" height="45" rx="2" fill="#8B6914" stroke="#5C4400" stroke-width="1.5"/>
  <!-- Frets -->
  <line x1="47" y1="15" x2="53" y2="15" stroke="#D4A030" stroke-width="1"/>
  <line x1="47" y1="22" x2="53" y2="22" stroke="#D4A030" stroke-width="1"/>
  <line x1="47" y1="29" x2="53" y2="29" stroke="#D4A030" stroke-width="1"/>
  <line x1="47" y1="36" x2="53" y2="36" stroke="#D4A030" stroke-width="1"/>
  <!-- Strings -->
  <line x1="48.5" y1="8" x2="48.5" y2="75" stroke="#E8D5A3" stroke-width="0.5"/>
  <line x1="50" y1="8" x2="50" y2="75" stroke="#E8D5A3" stroke-width="0.5"/>
  <line x1="51.5" y1="8" x2="51.5" y2="75" stroke="#E8D5A3" stroke-width="0.5"/>
  <!-- Headstock -->
  <rect x="44" y="2" width="12" height="8" rx="3" fill="#5C4400" stroke="#3D2E00" stroke-width="1"/>
  <!-- Tuning pegs -->
  <circle cx="45" cy="4" r="1.2" fill="#D4A030"/>
  <circle cx="45" cy="7" r="1.2" fill="#D4A030"/>
  <circle cx="55" cy="4" r="1.2" fill="#D4A030"/>
  <circle cx="55" cy="7" r="1.2" fill="#D4A030"/>
  <!-- Body -->
  <ellipse cx="50" cy="68" rx="22" ry="16" fill="#C8841E" stroke="#8B5E0B" stroke-width="2"/>
  <ellipse cx="50" cy="78" rx="26" ry="18" fill="#C8841E" stroke="#8B5E0B" stroke-width="2"/>
  <!-- Body overlap cover -->
  <ellipse cx="50" cy="73" rx="21" ry="10" fill="#C8841E"/>
  <!-- Sound hole -->
  <circle cx="50" cy="68" r="7" fill="#5C3400" stroke="#3D2200" stroke-width="1"/>
  <circle cx="50" cy="68" r="8" fill="none" stroke="#D4A030" stroke-width="0.8"/>
  <!-- Bridge -->
  <rect x="45" y="78" width="10" height="3" rx="1" fill="#5C4400"/>
  <!-- Highlight -->
  <ellipse cx="42" cy="62" rx="6" ry="3" fill="white" opacity="0.2" transform="rotate(-20, 42, 62)"/>
  <!-- Cheeks (cute face) -->
  <circle cx="44" cy="69" r="1.5" fill="#FF9999" opacity="0.5"/>
  <circle cx="56" cy="69" r="1.5" fill="#FF9999" opacity="0.5"/>
</svg>