<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cargo body -->
  <rect x="8" y="25" width="55" height="40" rx="4" ry="4" fill="#4A90D9" stroke="#2E6DB4" stroke-width="2"/>
  <!-- Cargo highlight -->
  <rect x="11" y="28" width="49" height="8" rx="3" fill="#7AB8F5" opacity="0.5"/>
  <!-- Cargo door lines -->
  <line x1="35" y1="38" x2="35" y2="63" stroke="#2E6DB4" stroke-width="1" opacity="0.5"/>
  <!-- Cargo door handle -->
  <rect x="30" y="48" width="4" height="2" rx="1" fill="#FFD233"/>
  <rect x="37" y="48" width="4" height="2" rx="1" fill="#FFD233"/>
  <!-- Cab -->
  <rect x="63" y="35" width="28" height="30" rx="6" ry="6" fill="#5BA3EC" stroke="#2E6DB4" stroke-width="2"/>
  <!-- Cab highlight -->
  <rect x="66" y="38" width="22" height="6" rx="3" fill="#7AB8F5" opacity="0.5"/>
  <!-- Windshield -->
  <rect x="68" y="40" width="18" height="12" rx="3" fill="#B8E4FF" stroke="#2E6DB4" stroke-width="1.5"/>
  <!-- Windshield shine -->
  <line x1="70" y1="42" x2="70" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Headlight -->
  <circle cx="90" cy="57" r="3" fill="#FFFDE0" stroke="#E6A817" stroke-width="1"/>
  <!-- Bumper -->
  <rect x="63" y="65" width="30" height="4" rx="2" fill="#CCC" stroke="#AAA" stroke-width="1"/>
  <!-- Wheel - rear -->
  <circle cx="25" cy="70" r="9" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="25" cy="70" r="5" fill="#888"/>
  <circle cx="25" cy="70" r="2" fill="#AAA"/>
  <!-- Wheel - front -->
  <circle cx="77" cy="70" r="9" fill="#555" stroke="#333" stroke-width="2"/>
  <circle cx="77" cy="70" r="5" fill="#888"/>
  <circle cx="77" cy="70" r="2" fill="#AAA"/>
  <!-- Undercarriage -->
  <rect x="20" y="63" width="62" height="3" rx="1" fill="#444"/>
  <!-- Side mirror -->
  <rect x="62" y="42" width="4" height="3" rx="1" fill="#78B9EB" stroke="#2E6DB4" stroke-width="0.8"/>
  <!-- White delivery mark -->
  <rect x="18" y="40" width="10" height="12" rx="2" fill="white" opacity="0.3"/>
  <rect x="20" y="42" width="6" height="8" rx="1" fill="white" opacity="0.3"/>
</svg>