<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Mane (outer ring of petals) -->
  <circle cx="50" cy="52" r="38" fill="#E65100" stroke="#BF360C" stroke-width="2"/>
  <circle cx="50" cy="52" r="34" fill="#EF6C00"/>
  <!-- Mane texture points -->
  <circle cx="20" cy="40" r="8" fill="#E65100"/>
  <circle cx="80" cy="40" r="8" fill="#E65100"/>
  <circle cx="16" cy="55" r="7" fill="#E65100"/>
  <circle cx="84" cy="55" r="7" fill="#E65100"/>
  <circle cx="22" cy="70" r="7" fill="#E65100"/>
  <circle cx="78" cy="70" r="7" fill="#E65100"/>
  <circle cx="35" cy="82" r="7" fill="#E65100"/>
  <circle cx="65" cy="82" r="7" fill="#E65100"/>
  <circle cx="50" cy="86" r="7" fill="#E65100"/>
  <circle cx="30" cy="25" r="7" fill="#E65100"/>
  <circle cx="70" cy="25" r="7" fill="#E65100"/>
  <circle cx="50" cy="18" r="7" fill="#E65100"/>
  <!-- Face -->
  <ellipse cx="50" cy="55" rx="25" ry="24" fill="#FFB74D" stroke="#5D4037" stroke-width="2"/>
  <!-- Ears -->
  <circle cx="28" cy="35" r="6" fill="#FFB74D" stroke="#5D4037" stroke-width="1.5"/>
  <circle cx="28" cy="35" r="3" fill="#FFCC80"/>
  <circle cx="72" cy="35" r="6" fill="#FFB74D" stroke="#5D4037" stroke-width="1.5"/>
  <circle cx="72" cy="35" r="3" fill="#FFCC80"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="50" rx="4.5" ry="5" fill="white" stroke="#5D4037" stroke-width="1.5"/>
  <ellipse cx="60" cy="50" rx="4.5" ry="5" fill="white" stroke="#5D4037" stroke-width="1.5"/>
  <ellipse cx="41" cy="51" rx="2.5" ry="3" fill="#333"/>
  <ellipse cx="61" cy="51" rx="2.5" ry="3" fill="#333"/>
  <!-- Nose -->
  <polygon points="50,58 47,62 53,62" fill="#5D4037"/>
  <!-- Mouth -->
  <path d="M47,64 Q50,68 53,64" fill="none" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <circle cx="34" cy="58" r="4" fill="#F48FB1" opacity="0.4"/>
  <circle cx="66" cy="58" r="4" fill="#F48FB1" opacity="0.4"/>
  <!-- Whisker dots -->
  <circle cx="46" cy="62" r="1" fill="#5D4037"/>
  <circle cx="54" cy="62" r="1" fill="#5D4037"/>
  <circle cx="44" cy="65" r="1" fill="#5D4037"/>
  <circle cx="56" cy="65" r="1" fill="#5D4037"/>
</svg>
