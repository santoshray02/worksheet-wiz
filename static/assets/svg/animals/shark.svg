<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Body -->
  <path d="M15 50 Q10 42 18 36 Q30 28 50 30 Q70 28 82 36 Q90 42 85 50 Q90 58 82 62 Q70 68 50 68 Q30 68 18 62 Q10 58 15 50Z" fill="#8E9EAB" stroke="#6C7A89" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belly -->
  <path d="M20 52 Q30 48 50 48 Q70 48 80 52 Q78 62 65 65 Q50 67 35 65 Q22 62 20 52Z" fill="#D5DBDB" stroke="none"/>
  <!-- Dorsal fin -->
  <path d="M48 30 Q50 12 56 16 Q54 24 52 30" fill="#7F8C8D" stroke="#6C7A89" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M85 46 Q92 34 96 30 Q93 42 93 48 Q93 54 96 68 Q92 64 85 52" fill="#8E9EAB" stroke="#6C7A89" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Side fin left -->
  <path d="M32 58 Q26 70 22 68 Q24 62 32 58Z" fill="#7F8C8D" stroke="#6C7A89" stroke-width="1" stroke-linecap="round"/>
  <!-- Side fin right -->
  <path d="M65 58 Q72 70 76 68 Q73 62 65 58Z" fill="#7F8C8D" stroke="#6C7A89" stroke-width="1" stroke-linecap="round"/>
  <!-- Small back fin -->
  <path d="M72 34 Q74 28 77 32 Q76 35 74 36" fill="#7F8C8D" stroke="#6C7A89" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Left eye -->
  <circle cx="26" cy="44" r="4.5" fill="white" stroke="#6C7A89" stroke-width="0.8"/>
  <circle cx="25" cy="43.5" r="2.2" fill="#1A1A2E"/>
  <circle cx="24.2" cy="42.8" r="0.9" fill="white"/>
  <!-- Right eye -->
  <circle cx="42" cy="42" r="4.5" fill="white" stroke="#6C7A89" stroke-width="0.8"/>
  <circle cx="41" cy="41.5" r="2.2" fill="#1A1A2E"/>
  <circle cx="40.2" cy="40.8" r="0.9" fill="white"/>
  <!-- Friendly smile -->
  <path d="M18 52 Q24 58 34 55" fill="none" stroke="#6C7A89" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Teeth (small, cute, rounded) -->
  <circle cx="20" cy="52" r="1" fill="white" stroke="#AEB6BF" stroke-width="0.3"/>
  <circle cx="24" cy="54" r="1" fill="white" stroke="#AEB6BF" stroke-width="0.3"/>
  <circle cx="28" cy="55" r="1" fill="white" stroke="#AEB6BF" stroke-width="0.3"/>
  <!-- Gill lines -->
  <path d="M38 48 L38 54" fill="none" stroke="#6C7A89" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M41 48 L41 54" fill="none" stroke="#6C7A89" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M44 48 L44 53" fill="none" stroke="#6C7A89" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Body highlight -->
  <ellipse cx="50" cy="36" rx="18" ry="4" fill="white" opacity="0.15"/>
  <!-- Cheek blush -->
  <circle cx="30" cy="52" r="3" fill="#F1948A" opacity="0.3"/>
</svg>