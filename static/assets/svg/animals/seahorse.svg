  <path d="M42 28 Q35 30 32 38 Q30 46 32 54 Q34 62 40 68 Q45 74 48 72 Q52 68 50 60 Q48 52 48 44 Q48 36 50 30 Q48 26 42 28Z" fill="#F39C12" stroke="#D68910" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belly ridges -->
  <path d="M38 38 Q43 36 46 38" fill="none" stroke="#E8B960" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M36 44 Q42 42 46 44" fill="none" stroke="#E8B960" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M35 50 Q41 48 47 50" fill="none" stroke="#E8B960" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M36 56 Q42 54 48 56" fill="none" stroke="#E8B960" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M38 62 Q43 60 48 62" fill="none" stroke="#E8B960" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Belly lighter area -->
  <path d="M38 36 Q36 46 36 56 Q38 66 44 70 Q48 66 48 56 Q48 46 46 36 Q43 34 38 36Z" fill="#FDEBD0" opacity="0.4"/>
  <!-- Head -->
  <ellipse cx="40" cy="24" rx="10" ry="9" fill="#F39C12" stroke="#D68910" stroke-width="1.5"/>
  <!-- Snout -->
  <path d="M30 26 Q24 25 20 24" fill="none" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
  <circle cx="19" cy="24" r="1" fill="#D68910"/>
  <!-- Crown/spiny crest -->
  <path d="M42 15 Q44 8 46 15" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M46 16 Q49 10 50 17" fill="#E67E22" stroke="#D35400" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M38 16 Q39 9 42 15" fill="#F1C40F" stroke="#D4AC0D" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Dorsal fin -->
  <path d="M50 32 Q56 28 54 34 Q58 32 55 38 Q58 36 54 42 Q52 44 50 42" fill="#E74C3C" stroke="#C0392B" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <!-- Eye -->
  <circle cx="36" cy="22" r="4" fill="white" stroke="#D68910" stroke-width="0.8"/>
  <circle cx="35" cy="21.5" r="2" fill="#1A1A2E"/>
  <circle cx="34.5" cy="20.8" r="0.8" fill="white"/>
  <!-- Smile -->
  <path d="M28 27 Q30 30 33 28" fill="none" stroke="#D68910" stroke-width="1" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <circle cx="33" cy="28" r="2.5" fill="#FF9AA2" opacity="0.35"/>
  <!-- Small fin -->
  <path d="M34 48 Q28 50 30 54 Q33 52 36 52" fill="#E67E22" stroke="#D68910" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
