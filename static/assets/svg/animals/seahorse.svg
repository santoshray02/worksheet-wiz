<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Curled tail -->
  <path d="M48 72 Q45 78 48 84 Q52 90 56 86 Q60 82 56 78 Q52 76 50 78" fill="none" stroke="#E67E22" stroke-width="3" stroke-linecap="round"/>
