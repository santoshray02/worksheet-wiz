<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fish body -->
  <ellipse cx="45" cy="50" rx="30" ry="18" fill="#42A5F5" stroke="#1565C0" stroke-width="2"/>
  <!-- Tail -->
  <polygon points="72,50 92,35 92,65" fill="#42A5F5" stroke="#1565C0" stroke-width="2" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="30" cy="46" r="5" fill="white" stroke="#1565C0" stroke-width="1.5"/>
  <circle cx="31" cy="46" r="2.5" fill="#333"/>
  <!-- Mouth -->
  <path d="M16,52 Q20,50 16,48" fill="none" stroke="#1565C0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Fin -->
  <path d="M42,32 Q48,22 55,32" fill="#64B5F6" stroke="#1565C0" stroke-width="1.5"/>
  <!-- Scales -->
  <path d="M35,44 Q40,40 45,44" fill="none" stroke="#64B5F6" stroke-width="1" opacity="0.6"/>
  <path d="M40,50 Q45,46 50,50" fill="none" stroke="#64B5F6" stroke-width="1" opacity="0.6"/>
  <path d="M35,56 Q40,52 45,56" fill="none" stroke="#64B5F6" stroke-width="1" opacity="0.6"/>
  <!-- Bubbles -->
  <circle cx="10" cy="38" r="2" fill="none" stroke="#90CAF9" stroke-width="1"/>
  <circle cx="8" cy="30" r="1.5" fill="none" stroke="#90CAF9" stroke-width="1"/>
</svg>
