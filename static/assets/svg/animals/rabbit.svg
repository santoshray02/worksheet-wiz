<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Left ear -->
  <ellipse cx="36" cy="22" rx="8" ry="22" fill="white" stroke="#9E9E9E" stroke-width="2"/>
  <ellipse cx="36" cy="22" rx="5" ry="18" fill="#F8BBD0"/>
  <!-- Right ear -->
  <ellipse cx="64" cy="22" rx="8" ry="22" fill="white" stroke="#9E9E9E" stroke-width="2"/>
  <ellipse cx="64" cy="22" rx="5" ry="18" fill="#F8BBD0"/>
  <!-- Head -->
  <ellipse cx="50" cy="55" rx="28" ry="26" fill="white" stroke="#9E9E9E" stroke-width="2"/>
  <!-- Cheeks (puffy) -->
  <ellipse cx="34" cy="60" rx="10" ry="8" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1"/>
  <ellipse cx="66" cy="60" rx="10" ry="8" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1"/>
  <!-- Eyes -->
  <ellipse cx="40" cy="50" rx="5" ry="5.5" fill="white" stroke="#9E9E9E" stroke-width="1.5"/>
  <ellipse cx="60" cy="50" rx="5" ry="5.5" fill="white" stroke="#9E9E9E" stroke-width="1.5"/>
  <ellipse cx="41" cy="51" rx="2.5" ry="3" fill="#E91E63"/>
  <ellipse cx="61" cy="51" rx="2.5" ry="3" fill="#E91E63"/>
  <!-- Eye shine -->
  <circle cx="42" cy="49" r="1" fill="white"/>
  <circle cx="62" cy="49" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="58" rx="3" ry="2.5" fill="#F48FB1"/>
  <!-- Mouth -->
  <path d="M47,61 Q50,65 53,61" fill="none" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="50" y2="63" stroke="#9E9E9E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="12" y1="56" x2="32" y2="60" stroke="#BDBDBD" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="63" x2="32" y2="63" stroke="#BDBDBD" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="60" x2="88" y2="56" stroke="#BDBDBD" stroke-width="1" stroke-linecap="round"/>
  <line x1="68" y1="63" x2="88" y2="63" stroke="#BDBDBD" stroke-width="1" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <circle cx="33" cy="58" r="4" fill="#F48FB1" opacity="0.35"/>
  <circle cx="67" cy="58" r="4" fill="#F48FB1" opacity="0.35"/>
  <!-- Teeth -->
  <rect x="47" y="65" width="3" height="4" rx="1" fill="white" stroke="#BDBDBD" stroke-width="0.8"/>
  <rect x="50" y="65" width="3" height="4" rx="1" fill="white" stroke="#BDBDBD" stroke-width="0.8"/>
</svg>
