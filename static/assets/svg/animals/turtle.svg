<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Tail -->
  <polygon points="85,62 95,58 90,65" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5"/>
  <!-- Back legs -->
  <ellipse cx="72" cy="72" rx="8" ry="6" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5" transform="rotate(20 72 72)"/>
  <ellipse cx="32" cy="72" rx="8" ry="6" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5" transform="rotate(-20 32 72)"/>
  <!-- Front legs -->
  <ellipse cx="18" cy="62" rx="9" ry="6" fill="#66BB6A" stroke="#2E7D32" stroke-width="1.5" transform="rotate(-15 18 62)"/>
  <!-- Shell (main) -->
  <ellipse cx="52" cy="52" rx="30" ry="24" fill="#8D6E63" stroke="#4E342E" stroke-width="2"/>
  <!-- Shell pattern -->
  <ellipse cx="52" cy="48" rx="12" ry="10" fill="#A1887F" stroke="#6D4C41" stroke-width="1.5"/>
  <!-- Shell pattern segments -->
  <path d="M52,38 L52,28" fill="none" stroke="#6D4C41" stroke-width="1.5"/>
  <path d="M52,58 L52,74" fill="none" stroke="#6D4C41" stroke-width="1.5"/>
  <path d="M40,48 L24,42" fill="none" stroke="#6D4C41" stroke-width="1.5"/>
  <path d="M64,48 L80,42" fill="none" stroke="#6D4C41" stroke-width="1.5"/>
  <path d="M42,55 L30,66" fill="none" stroke="#6D4C41" stroke-width="1.5"/>
  <path d="M62,55 L74,66" fill="none" stroke="#6D4C41" stroke-width="1.5"/>
  <!-- Shell highlight -->
  <ellipse cx="52" cy="48" rx="6" ry="5" fill="#BCAAA4" opacity="0.5"/>
  <!-- Head -->
  <ellipse cx="14" cy="50" rx="12" ry="11" fill="#66BB6A" stroke="#2E7D32" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="9" cy="46" rx="3.5" ry="4" fill="white" stroke="#2E7D32" stroke-width="1.5"/>
  <ellipse cx="10" cy="47" rx="2" ry="2.5" fill="#333"/>
  <!-- Eye shine -->
  <circle cx="11" cy="45" r="1" fill="white"/>
  <!-- Smile -->
  <path d="M7,54 Q11,58 15,54" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <circle cx="7" cy="52" r="3" fill="#F48FB1" opacity="0.35"/>
  <!-- Nostril -->
  <circle cx="5" cy="48" r="1" fill="#2E7D32"/>
</svg>
