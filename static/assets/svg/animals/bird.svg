<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Tail feathers -->
  <polygon points="15,55 5,40 20,48" fill="#1E88E5" stroke="#1565C0" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="15,58 3,48 18,52" fill="#42A5F5" stroke="#1565C0" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Body -->
  <ellipse cx="45" cy="58" rx="28" ry="22" fill="#42A5F5" stroke="#1565C0" stroke-width="2"/>
  <!-- Wing -->
  <ellipse cx="38" cy="55" rx="15" ry="12" fill="#1E88E5" stroke="#1565C0" stroke-width="1.5"/>
  <ellipse cx="36" cy="54" rx="10" ry="8" fill="#64B5F6"/>
  <!-- Head -->
  <circle cx="68" cy="42" r="16" fill="#42A5F5" stroke="#1565C0" stroke-width="2"/>
  <!-- Eyes -->
  <ellipse cx="72" cy="39" rx="4" ry="4.5" fill="white" stroke="#1565C0" stroke-width="1.5"/>
  <ellipse cx="73" cy="40" rx="2" ry="2.5" fill="#333"/>
  <!-- Beak -->
  <polygon points="84,42 92,45 84,48" fill="#FF9800" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Cheek blush -->
  <circle cx="76" cy="47" r="3" fill="#F48FB1" opacity="0.5"/>
  <!-- Tuft on head -->
  <path d="M62,28 Q65,18 68,28" fill="#1E88E5" stroke="#1565C0" stroke-width="1.5"/>
  <path d="M65,29 Q70,16 72,27" fill="#42A5F5" stroke="#1565C0" stroke-width="1.5"/>
  <!-- Legs -->
  <line x1="40" y1="78" x2="40" y2="90" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="78" x2="50" y2="90" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <!-- Feet -->
  <path d="M34,90 L40,90 L46,90" fill="none" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
  <path d="M44,90 L50,90 L56,90" fill="none" stroke="#E65100" stroke-width="2" stroke-linecap="round"/>
</svg>
